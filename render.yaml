services:
  - type: web
    name: content-control-render-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLICATION_ENABLED
        value: "false"
      - key: POD_SERVICE_ENABLED
        value: "false"
      - key: POD_PRODUCTION_ENABLED
        value: "false"
      - key: POD_PUBLICATION_ENABLED
        value: "false"

