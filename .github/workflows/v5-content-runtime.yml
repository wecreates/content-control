name: V5 Remaining Content Runtime Completion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-content-runtime.yml'
      - 'scripts/v5_remaining_content_runtime_fixed.py'
      - 'scripts/gemini_content_analysis.py'
permissions:
  actions: read
  contents: write
concurrency:
  group: v5-content-runtime
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
  EXPECTED_SHA: fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download durable exact Episode 1 first-watch artifact
        uses: actions/download-artifact@v4
        with:
          name: episode1-chris-first-watch
          path: /tmp/content
          repository: wecreates/content-control
          run-id: 35818371839
          github-token: ${{ github.token }}
      - name: Verify exact Episode 1 candidate
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA  /tmp/content/EPISODE1_FIRST_WATCH.mp4" | sha256sum -c -
      - name: Generate exact-video transcript story and research evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE1_MEDIA: /tmp/content/EPISODE1_FIRST_WATCH.mp4
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python scripts/gemini_content_analysis.py
      - name: Execute 120 real V5 content controls
        env:
          EPISODE1_MEDIA: /tmp/content/EPISODE1_FIRST_WATCH.mp4
        run: |
          set -euo pipefail
          python scripts/v5_remaining_content_runtime_fixed.py
          python - <<'PY'
          import json,pathlib
          domains=['orchestration','research','caption','story','render','repair']
          total=0
          for d in domains:
            rs=sorted((pathlib.Path('runtime/v5')/d).glob('V5-*.receipt.json')); assert len(rs)==20; total+=len(rs)
            for p in rs:
              r=json.load(open(p)); assert r['status']=='RUNTIME_VERIFIED_DONE' and r['real_input_exercised'] is True and r['downstream_consumer_accepts_output'] is True and r['publication_enabled'] is False
          assert total==120
          batch=json.load(open('state/v5-content-runtime-batch.json')); assert batch['tasks_completed_this_run']==120 and batch['publication_enabled'] is False
          watch=json.load(open('state/episode1-first-watch.json')); assert watch['publication_enabled'] is False and watch['chris_first_watch_complete'] is False
          PY
          mkdir -p runtime-artifacts
          cp /tmp/render-runtime/*.mp4 runtime-artifacts/
          cp /tmp/repair-runtime/*.mp4 runtime-artifacts/
      - name: Persist runtime evidence and DONE controls
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add control/v5/orchestration control/v5/research control/v5/caption control/v5/story control/v5/render control/v5/repair
          git add runtime/v5/orchestration runtime/v5/research runtime/v5/caption runtime/v5/story runtime/v5/render runtime/v5/repair
          git add state/episode1-content-analysis.json state/episode1-orchestration-run.json state/episode1-research-evidence.json state/episode1-captions.vtt state/episode1-caption-manifest.json state/episode1-story-map.json state/episode1-render-runtime.json state/episode1-repair-candidates.json state/v5-content-runtime-batch.json
          git diff --cached --quiet && exit 0
          git commit -m 'Runtime-complete remaining V5 content controls 001-180'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-content-runtime-evidence
          path: |
            runtime/v5/orchestration/
            runtime/v5/research/
            runtime/v5/caption/
            runtime/v5/story/
            runtime/v5/render/
            runtime/v5/repair/
            runtime-artifacts/
            state/episode1-content-analysis.json
            state/episode1-captions.vtt
            state/v5-content-runtime-batch.json
          retention-days: 30
