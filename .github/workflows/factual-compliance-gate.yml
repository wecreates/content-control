name: Episode 1 Factual Compliance Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/episode1-factual-contract.json'
      - 'scripts/verify_episode1_factual_contract.py'
      - 'public/audio/episode1-narration.mp3'
      - 'remotion/V9ArticulatedVisual.jsx'
      - '.github/workflows/factual-compliance-gate.yml'
  schedule:
    - cron: '53 12 * * *'
permissions:
  contents: write
concurrency:
  group: factual-compliance-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify financial arithmetic and compliance contract
        run: python scripts/verify_episode1_factual_contract.py
      - name: Persist factual health
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/factual-compliance-health.json
          git diff --cached --quiet || git commit -m "Update Episode 1 factual compliance health"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode1-factual-compliance
          path: |
            state/episode1-factual-contract.json
            state/factual-compliance-health.json
          retention-days: 30
