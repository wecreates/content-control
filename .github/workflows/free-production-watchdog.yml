name: Free Production Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'state/content-control-health.json'
      - 'qa-output/free/final-receipt.json'
      - 'qa-output/free/history/**'
      - 'public-review/episode1-v10-free.mp4'
      - 'public/audio/**'
      - 'reference/frames/**'
      - 'remotion/Episode1V10FinalProof.jsx'
      - 'control/publication-owner-gate.json'
      - 'control/publication-separation.json'
      - 'scripts/verify_free_production_health.py'
      - 'scripts/verify_workflow_control.py'
      - 'state/canonical-workflow-registry.json'
      - 'render.yaml'
      - 'state/deployment-contract.json'
      - 'scripts/verify_deployment_contract.py'
      - 'state/runtime-integrity-manifest.json'
      - 'state/narration-transcription-health.json'
      - 'state/caption-health.json'
      - 'public-review/episode1-v10-free.vtt'
      - '.github/workflows/runtime-integrity-manifest.yml'
      - '.github/workflows/episode1-motion-v3.yml'
      - '.github/workflows/episode1-v4.yml'
      - '.github/workflows/instagram-reel-bridge.yml'
      - 'server-lowmem.js'
      - 'server.js'
      - '.github/workflows/free-production-watchdog.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: free-production-watchdog
  cancel-in-progress: true
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify canonical deployment contract
        run: python scripts/verify_deployment_contract.py
      - name: Verify workflow trigger quarantine
        run: python scripts/verify_workflow_control.py
      - name: Verify hash-bound watch server contract
        run: |
          node --check server-lowmem.js
          grep -q 'episode1-v10-free.mp4' server-lowmem.js
          grep -q 'actual===expected' server-lowmem.js
          ! grep -q 'Episode1V8VerticalProof' server-lowmem.js
          ! grep -q 'Episode1V9VerticalProof' server-lowmem.js
      - name: Verify accepted production state
        id: verify
        continue-on-error: true
        run: python scripts/verify_free_production_health.py
      - name: Persist watchdog evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/free-production-watchdog.json state/system-completion.json state/operations-snapshot.json state/workflow-control-health.json state/deployment-health.json
          git diff --cached --quiet || git commit -m "Update free production watchdog evidence"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - name: Route repair by failed invariant
        if: steps.verify.outcome == 'failure'
        run: |
          python - <<'PY' > /tmp/repair-workflows
          import json
          r=json.load(open("state/free-production-watchdog.json"))
          failed=set(r.get("failed_checks",[]))
          routes=set()

          mapping={
              "runtime_integrity_manifest":"runtime-integrity-manifest.yml",
              "live_deployment_green":"live-render-deployment-smoke.yml",
              "review_server_smoke_green":"review-server-smoke.yml",
              "factual_compliance_green":"factual-compliance-gate.yml",
              "sync_retention_green":"sync-retention-gate.yml",
              "narration_transcription_green":"narration-transcription-gate.yml",
              "caption_health_green":"narration-transcription-gate.yml",
              "dependency_security_clean":"runtime-security-audit.yml",
              "runtime_locks_present":"generate-runtime-locks.yml",
          }
          for check,wf in mapping.items():
              if check in failed:
                  routes.add(wf)

          if failed & {"provenance_candidate_match","provenance_inputs_current","sbom_valid"}:
              routes.add("runtime-provenance.yml")

          auxiliary={
              "runtime_integrity_manifest","live_deployment_green","review_server_smoke_green",
              "factual_compliance_green","sync_retention_green","dependency_security_clean",
              "runtime_locks_present","provenance_candidate_match","provenance_inputs_current","sbom_valid",
              "workflow_control_green","deployment_contract_green"
          }
          if failed-auxiliary:
              routes.add("free-vision-qa.yml")

          for wf in sorted(routes):
              print(wf)
          PY
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            echo "dispatching repair: $workflow"
            gh workflow run "$workflow" --ref main
          done < /tmp/repair-workflows
      - name: Fail watchdog when repair is required
        if: steps.verify.outcome == 'failure'
        run: exit 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-production-watchdog
          path: |
            state/free-production-watchdog.json
            state/system-completion.json
            state/operations-snapshot.json
            state/workflow-control-health.json
            state/deployment-health.json
          retention-days: 30
