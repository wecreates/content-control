name: Autonomous CCO Control Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'control/agent-swarm.json'
      - 'control/cco-production-contract.json'
      - 'control/character-bible-v1.json'
      - 'control/style-dna-v3.json'
      - 'control/creative-director-v3.json'
      - 'control/reference-decomposition-contract.json'
      - 'scripts/verify_cco_contract.py'
      - 'scripts/validate_creative_blueprint.py'
      - '.github/workflows/autonomous-cco.yml'
      - 'scripts/autonomous_completion_scheduler.py'
      - 'scripts/initialize_capability_progress.py'
      - 'scripts/execute_capability_task.py'
      - 'state/capability-progress.json'
permissions:
  contents: read
concurrency:
  group: autonomous-cco-control
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CCO contract and preserved swarm
        run: python scripts/verify_cco_contract.py
      - name: Verify publication hard lock
        run: |
          python - <<'PY'
          import json
          a=json.load(open('control/agent-swarm.json'))
          c=json.load(open('control/cco-production-contract.json'))
          assert a['publication_enabled'] is False
          assert c['publication_enabled'] is False
          assert c['first_video_publish'] is False
          print('publication lock PASS')
          PY
      - name: Bootstrap capability completion state
        run: |
          mkdir -p state/studio state/autonomous
          python scripts/batch7_500_registry.py --out state/studio/batch7-500-registry.json
          python scripts/batch8_500_registry.py --out state/studio/batch8-500-registry.json
          python scripts/batch9_500_registry.py --out state/studio/batch9-500-registry.json
          python scripts/batch10_500_registry.py --out state/studio/batch10-500-registry.json
          python scripts/batch11_500_registry.py --out state/studio/batch11-500-registry.json
          python scripts/initialize_capability_progress.py --registries state/studio/batch7-500-registry.json state/studio/batch8-500-registry.json state/studio/batch9-500-registry.json state/studio/batch10-500-registry.json state/studio/batch11-500-registry.json --progress state/capability-progress.json --out state/capability-progress.next.json
          mv state/capability-progress.next.json state/capability-progress.json
          python scripts/autonomous_completion_scheduler.py --progress state/capability-progress.json --out state/autonomous/plan.json --shards 16 --limit 160
          python scripts/blocker_detector.py --progress state/capability-progress.json --out state/autonomous/blocker.json || true
          python scripts/blocker_repair_router.py --blocker state/autonomous/blocker.json --out state/autonomous/blocker-repair.json
      - name: Emit machine-readable cycle receipt
        run: |
          mkdir -p receipts
          python - <<'PY'
          import json,datetime,pathlib
          r={
            'status':'READY',
            'cycle':'autonomous_cco',
            'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'agents':json.load(open('control/cco-production-contract.json'))['required_agents'],
            'publication_enabled':False,
            'first_video_publish':False
          }
          pathlib.Path('receipts/cco-cycle.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cco-cycle-receipt
          path: receipts/cco-cycle.json
          retention-days: 7
