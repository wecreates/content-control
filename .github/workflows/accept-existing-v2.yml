name: Accept fully reviewed existing V2 candidate
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  revalidate:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opencv-python-headless==5.0.0.93 numpy==2.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch original render evidence without regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(python -c 'import json; n=json.load(open("state/v2-draft.json"))["run_id"]; assert type(n) is int and n>0; print(n)')
          mkdir -p state/revalidation
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > state/revalidation/run.json
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name content-control-v2-acceptance --dir state/revalidation/original
      - name: Verify integrity and apply current sampled review
        run: |
          python -m unittest tests.test_accept_existing_v2 tests.test_revalidate_v2_candidate
          python -m scripts.accept_existing_v2 --promote --artifact state/revalidation/original --run-metadata state/revalidation/run.json --out state/revalidation/result.json
      - name: Validate promoted bytes with the deployed runtime validator
        run: |
          python - <<'PYTHON'
          from scripts.accept_existing_v2 import validate_promoted_runtime
          validate_promoted_runtime('.')
          PYTHON
      - name: Persist accepted existing preview without regeneration
        run: |
          git config user.name content-control-creative-acceptance
          git config user.email actions@users.noreply.github.com
          git add -- public-review/v2-boss-fight.mp4 state/v2-health.json state/v2-runtime-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Accept exact fully reviewed V2 preview [skip ci]'
            # A concurrent main change rejects this push; never rebase stale approval.
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-existing-candidate-creative-acceptance
          path: state/revalidation/result.json
