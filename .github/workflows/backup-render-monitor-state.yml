name: Backup Render Monitor State

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backup-render-monitor-state.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export live monitor state
        shell: bash
        run: |
          set -e
          URL="https://content-control-render-worker.onrender.com/api/v1/ext/export"
          for i in {1..20}; do
            if curl -fsS --max-time 10 "$URL" -o MONITOR_STATE_BACKUP.json; then
              break
            fi
            sleep 5
          done
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('MONITOR_STATE_BACKUP.json','utf8')); if(!Array.isArray(x.watches)||!Array.isArray(x.events)) process.exit(2)"
      - name: Persist backup
        shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MONITOR_STATE_BACKUP.json
          git diff --cached --quiet || git commit -m "backup Render monitor state"
          git pull --rebase origin main
          git push origin HEAD:main
