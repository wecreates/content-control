name: Lemo Opuscar free dependency verification
on:
  pull_request:
    paths:
      - 'integrations/lemo-opuscar/**'
      - '.github/workflows/lemo-opuscar-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Clone pinned upstream
        run: |
          git clone --quiet https://github.com/lemomo-ai/lemo-opuscar.git /tmp/lemo-opuscar
          cd /tmp/lemo-opuscar
          git checkout --quiet fdc46d7f0e20cc953a71d56241a92d1b4cb7298e
          test -f DIRECTOR.md
          test -f TECHNIQUE.md
          test -d styles
      - name: Verify local tools and style catalog
        run: |
          node --version
          python --version
          ffmpeg -version | head -1
          python - <<'PY'
          import pathlib
          root=pathlib.Path('/tmp/lemo-opuscar/styles')
          n=sum(1 for _ in root.glob('*/STYLE.md'))
          assert n>=40, f'Only {n} style guides'
          print(f'Found {n} style guides')
          PY
      - name: Create original animated video with FFmpeg
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=white:s=720x1280:r=24:d=3" -f lavfi -i "sine=frequency=440:duration=3" -vf "drawbox=x='100+100*t':y=400:w=60:h=60:color=black:t=fill" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/lemo-proof.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/lemo-proof.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: lemo-code-animation-smoke
          path: /tmp/lemo-proof.mp4
          retention-days: 7
