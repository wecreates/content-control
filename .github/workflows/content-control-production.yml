name: Content Control Production DAG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/**'
      - 'state/**'
      - '.github/workflows/content-control-production.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: content-control-channel-1
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      gemini_ready: ${{ steps.secrets.outputs.gemini_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "gemini_ready=true" >> "$GITHUB_OUTPUT"; else echo "gemini_ready=false" >> "$GITHUB_OUTPUT"; fi
          mkdir -p receipts
          printf '{"lane":"preflight","status":"passed","publication_enabled":false}\n' > receipts/preflight.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-preflight, path: receipts/preflight.json}
  research_sources:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"research_sources","status":"ready_for_real_work"}\n' > receipts/research.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-research, path: receipts/research.json}
  story_evidence:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"story_evidence","status":"ready_for_real_work"}\n' > receipts/story.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-story, path: receipts/story.json}
  animation_motion:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"animation_motion","status":"ready_for_real_work"}\n' > receipts/animation.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-animation, path: receipts/animation.json}
  audio_sound:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"audio_sound","status":"ready_for_real_work"}\n' > receipts/audio.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-audio, path: receipts/audio.json}
  packaging_mobile:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"packaging_mobile","status":"ready_for_real_work"}\n' > receipts/packaging.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-packaging, path: receipts/packaging.json}
  channel_artifact:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"channel_artifact","status":"ready_for_real_work"}\n' > receipts/channel.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-channel, path: receipts/channel.json}
  qa_fanin:
    needs: [research_sources, story_evidence, animation_motion, audio_sound]
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"qa_fanin","status":"dependencies_completed","approval":false}\n' > receipts/qa.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-qa, path: receipts/qa.json}
  assembly_gate:
    needs: [qa_fanin, packaging_mobile]
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"assembly_gate","status":"awaiting_exact_production_inputs","production_lock":false}\n' > receipts/assembly.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-assembly, path: receipts/assembly.json}
  exact_reviewer:
    needs: [assembly_gate, channel_artifact, preflight]
    runs-on: ubuntu-latest
    steps:
      - env:
          GEMINI_READY: ${{ needs.preflight.outputs.gemini_ready }}
        run: |
          mkdir -p receipts
          printf '{"lane":"exact_reviewer","status":"blocked_until_exact_artifact","gemini_secret_present":"%s","approval":false}\n' "$GEMINI_READY" > receipts/reviewer.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-reviewer, path: receipts/reviewer.json}
  release_gate:
    needs: exact_reviewer
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p receipts
          printf '{"lane":"release_gate","publication_enabled":false,"status":"blocked_pending_qc_creator_review_and_chris_final_watch"}\n' > receipts/release.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-release, path: receipts/release.json}
