name: Migrate Free QA Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-free-assets.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install media verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and verify durable local assets
        run: |
          set -euo pipefail
          mkdir -p public/audio reference/frames
          curl --fail --location --retry 4 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/86233855-12db-439e-9203-8ac04e2d3281.mp3" -o public/audio/episode1-narration.mp3
          curl --fail --location --retry 4 "https://cdn.creativeclaw.co/u/49971af6/audio/2f8c3d65-763a-4b65-8f21-2d52c7bc92ed.mp3" -o public/audio/episode1-music.mp3
          curl --fail --location --retry 4 "https://cdn.creativeclaw.co/u/49971af6/audio/9690b9f5-bbd1-4728-b0e0-eea24b8ccceb.mp3" -o public/audio/episode1-sfx-1.mp3
          curl --fail --location --retry 4 "https://cdn.creativeclaw.co/u/49971af6/audio/9ed40957-df1a-4b57-a1fa-49905557cd0d.mp3" -o public/audio/episode1-sfx-2.mp3

          refs=(
            "https://cdn.creativeclaw.co/u/49971af6/images/5e5a74a9-2a44-4c9e-91c6-8cfaaf32d5f6.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/f2f4e9dc-e97d-4878-b530-b5849915ad79.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/c6170d7c-d339-421a-b73b-795038a9a136.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/43bbb75a-706a-4084-b3e1-e1afa7d6fb87.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/96346673-2603-4e50-abf7-9dc6bdd4e359.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/8913c2f9-38e9-4bb6-b405-040b56fb16f6.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/1886197c-dbcb-4613-b451-7c1244b40892.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/2665d71a-b063-4283-8468-7fbffd4f3a81.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/75279b92-540e-41b6-9754-db42be2dac4b.jpg"
            "https://cdn.creativeclaw.co/u/49971af6/images/1ab9dd28-fb50-415e-83ec-22c10249044b.jpg"
          )
          i=0
          for u in "${refs[@]}"; do
            i=$((i+1))
            out=$(printf "reference/frames/ref-%02d.jpg" "$i")
            curl --fail --location --retry 4 "$u" -o "$out"
            test -s "$out"
          done

          for f in public/audio/*.mp3; do
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$f" | grep -q audio
          done
          for f in reference/frames/*.jpg; do
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$f" | grep -q video
          done
      - name: Persist assets to repository
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f public/audio reference/frames
          git diff --cached --quiet || git commit -m "Vendor durable free QA reference and audio assets"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
