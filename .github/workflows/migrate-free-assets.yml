name: Finalize Free Asset Migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-free-assets.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify local durable media
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test -s public/audio/episode1-narration.mp3
          test -s public/audio/episode1-music.mp3
          test -s public/audio/episode1-sfx-1.mp3
          test -s public/audio/episode1-sfx-2.mp3
          test "$(find reference/frames -maxdepth 1 -type f -name 'ref-*.jpg' | wc -l)" -ge 10
          for f in public/audio/*.mp3; do
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$f" | grep -q audio
          done
      - name: Point V10 at repository-local audio only
        run: |
          cat > remotion/Episode1V10FinalProof.jsx <<'EOF'
          import React from "react";
          import {AbsoluteFill,Audio,Sequence,useCurrentFrame,staticFile} from "remotion";
          import {V9ArticulatedVisual} from "./V9ArticulatedVisual";

          export const Episode1V10FinalProof=()=>{
            const frame=useCurrentFrame();
            return <AbsoluteFill style={{background:"#fff",overflow:"hidden"}}>
              <Audio src={staticFile("audio/episode1-narration.mp3")} volume={1}/>
              <Audio src={staticFile("audio/episode1-music.mp3")} volume={0.07}/>
              <Sequence from={3}><Audio src={staticFile("audio/episode1-sfx-1.mp3")} volume={0.72}/></Sequence>
              <Sequence from={150}><Audio src={staticFile("audio/episode1-sfx-2.mp3")} volume={0.58}/></Sequence>
              <Sequence from={288}><Audio src={staticFile("audio/episode1-sfx-1.mp3")} volume={0.60}/></Sequence>
              <V9ArticulatedVisual frame={frame}/>
            </AbsoluteFill>;
          };
          EOF
      - name: Persist local-only runtime
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add remotion/Episode1V10FinalProof.jsx
          git diff --cached --quiet || git commit -m "Switch V10 to repository local audio"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
