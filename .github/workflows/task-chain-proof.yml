name: Task Chain Proof
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  worker_a:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo '{"worker":"A","status":"passed"}' > out/a.json
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-a
          path: out/a.json
  worker_b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo '{"worker":"B","status":"passed"}' > out/b.json
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-b
          path: out/b.json
  dependent_c:
    needs: [worker_a, worker_b]
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo '{"worker":"C","status":"passed","depends_on":["A","B"]}' > out/c.json
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-c
          path: out/c.json
