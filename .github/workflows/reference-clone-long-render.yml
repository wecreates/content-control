name: Reference Clone Long Render
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reference-clone-long-render
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight
        run: |
          set -euo pipefail
          test -s production/reference-clones/active/longform-plan.json
          test -s production/reference-clones/active/scene-plan.json
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-free-qa.lock.txt
      - name: Build runtime props
        run: |
          python - <<'PY'
          import json,pathlib
          scene=json.load(open("production/reference-clones/active/scene-plan.json"))
          p=pathlib.Path("qa-output/reference-clone-long/props.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({"scenePlan":scene},indent=2,sort_keys=True)+"\n")
          PY
      - name: Render native 16x9 long-form proof
        run: |
          mkdir -p public-review qa-output/reference-clone-long
          npx remotion render remotion/reference-clone-long-index.jsx ReferenceCloneLong public-review/reference-clone-long-proof.raw.mp4 --props=qa-output/reference-clone-long/props.json --codec h264 --crf 25 --concurrency 2
          if [ -s public/audio/studio-dialogue.wav ]; then
            ffmpeg -y -i public-review/reference-clone-long-proof.raw.mp4 -i public/audio/studio-dialogue.wav -filter_complex "[0:a][1:a]amix=inputs=2:duration=first:normalize=0[a]" -map 0:v -map "[a]" -c:v libx264 -pix_fmt yuv420p -crf 22 -preset medium -c:a aac -b:a 192k -movflags +faststart public-review/reference-clone-long-proof.mp4
          else
            ffmpeg -y -i public-review/reference-clone-long-proof.raw.mp4 -c:v libx264 -pix_fmt yuv420p -crf 22 -preset medium -c:a aac -b:a 160k -movflags +faststart public-review/reference-clone-long-proof.mp4
          fi
          rm public-review/reference-clone-long-proof.raw.mp4
          mkdir -p qa-output/reference-clone-long/candidate-frames
          ffmpeg -y -i public-review/reference-clone-long-proof.mp4 -vf "fps=1/3" -q:v 2 qa-output/reference-clone-long/candidate-frames/cand-%03d.jpg
      - name: Long-form technical QA
        run: python scripts/longform_media_qa.py --video public-review/reference-clone-long-proof.mp4 --out qa-output/reference-clone-long/technical.json
      - name: Composition frame QA
        run: python scripts/composition_frame_qa.py --frames qa-output/reference-clone-long/candidate-frames --out qa-output/reference-clone-long/composition.json
      - name: Motion choreography QA
        run: python scripts/motion_choreography_qa.py --video public-review/reference-clone-long-proof.mp4 --out qa-output/reference-clone-long/motion.json
      - name: Bind long-form proof
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("public-review/reference-clone-long-proof.mp4")
          tech=json.load(open("qa-output/reference-clone-long/technical.json"))
          composition=json.load(open("qa-output/reference-clone-long/composition.json"))
          motion=json.load(open("qa-output/reference-clone-long/motion.json"))
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          active=json.load(open("production/reference-clones/active/activation.json"))
          ok=tech["status"]=="PASS" and composition["status"]=="PASS" and motion["status"]=="PASS"
          r={"schema_version":1,"status":"LONG_CLONE_PROOF_GREEN" if ok else "FAIL","candidate_sha256":h,"reference_id":active["reference_id"],"technical":tech,"composition":composition,"motion":motion,"publication_enabled":False}
          pathlib.Path("state/reference-clone-long-health.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          if r["status"]!="LONG_CLONE_PROOF_GREEN": raise SystemExit(3)
          PY
      - name: Persist long-form proof
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f public-review/reference-clone-long-proof.mp4 qa-output/reference-clone-long state/reference-clone-long-health.json
          git diff --cached --quiet || git commit -m "Persist native long-form clone proof"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
