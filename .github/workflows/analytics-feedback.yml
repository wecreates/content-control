name: Analytics Feedback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/analytics-input.json'
      - 'production/reference-clones/active/studio/13-final-ccsd.json'
      - 'scripts/analytics_feedback.py'
      - 'control/analytics-learning-v1.json'
      - '.github/workflows/analytics-feedback.yml'
permissions:
  contents: write
concurrency:
  group: analytics-feedback
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Input preflight
        id: input
        run: |
          if [ -s state/analytics-input.json ] && [ -s production/reference-clones/active/studio/13-final-ccsd.json ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Map analytics back to scenes
        if: steps.input.outputs.ready == 'yes'
        run: python scripts/analytics_feedback.py --ccsd production/reference-clones/active/studio/13-final-ccsd.json --analytics state/analytics-input.json --out state/analytics-feedback.json
      - name: Update creative learning memory
        if: steps.input.outputs.ready == 'yes'
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("state/creative-learning-memory.json")
          old=json.load(open(p)) if p.exists() else {"schema_version":1,"episodes":[],"rules":[],"publication_enabled":False}
          fb=json.load(open("state/analytics-feedback.json"))
          old["episodes"].append({"mapped_points":len(fb.get("mapped_points",[])),"retention_dips":fb.get("retention_dips",[])})
          old["rules"].extend(fb.get("learning_rules",[]))
          p.write_text(json.dumps(old,indent=2,sort_keys=True)+"\n")
          PY
      - name: Persist learning
        if: steps.input.outputs.ready == 'yes'
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/analytics-feedback.json state/creative-learning-memory.json
          git diff --cached --quiet || git commit -m "Learn from scene-level audience analytics"
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0 || { git rebase --abort || true; sleep $((attempt*4)); }; done
          exit 1
