name: Shot Render Farm
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: shot-render-farm
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      longform: ${{ steps.matrix.outputs.longform }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Build shard matrix
        id: matrix
        run: |
          set -euo pipefail
          test -s production/reference-clones/active/studio/render-plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open("production/reference-clones/active/studio/render-plan.json"))
          from scripts.assemble_render_shards import shard_plan
          rows=shard_plan(r)
          print("matrix="+json.dumps({"include":rows},separators=(",",":")))
          longform="yes" if json.load(open("production/reference-clones/active/scene-plan.json")).get("duration_seconds",0)>=300 else "no"
          print("longform="+longform)
          PY
  render:
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJson(needs.plan.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      max-parallel: 8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install runtime
        run: npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
      - name: Build runtime props
        run: |
          mkdir -p qa-output/render-farm
          python - <<'PY'
          import json,pathlib
          scene=json.load(open("production/reference-clones/active/scene-plan.json"))
          pathlib.Path("qa-output/render-farm/props.json").write_text(json.dumps({"scenePlan":scene},indent=2)+"\n")
          PY
      - name: Render shard
        run: |
          set -euo pipefail
          START="${{ matrix.first_frame }}"
          END="${{ matrix.last_frame }}"
          if [ "${{ needs.plan.outputs.longform }}" = "yes" ]; then
            ENTRY=remotion/reference-clone-long-index.jsx
            COMP=ReferenceCloneLong
          else
            ENTRY=remotion/reference-clone-index.jsx
            COMP=ReferenceClone
          fi
          npx remotion render "$ENTRY" "$COMP" "qa-output/render-farm/${{ matrix.id }}.mp4" --props=qa-output/render-farm/props.json --frames="$START-$END" --codec h264 --crf 25 --concurrency 2
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.id }}
          path: qa-output/render-farm/${{ matrix.id }}.mp4
          retention-days: 7
  assemble:
    needs: [plan,render]
    if: ${{ always() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: qa-output/render-farm/shards
          merge-multiple: true
      - name: Assemble sharded preview
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p public-review state
          python -m unittest discover -s tests -p test_assemble_render_shards.py -v
          python scripts/assemble_render_shards.py \
            --manifest production/reference-clones/active/studio/render-plan.json \
            --shard-dir qa-output/render-farm/shards \
            --out public-review/reference-clone-sharded-preview.mp4 \
            --receipt state/shot-render-farm-health.json
      - name: Persist farm receipt
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "main advanced during render; refusing stale preview persistence"; exit 1; }
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f state/shot-render-farm-health.json public-review/reference-clone-sharded-preview.mp4
          git diff --cached --quiet || git commit -m "Persist shot-sharded render preview"
          git push origin HEAD:main
      - name: Trigger final renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.plan.outputs.longform }}" = "yes" ]; then
            gh workflow run reference-clone-long-render.yml --ref main
          else
            gh workflow run reference-clone-render.yml --ref main
          fi
