name: Episode 1 Max-Speed Execution
on:
  workflow_dispatch:
  repository_dispatch:
    types: [artifact-ready, repair-ready, review-findings, component-verified, bottleneck-resolved]
  push:
    branches: [main]
    paths: ['production/**','review-input/**','state/canonical-ledger.json','.github/workflows/episode1-max-speed.yml']
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  group: episode1-critical-path
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.state.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - id: state
        shell: bash
        run: |
          set -euo pipefail
          if [ -f review-input/FINANCE_REVIEW_4_9.mp4 ]; then A=true; else A=false; fi
          echo "artifact=$A" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,pathlib
          pathlib.Path("receipts").mkdir(exist_ok=True)
          pathlib.Path("receipts/preflight.json").write_text(json.dumps({"status":"VERIFIED","publication_enabled":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: episode1-preflight, path: receipts/preflight.json}
  control_validation:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          files=list(pathlib.Path("control").rglob("*.json"))
          bad=[]
          for p in files:
            try: json.loads(p.read_text())
            except Exception as e: bad.append([str(p),str(e)])
          assert not bad,bad
          print(f"validated {len(files)} control JSON files")
          PY
  release_guard:
    needs: [preflight,control_validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          gates=["candidate_hash_bound","chris_first_watch","chris_changes_resolved","team_complete_av_review","finance_compare","animation_compare","zero_critical_major"]
          pathlib.Path("release-gate.json").write_text(json.dumps({"status":"LOCKED","required_gates":gates,"publication_enabled":False,"release_lock_created":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: release-gate, path: release-gate.json}
