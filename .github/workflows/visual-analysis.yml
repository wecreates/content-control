name: Visual analysis and comparison
on:
  workflow_dispatch:
    inputs:
      candidate_lane:
        description: 'Analysis only: historical V2 or health-bound canonical V10'
        type: choice
        required: true
        default: v2
        options: [v2, canonical-v10]
  schedule:
    - cron: '31 * * * *'
  push:
    branches: [main]
    paths:
      - 'public-review/v2-draft.mp4'
      - 'reference/frames/**'
      - 'state/visual-analysis/frame-review.json'
      - 'scripts/run_visual_analysis.py'
      - 'scripts/review_smoke_inputs.py'
      - 'tests/test_run_visual_analysis.py'
      - 'scripts/rendered_visual_parity.py'
      - 'scripts/visual_motion_analysis.py'
      - 'scripts/reference_frame_manifest.py'
      - 'tests/test_rendered_visual_parity.py'
      - 'tests/test_visual_motion_analysis.py'
      - 'tests/test_reference_frame_manifest.py'
      - '.github/workflows/visual-analysis.yml'
permissions:
  contents: read
concurrency:
  group: visual-analysis-${{ inputs.candidate_lane || 'v2' }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate and receipt boundaries without media dependencies
        run: python -m unittest tests.test_run_visual_analysis
      - name: Install free CPU analysis runtime
        run: python -m pip install opencv-python-headless==5.0.0.93 numpy==2.3.5
      - name: Test real decode and evidence boundaries
        run: python -m unittest tests.test_rendered_visual_parity tests.test_visual_motion_analysis tests.test_reference_frame_manifest
      - name: Analyze explicit candidate lane and bind evidence
        env:
          CANDIDATE_LANE: ${{ inputs.candidate_lane || 'v2' }}
        run: python scripts/run_visual_analysis.py --lane "$CANDIDATE_LANE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-analysis-evidence
          path: state/visual-analysis-run
          retention-days: 30
      - name: Record analysis summary
        run: |
          python - <<'PY'
          import json,os
          c=json.load(open('state/visual-analysis-run/run.json'));m=json.load(open('state/visual-analysis-run/motion.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Visual analysis ({c['candidate_lane']}): {c['analysis_status']}\nReview: {c['review']['status']}; blocker: {c['review']['blocker']}\n\nDecoded {m['decoded_frames']} frames. Comparison contact sheets and measurements are attached. Creative approval remains separate; publication disabled.\n")
          PY
