name: Hash-Bound Review Server Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-lowmem.js'
      - 'server.js'
      - 'state/content-control-health.json'
      - 'public-review/episode1-v10-free.mp4'
      - 'public-review/episode1-v10-free.vtt'
      - 'state/caption-health.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-server-smoke.yml'
  schedule:
    - cron: '11 12 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: review-server-smoke
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture candidate identity
        run: |
          echo "CANDIDATE_SHA=$(python -c 'import json; print(json.load(open("state/content-control-health.json"))["candidate_sha256"])')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact runtime
        run: npm ci --ignore-scripts
      - name: Start canonical review server
        run: |
          set -euo pipefail
          PORT=10000 node server-lowmem.js > /tmp/review-server.log 2>&1 &
          echo $! > /tmp/review-server.pid
          for i in {1..30}; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:10000/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:10000/health)" = "200"
      - name: Verify accepted hash-bound routes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          h=json.load(open("/tmp/health.json"))
          assert h["ok"] is True
          assert h["engine"]=="remotion-v10-free"
          assert h["publication"] is False
          assert h["hashBound"] is True
          assert h["captionReady"] is True
          c=json.load(open("state/caption-health.json"))
          assert h["captionSha256"]==c["caption_sha256"],(h["captionSha256"],c["caption_sha256"])
          assert h["captionCandidateSha256"]==h["expectedSha256"]
          assert h["expectedSha256"]==h["actualSha256"]
          print(h)
          PY
          test "$(curl -s -D /tmp/root.headers -o /tmp/root.html -w "%{http_code}" http://127.0.0.1:10000/)" = "200"
          grep -q 'background:#fff' /tmp/root.html
          grep -q 'Publication is disabled' /tmp/root.html
          test "$(curl -s -o /tmp/status.json -w "%{http_code}" http://127.0.0.1:10000/status)" = "200"
          python - <<'PY'
          import json
          s=json.load(open("/tmp/status.json"))
          assert isinstance(s.get("logs"),list),s
          assert s.get("publication") is False,s
          PY
          latest_code=$(curl -s -o /tmp/latest.html -D /tmp/latest.headers -w "%{http_code}" http://127.0.0.1:10000/latest)
          test "$latest_code" = "302"
          grep -qi '^location: /watch' /tmp/latest.headers
          test "$(curl -s -D /tmp/watch.headers -o /tmp/watch.html -w "%{http_code}" http://127.0.0.1:10000/watch)" = "200"
          grep -qi '^cache-control: no-store' /tmp/watch.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/watch.headers
          grep -qi '^x-frame-options: DENY' /tmp/watch.headers
          grep -qi '^referrer-policy: no-referrer' /tmp/watch.headers
          grep -q 'FREE_QA' /tmp/watch.html
          grep -q 'publication disabled' /tmp/watch.html
          grep -q 'src="/captions"' /tmp/watch.html
          test "$(curl -s -D /tmp/captions.headers -o /tmp/captions.vtt -w "%{http_code}" http://127.0.0.1:10000/captions)" = "200"
          grep -qi '^content-type: text/vtt' /tmp/captions.headers
          expected_caption=$(python -c 'import json; print(json.load(open("state/caption-health.json"))["caption_sha256"])')
          grep -qi "etag: \"$expected_caption\"" /tmp/captions.headers
          grep -q '^WEBVTT' /tmp/captions.vtt
          grep -q 'Ignore the flex and keep the math.' /tmp/captions.vtt
          test "$(curl -s -D /tmp/media.headers -o /tmp/served.mp4 -w "%{http_code}" http://127.0.0.1:10000/media)" = "200"
          grep -qi '^accept-ranges: bytes' /tmp/media.headers
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/media.headers
          grep -qi '^content-type: video/mp4' /tmp/media.headers
          test "$(curl -s -D /tmp/range.headers -H 'Range: bytes=0-1023' -o /tmp/range.bin -w "%{http_code}" http://127.0.0.1:10000/media)" = "206"
          test "$(wc -c < /tmp/range.bin)" = "1024"
          grep -qi '^content-range: bytes 0-1023/' /tmp/range.headers
          python - <<'PY'
          import hashlib,json
          expected=json.load(open("state/content-control-health.json"))["candidate_sha256"]
          actual=hashlib.sha256(open("/tmp/served.mp4","rb").read()).hexdigest()
          assert actual==expected,(actual,expected)
          print({"served_sha256":actual})
          PY
      - name: Prove fail-closed behavior on corruption
        run: |
          set -euo pipefail
          kill $(cat /tmp/review-server.pid) || true
          cp public-review/episode1-v10-free.mp4 /tmp/good.mp4
          printf X >> public-review/episode1-v10-free.mp4
          PORT=10001 node server-lowmem.js > /tmp/review-server-corrupt.log 2>&1 &
          echo $! > /tmp/review-server-corrupt.pid
          sleep 2
          test "$(curl -s -o /tmp/badhealth.json -w "%{http_code}" http://127.0.0.1:10001/health)" = "503"
          test "$(curl -s -o /tmp/badmedia.json -w "%{http_code}" http://127.0.0.1:10001/media)" = "409"
          python - <<'PY'
          import json
          h=json.load(open("/tmp/badhealth.json"))
          assert h["ok"] is False
          assert h["hashBound"] is False
          assert h["publication"] is False
          print(h)
          PY
          kill $(cat /tmp/review-server-corrupt.pid) || true
          mv /tmp/good.mp4 public-review/episode1-v10-free.mp4
      - name: Emit smoke receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          ok=pathlib.Path("/tmp/served.mp4").exists() and pathlib.Path("/tmp/badhealth.json").exists()
          health=json.loads(pathlib.Path("state/content-control-health.json").read_text())
          r={
            "schema_version":1,
            "status":"PASS" if ok else "INCOMPLETE",
            "candidate_sha256":health["candidate_sha256"],
            "accepted_route_verified":ok,
            "fail_closed_corruption_verified":ok,
            "range_streaming_verified":ok,
            "security_headers_verified":ok,
            "cache_policy_verified":ok,
            "captions_verified":ok,
            "publication_enabled":False
          }
          pathlib.Path("state/review-server-smoke.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - name: Refuse stale candidate persist
        run: |
          set -euo pipefail
          git fetch origin main
          LATEST=$(git show origin/main:state/content-control-health.json | python -c 'import json,sys; print(json.load(sys.stdin)["candidate_sha256"])')
          if [ "$LATEST" != "$CANDIDATE_SHA" ]; then
            echo "candidate advanced from $CANDIDATE_SHA to $LATEST; refusing stale persist"
            gh workflow run candidate-state-reconcile.yml --ref main || true
            exit 1
          fi
      - name: Persist passing smoke receipt
        if: success()
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/review-server-smoke.json
          git diff --cached --quiet || git commit -m "Persist hash-bound review server smoke receipt"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - name: Continue post-acceptance chain
        if: success()
        run: gh workflow run runtime-provenance.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-server-smoke
          path: |
            state/review-server-smoke.json
            /tmp/review-server.log
            /tmp/review-server-corrupt.log
          retention-days: 30
