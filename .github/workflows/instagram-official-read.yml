name: Instagram official read-only integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_official_read.py'
      - 'tests/test_instagram_official_read.py'
      - 'scripts/record_instagram_read.mjs'
      - 'tests/record-instagram-read.test.mjs'
      - 'integrations/instagram-official/**'
      - '.github/workflows/instagram-official-read.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install official Meta SDK
        run: python -m pip install -r integrations/instagram-official/requirements.txt
      - name: Verify SDK adapter without account calls
        run: |
          python -m unittest -v tests/test_instagram_official_read.py
          node --test tests/record-instagram-read.test.mjs
      - name: Read authorized Instagram account
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
        env:
          PUBLICATION_ENABLED: 'false'
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/instagram_official_read.py --out qa-output/instagram-official-read.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: instagram-read-status-no-private-media
          path: qa-output/instagram-official-read.json
          retention-days: 7

  record:
    concurrency:
      group: instagram-read-status
      cancel-in-progress: false
    needs: verify
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: instagram-read-status-no-private-media
          path: ${{ runner.temp }}/instagram-read
      - name: Record sanitized account status in existing dashboard matrix
        env:
          PUBLICATION_ENABLED: 'false'
        run: |
          set -euo pipefail
          git config user.name content-control-connection-health
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/record_instagram_read.mjs --receipt "$RUNNER_TEMP/instagram-read/instagram-official-read.json" --capabilities social-capabilities.json
            git add social-capabilities.json
            git diff --cached --quiet && exit 0
            git commit -m "Record sanitized official Instagram read status"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
