name: V2 mix runtime regression
on:
  pull_request:
    paths:
      - 'scripts/v2_sound_mix.py'
      - 'tests/test_v2_sound_mix.py'
      - '.github/workflows/v2-mix-regression.yml'
permissions:
  contents: read
jobs:
  mix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local audio tools
        run: bash scripts/ci_media_tools.sh
      - name: Verify actual PCM duration and narration tail
        run: |
          ffmpeg -version | head -1
          python -m unittest tests.test_v2_sound_mix -v
