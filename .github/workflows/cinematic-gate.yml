name: Cinematic Production Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/cinematic-director.json'
      - 'control/agent-swarm.json'
      - 'scripts/verify_cinematic_director.py'
      - '.github/workflows/cinematic-gate.yml'
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: "false"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_cinematic_director.py
      - name: Verify downstream fail-closed review
        run: |
          python - <<'PY'
          import json
          c=json.load(open('control/cinematic-director.json'))
          q=json.load(open('control/hyper-critical-qa-director.json'))
          p=json.load(open('control/cco-production-contract.json'))
          assert c['thumbnail_parity']['required']
          assert q['fail_closed']
          assert p['publication_enabled'] is False
          print('cinematic -> layout -> QA chain PASS; publication LOCKED')
          PY
