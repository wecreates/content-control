name: Episode 1 Entertainment V4 [ARCHIVED]
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode1-v4
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate V4 entertainment contract
        run: |
          python -m unittest -v tests/test_episode1_v4_entertainment.py
          python scripts/viral_motion_gate.py production/episode1/rebuild-v4/creative-spec.json --out review-output-v4-gate.json
      - name: Install render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install
      - name: Legacy voice path retired
        run: |
          echo "This legacy workflow no longer owns voice generation."
          echo "Use the canonical Studio Pipeline with Cartesia Sonic 3.6."
          exit 42
      - name: Render V4
        run: |
          set -euo pipefail
          DUR=$(cat review-output/audio-duration-v4.txt)
          END=$(python - "$DUR" <<'PY'
          import sys
          print(max(1,int(float(sys.argv[1])*30)-1))
          PY
          )
          npx remotion render remotion/index.jsx Episode1V4 review-output/EPISODE1_V4.mp4 --codec h264 --crf 20 --concurrency 2 --frames=0-$END --props=review-output/render-props-v4.json
      - name: Verify V4 runtime artifact
        run: |
          set -euo pipefail
          test -s review-output/EPISODE1_V4.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 review-output/EPISODE1_V4.mp4 > /tmp/streams
          grep -q video /tmp/streams
          grep -q audio /tmp/streams
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('review-output/EPISODE1_V4.mp4')
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)],text=True).strip())
          audio_duration=float(pathlib.Path('review-output/audio-duration-v4.txt').read_text())
          assert abs(duration-audio_duration) < 1.5, (duration,audio_duration)
          assert p.stat().st_size > 2_000_000
          state={
            'schema_version':1,
            'status':'ENTERTAINMENT_V4_REVIEW_READY',
            'rebuild':'V4-multi-engine-entertainment',
            'candidate_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'duration_seconds':duration,
            'file_size_bytes':p.stat().st_size,
            'publication_enabled':False,
            'chris_first_watch_complete':False,
            'format':'multi-engine-continuous-animation',
            'slideshow_detected':False,
            'lecture_detected':False,
            'source':'production/episode1/rebuild-v4/creative-spec.json',
            'benchmark':'control/viral-instagram-style-benchmark-v2.json'
          }
          pathlib.Path('state/episode1-v4.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          print(json.dumps(state,sort_keys=True))
          PY
      - name: Persist V4 verified state
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/episode1-v4.json
          git diff --cached --quiet || git commit -m 'Episode 1 V4 entertainment review candidate ready'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: episode1-v4-review
          path: |
            review-output/EPISODE1_V4.mp4
            review-output/audio-duration-v4.txt
            state/episode1-v4.json
            production/episode1/rebuild-v4/creative-spec.json
            review-output-v4-gate.json
          retention-days: 30
