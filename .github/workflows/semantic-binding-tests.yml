name: Semantic candidate binding tests
on:
  pull_request:
    paths:
      - 'scripts/free_semantic_qa.py'
      - 'scripts/review_smoke_inputs.py'
      - 'tests/test_free_semantic_qa.py'
      - '.github/workflows/free-vision-qa.yml'
      - '.github/workflows/semantic-binding-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_free_semantic_qa.py -v
