name: Artifact Transport
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary HTTPS URL for exact candidate"
        required: true
      expected_sha256:
        description: "Expected SHA-256"
        required: true
      filename:
        description: "Destination filename"
        required: false
        default: "FINANCE_REVIEW_4_9.mp4"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
          FILENAME: ${{ inputs.filename }}
        run: |
          mkdir -p review-input receipts
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "review-input/$FILENAME"
          echo "$EXPECTED_SHA  review-input/$FILENAME" | sha256sum -c -
          SIZE=$(stat -c%s "review-input/$FILENAME")
          printf '{"status":"verified","file":"%s","sha256":"%s","bytes":%s}\n' "$FILENAME" "$EXPECTED_SHA" "$SIZE" > receipts/artifact-transport.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-input
          path: review-input/${{ inputs.filename }}
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-transport-receipt
          path: receipts/artifact-transport.json
