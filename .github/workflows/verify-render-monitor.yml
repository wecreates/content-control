name: Verify Free Render Monitor API
# rerun after live monitor deployment

on:
  push:
    paths:
      - '.github/workflows/verify-render-monitor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live monitor lifecycle
        shell: bash
        run: |
          cat > /tmp/verify.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const API='https://content-control-render-worker.onrender.com/api/v1/ext';
          const clientId='render-monitor-smoke-'+Date.now();
          const payload={clientId,kind:'change',targetUrl:'https://example.com/',label:'Render monitor smoke'};
          async function req(url,options={}){
            const r=await fetch(url,options);
            const text=await r.text();
            let data; try{data=JSON.parse(text)}catch{data={raw:text}};
            return {status:r.status,ok:r.ok,data};
          }
          let health=null;
          for(let i=0;i<30;i++){
            health=await req('https://content-control-render-worker.onrender.com/monitor/health');
            if(health.ok) break;
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!health?.ok) throw new Error('monitor health never became ready');

          const created=await req(API+'/watch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
          if(!created.ok||!created.data?.id) throw new Error('create failed');
          const watchId=created.data.id;

          let first=null;
          let advanced=false;
          for(let i=0;i<8;i++){
            const list=await req(API+'/watch?clientId='+encodeURIComponent(clientId));
            if(!list.ok) throw new Error('list failed');
            first=(list.data?.watches||[]).find(w=>w.id===watchId)||null;
            if(first?.last_checked_at){advanced=true;break}
            await new Promise(r=>setTimeout(r,5000));
          }

          const del=await req(API+'/watch/'+encodeURIComponent(watchId)+'?clientId='+encodeURIComponent(clientId),{method:'DELETE'});
          const finalList=await req(API+'/watch?clientId='+encodeURIComponent(clientId));
          const result={
            checked_at:new Date().toISOString(),
            health_status:health.status,
            create_status:created.status,
            watchId,
            last_checked_at:first?.last_checked_at??null,
            cadence_advanced:advanced,
            delete_status:del.status,
            final_watch_count:finalList.data?.watches?.length??null,
            pass:Boolean(health.ok&&created.ok&&advanced&&del.ok&&(finalList.data?.watches?.length===0))
          };
          await fs.writeFile('RENDER_MONITOR_LIVE_VERIFICATION.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(!result.pass) process.exitCode=1;
          NODE
          node /tmp/verify.mjs
      - name: Persist live verification
        if: always()
        shell: bash
        run: |
          git config user.name "cyzor-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add RENDER_MONITOR_LIVE_VERIFICATION.json
          git diff --cached --quiet || git commit -m "verify free Render monitor API"
          git pull --rebase origin main
          git push origin HEAD:main
