name: V5 Metadata Runtime Completion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v5_metadata_runtime.py'
      - '.github/workflows/v5-metadata-runtime.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: v5-metadata-runtime
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  exercise_and_close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install metadata verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download exact real first-watch media
        uses: actions/download-artifact@v4
        with:
          name: episode1-chris-first-watch
          path: /tmp/first-watch
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35818371839
      - name: Exercise all 20 metadata controls on exact real media metadata
        env:
          META_MEDIA: /tmp/first-watch/EPISODE1_FIRST_WATCH.mp4
        run: python scripts/v5_metadata_runtime.py
      - name: Verify strict completion and persist evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          s=json.load(open('state/v5-runtime-summary.json')); assert s['registered']==400 and s['runtime_done']>=180 and s['publication_enabled'] is False and s['downstream_acceptance']=='PASS'
          m=json.load(open('state/episode1-metadata.json')); assert m['media_sha256']=='fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb' and m['publication_enabled'] is False
          rs=sorted(pathlib.Path('runtime/v5/metadata').glob('V5-*.receipt.json')); assert len(rs)==20 and all(json.load(open(p))['status']=='RUNTIME_VERIFIED_DONE' for p in rs)
          cs=sorted(pathlib.Path('control/v5/metadata').glob('*.json')); assert len(cs)==20 and all(json.load(open(p))['status']=='DONE' for p in cs)
          print(json.dumps(s,sort_keys=True))
          PY
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add control/v5/metadata runtime/v5/metadata state/v5-runtime-summary.json state/episode1-metadata.json
          git diff --cached --quiet && exit 0
          git commit -m 'Runtime-complete V5 metadata controls 361-380'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true; sleep $((attempt*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: v5-metadata-runtime-receipts
          path: |
            runtime/v5/metadata/
            state/episode1-metadata.json
            state/v5-runtime-summary.json
