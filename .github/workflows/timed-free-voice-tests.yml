name: Timed free voice tests and CPU smoke
on:
  pull_request:
    paths:
      - 'scripts/timed_free_voice.py'
      - 'scripts/smoke_timed_free_voice.py'
      - 'scripts/measure_timed_free_voice.py'
      - 'scripts/v2_free_voice.py'
      - 'scripts/v2_audio_assemble.py'
      - 'scripts/v2_clip_transcription.py'
      - 'scripts/repair_boss_voice_turn.py'
      - 'tests/test_boss_voice_turn_repair.py'
      - 'tests/test_clip_spoken_number_decoding.py'
      - 'tests/test_timed_free_voice.py'
      - 'tests/test_v2_free_voice.py'
      - 'tests/boss-fight-nonverbal-text.test.mjs'
      - 'remotion/NonverbalText.mjs'
      - 'remotion/BossFightTimeline.mjs'
      - 'remotion/BossFightShortComposition.jsx'
      - 'projects/shorts/credit-score-boss-fight/ccsd.json'
      - '.github/workflows/credit-score-boss-fight-short.yml'
      - '.github/workflows/timed-free-voice-tests.yml'
permissions:
  contents: read
  actions: read
env:
  PUBLICATION_ENABLED: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  contracts-and-real-cpu-voice:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install and require audio contract prerequisite
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 900 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg espeak-ng
          command -v ffmpeg
      - run: python -m unittest -v tests/test_timed_free_voice.py tests/test_v2_free_voice.py tests/test_clip_spoken_number_decoding.py tests/test_boss_voice_turn_repair.py
      - run: node --test tests/boss-fight-nonverbal-text.test.mjs
      - name: Verify retained actual voice artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/wecreates/content-control/actions/runs/40003044732 > retained-run.json
          gh api repos/wecreates/content-control/actions/artifacts/12522863107 > retained-artifact.json
          python - <<'PYCODE'
          import json
          run=json.load(open('retained-run.json')); artifact=json.load(open('retained-artifact.json'))
          assert run['head_sha']=='e56e156ed81803ee6083ffecd032f9210dac201c'
          assert artifact['workflow_run']['id']==40003044732 and artifact['expired'] is False
          assert artifact['name']=='timed-free-voice-real-cpu-smoke'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12522863107'
          run-id: '40003044732'
          github-token: ${{ github.token }}
          path: state
          merge-multiple: true
      - name: Verify retained voice bytes and exact current source timeline
        run: |
          python - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          from scripts.timed_free_voice import prepare_timeline
          root=Path('state/boss-fight-free-voice'); r=json.load(open(root/'timed-voice.json'))
          source=json.load(open('projects/shorts/credit-score-boss-fight/ccsd.json'))
          source['scenes'][7]['audio']['dialogue'][0]['text']='So I just stop getting punched?'
          assert r['timeline']==prepare_timeline(source), 'Retained speech source is stale'
          assert hashlib.sha256((root/'voice.wav').read_bytes()).hexdigest()==r['audio']['audio_sha256']
          for clip in r['manifest']['clips']:
              assert hashlib.sha256((root/clip['file']).read_bytes()).hexdigest()==clip['audio_sha256']
          PYCODE
      - name: One bounded clearer Dave take preserving original audio
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile numpy==2.3.5
          python scripts/repair_boss_voice_turn.py --ccsd projects/shorts/credit-score-boss-fight/ccsd.json --retained state/boss-fight-free-voice --out state/boss-fight-repaired
          mv state/boss-fight-free-voice state/boss-fight-original-evidence
          mv state/boss-fight-repaired state/boss-fight-free-voice
      - name: Require all actual dialogue at natural speed
        run: |
          python - <<'PYCODE'
          import json
          r=json.load(open('state/boss-fight-free-voice/timed-voice.json'))
          assert len(r['manifest']['clips'])==18
          assert all(c['speed']==1.0 for c in r['manifest']['clips']), 'Retiming required; do not rush speech'
          assert r['production_approved'] is False and r['publication_enabled'] is False
          PYCODE
      - name: Observe actual speech windows and align spoken captions
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 -r requirements-transcription.txt
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root=Path('state/boss-fight-free-voice')
          r=json.load(open(root/'timed-voice.json')); c=r['timeline']
          if c['scenes'][-1]['end']<r['audio']['duration']:
              c['scenes'].append({'id':'silent-tail','start':c['scenes'][-1]['end'],'end':r['audio']['duration'],'audio':{'dialogue':[]}})
          (root/'speech-ccsd.json').write_text(json.dumps(c))
          (root/'assembly.json').write_text(json.dumps(r['audio']))
          PYCODE
          python scripts/v2_clip_transcription.py --ccsd state/boss-fight-free-voice/speech-ccsd.json --assembly state/boss-fight-free-voice/assembly.json --audio state/boss-fight-free-voice/voice.wav --out state/boss-fight-free-voice/transcription.json --model medium.en --spoken-numbers
          python scripts/v2_captions.py --ccsd state/boss-fight-free-voice/speech-ccsd.json --transcription state/boss-fight-free-voice/transcription.json --audio state/boss-fight-free-voice/voice.wav --out state/boss-fight-free-voice/captions.json
          node scripts/verify_caption_frames.mjs --ccsd state/boss-fight-free-voice/speech-ccsd.json --captions state/boss-fight-free-voice/captions.json --out state/boss-fight-free-voice/caption-frames.json
          python - <<'PYCODE'
          import json
          c=json.load(open('projects/shorts/credit-score-boss-fight/ccsd.json'))
          c['caption_track']=json.load(open('state/boss-fight-free-voice/captions.json'))
          assert c['caption_track']['status']=='PASS'
          json.dump(c,open('state/boss-fight-free-voice/render-ccsd.json','w'))
          PYCODE
      - name: Render retimed Short candidate for full review
        run: |
          npm ci
          mkdir -p state/boss-fight-free-voice/render
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("state/boss-fight-free-voice/render-ccsd.json"))},separators=(",",":")))')
          npx remotion render remotion/studio-animatic-index.jsx BossFightShort state/boss-fight-free-voice/render/silent.mp4 --props="$PROPS" --codec=h264 --crf=18
          ffmpeg -nostdin -y -i state/boss-fight-free-voice/render/silent.mp4 -i state/boss-fight-free-voice/voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest state/boss-fight-free-voice/render/candidate.mp4
          ffmpeg -nostdin -v error -i state/boss-fight-free-voice/render/candidate.mp4 -f null -
          ffprobe -v error -show_streams -show_format -of json state/boss-fight-free-voice/render/candidate.mp4 > state/boss-fight-free-voice/render/ffprobe.json
          ffmpeg -nostdin -y -ss 36.5 -i state/boss-fight-free-voice/render/candidate.mp4 -frames:v 1 state/boss-fight-free-voice/render/goblin-text-review.png
          sha256sum state/boss-fight-free-voice/render/candidate.mp4 > state/boss-fight-free-voice/render/candidate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timed-free-voice-real-cpu-smoke
          path: |
            state/timed-free-voice-smoke
            state/boss-fight-free-voice
            state/boss-fight-original-evidence
          retention-days: 7
