name: Timed free voice tests and CPU smoke
on:
  pull_request:
    paths:
      - 'scripts/timed_free_voice.py'
      - 'scripts/smoke_timed_free_voice.py'
      - 'scripts/v2_free_voice.py'
      - 'scripts/v2_audio_assemble.py'
      - 'tests/test_timed_free_voice.py'
      - 'tests/test_v2_free_voice.py'
      - 'tests/boss-fight-nonverbal-text.test.mjs'
      - 'remotion/NonverbalText.mjs'
      - 'remotion/BossFightShortComposition.jsx'
      - 'projects/shorts/credit-score-boss-fight/ccsd.json'
      - '.github/workflows/credit-score-boss-fight-short.yml'
      - '.github/workflows/timed-free-voice-tests.yml'
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  contracts:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install and require audio contract prerequisite
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          command -v ffmpeg
      - run: python -m unittest -v tests/test_timed_free_voice.py tests/test_v2_free_voice.py
      - run: node --test tests/boss-fight-nonverbal-text.test.mjs
  real-cpu-voice:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install existing free CPU voice runtime without ASR or rendering
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile numpy==2.3.5
      - name: Synthesize three approved stock voices and fully decode audio
        run: python scripts/smoke_timed_free_voice.py --out-dir state/timed-free-voice-smoke
      - name: Verify actual Boss Fight dialogue fits explicit speech windows
        run: |
          python scripts/timed_free_voice.py --ccsd projects/shorts/credit-score-boss-fight/ccsd.json --out-dir state/boss-fight-free-voice
          ffmpeg -nostdin -v error -i state/boss-fight-free-voice/voice.wav -f null -
          ffprobe -v error -show_streams -show_format -of json state/boss-fight-free-voice/voice.wav > state/boss-fight-free-voice/ffprobe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timed-free-voice-real-cpu-smoke
          path: |
            state/timed-free-voice-smoke
            state/boss-fight-free-voice
          retention-days: 7
