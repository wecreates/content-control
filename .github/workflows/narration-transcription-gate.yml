name: Narration Transcription Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/audio/episode1-narration.mp3'
      - 'state/episode1-factual-contract.json'
      - 'scripts/free_transcription_qa.py'
      - 'scripts/build_verified_captions.py'
      - 'scripts/verify_captions.py'
      - 'scripts/caption_contract.py'
      - 'scripts/persist_caption_evidence.py'
      - 'tests/test_caption_provenance.py'
      - 'tests/test_persist_caption_evidence.py'
      - 'tests/test_narration_transcription_workflow.py'
      - 'requirements-transcription.txt'
      - '.github/workflows/narration-transcription-gate.yml'
  schedule:
    - cron: '37 13 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: narration-transcription-gate
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  transcribe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      - name: Verify pinned main checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare fresh transcription failure receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          output = Path('state/narration-transcription-health.json')
          report = {
              'schema_version': 1, 'status': 'FAIL', 'publication_enabled': False,
              'actual_transcript': '', 'segments': [], 'words': [],
              'checks': {'fresh_transcription_completed': False},
              'failed_checks': ['fresh_transcription_completed'],
              'reason': 'This run has not completed transcription; dependency or transcription failure leaves this receipt blocked.',
          }
          # Replace historical PASS before setup/install or any ASR import can fail.
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          report['audio_sha256'] = hashlib.sha256(Path('public/audio/episode1-narration.mp3').read_bytes()).hexdigest()
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-transcription.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en-v1
      - name: Install pinned transcription runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-transcription.txt
      - name: Transcribe actual narration and compare to approved script
        id: transcribe
        continue-on-error: true
        run: |
          python scripts/free_transcription_qa.py \
            --audio public/audio/episode1-narration.mp3 \
            --contract state/episode1-factual-contract.json \
            --output state/narration-transcription-health.json \
            --model base.en
      - name: Test canonical caption provenance
        run: python -m unittest -v tests.test_caption_provenance tests.test_persist_caption_evidence tests.test_narration_transcription_workflow
      - name: Build and verify synchronized VTT captions
        if: ${{ !cancelled() }}
        run: |
          verification_args=()
          if [ "${{ steps.transcribe.outcome }}" = success ] && [ "${{ job.status }}" = success ]; then
            python scripts/build_verified_captions.py state/narration-transcription-health.json public-review/episode1-v10-free.vtt || verification_args+=(--upstream-failed)
          else
            verification_args+=(--upstream-failed)
          fi
          python scripts/verify_captions.py public-review/episode1-v10-free.vtt state/narration-transcription-health.json state/caption-health.json "${verification_args[@]}"
      - name: Persist narration transcript evidence
        if: ${{ !cancelled() }}
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          python scripts/persist_caption_evidence.py --kind narration --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Enforce transcription gate
        if: always()
        env:
          TRANSCRIBE_OUTCOME: ${{ steps.transcribe.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          if os.environ.get('TRANSCRIBE_OUTCOME') != 'success':
              print('BLOCKED: this run did not complete transcription successfully')
              raise SystemExit(2)
          try:
              d = json.loads(Path('state/narration-transcription-health.json').read_text())
              current = hashlib.sha256(Path('public/audio/episode1-narration.mp3').read_bytes()).hexdigest()
              valid = isinstance(d, dict) and d.get('status') == 'PASS' and d.get('publication_enabled') is False and d.get('audio_sha256') == current
          except (OSError, ValueError, RecursionError):
              valid = False
          if not valid:
              print('BLOCKED: current-source publication-disabled transcription PASS required')
              raise SystemExit(2)
          print({'status': d['status'], 'actual_transcript': d.get('actual_transcript', '')})
          PY
      - name: Continue candidate promotion after caption binding
        if: success()
        run: gh workflow run candidate-state-reconcile.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narration-transcription-health
          path: |
            state/narration-transcription-health.json
            state/caption-health.json
            public-review/episode1-v10-free.vtt
          retention-days: 30
