name: Narration Transcription Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/audio/episode1-narration.mp3'
      - 'state/episode1-factual-contract.json'
      - 'scripts/free_transcription_qa.py'
      - 'scripts/build_verified_captions.py'
      - 'scripts/verify_captions.py'
      - 'requirements-transcription.txt'
      - '.github/workflows/narration-transcription-gate.yml'
  schedule:
    - cron: '37 13 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: narration-transcription-gate
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-transcription.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en-v1
      - name: Install pinned transcription runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-transcription.txt
      - name: Transcribe actual narration and compare to approved script
        id: transcribe
        continue-on-error: true
        run: |
          python scripts/free_transcription_qa.py \
            --audio public/audio/episode1-narration.mp3 \
            --contract state/episode1-factual-contract.json \
            --output state/narration-transcription-health.json \
            --model base.en
      - name: Build and verify synchronized VTT captions
        if: steps.transcribe.outcome == 'success'
        run: |
          python scripts/build_verified_captions.py state/narration-transcription-health.json public-review/episode1-v10-free.vtt
          python scripts/verify_captions.py public-review/episode1-v10-free.vtt state/narration-transcription-health.json state/caption-health.json
      - name: Persist narration transcript evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/narration-transcription-health.json
          if [ -f public-review/episode1-v10-free.vtt ]; then git add -f public-review/episode1-v10-free.vtt; fi
          if [ -f state/caption-health.json ]; then git add state/caption-health.json; fi
          git diff --cached --quiet || git commit -m "Update narration transcription health"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - name: Enforce transcription gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open("state/narration-transcription-health.json"))
          print({"status":d["status"],"actual_transcript":d["actual_transcript"]})
          if d["status"]!="PASS":
              raise SystemExit(2)
          PY
      - name: Continue candidate promotion after caption binding
        if: success()
        run: gh workflow run candidate-state-reconcile.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narration-transcription-health
          path: |
            state/narration-transcription-health.json
            state/caption-health.json
            public-review/episode1-v10-free.vtt
          retention-days: 30
