name: Studio Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/reference-clones/active/scene-plan.json'
      - 'scripts/ccsd_*.py'
      - 'control/taste-director-v1.json'
      - 'control/audio-depth-v1.json'
      - 'control/acting-depth-v1.json'
      - 'control/quality-depth-v1.json'
      - 'remotion/ArticulatedRig.jsx'
      - 'remotion/Physics2D.jsx'
      - 'scripts/reference_structure_v2.py'
      - 'scripts/typography_director.py'
      - 'scripts/apply_story_strategy.py'
      - 'scripts/reference_motion_v2.py'
      - 'scripts/taste_features.py'
      - 'scripts/inject_soundscape_path.py'
      - 'scripts/soundscape_render.py'
      - 'scripts/story_room_critic.py'
      - 'scripts/analytics_learning_v2.py'
      - 'scripts/taste_director.py'
      - 'scripts/typography_pass.py'
      - 'scripts/adaptive_score_v2.py'
      - 'scripts/soundscape_director.py'
      - 'scripts/longform_visual_director.py'
      - 'scripts/contact_physics_pass.py'
      - 'scripts/acting_director.py'
      - 'scripts/creative_depth_engine.py'
      - 'scripts/creative_candidate_selector.py'
      - 'scripts/materialize_creative_candidate.py'
      - 'scripts/rendered_candidate_qa.py'
      - 'scripts/apply_rendered_candidate.py'
      - 'scripts/story_comprehension_simulator.py'
      - 'scripts/creative_learning_profile.py'
      - 'scripts/rendered_character_identity_qa.py'
      - 'scripts/viseme_gaze_pass.py'
      - 'scripts/performance_spatial_qa.py'
      - 'scripts/auto_scene_repair.py'
      - 'scripts/taste_memory.py'
      - 'scripts/studio_intelligence_v2.py'
      - 'scripts/diagnose_multi_repair.py'
      - 'scripts/final_perceptual_master_gate.py'
      - 'tests/test_studio_intelligence_v2.py tests/test_execution_depth_v3.py tests/test_production_reality_v4.py'
      - 'scripts/execution_depth_v3.py'
      - 'scripts/render_execution_qa.py'
      - 'scripts/scene_best_ledger.py'
      - 'scripts/episode_memory_graph.py'
      - 'scripts/final_video_tribunal.py'
      - 'tests/test_execution_depth_v3.py'
      - 'scripts/production_reality_v4.py'
      - 'scripts/production_reality_media_qa.py'
      - 'scripts/scene_render_manifest_v4.py'
      - 'tests/test_production_reality_v4.py'
      - 'remotion/studio-scene-index.jsx'
      - 'scripts/assemble_scene_master.py'
      - 'scripts/batch5_realization_ledger.py'
      - 'scripts/batch6_evidence_ledger.py'
      - 'tests/test_historical_runtime_regressions.py tests/test_batch7_500_registry.py'
      - 'scripts/batch7_500_registry.py'
      - 'scripts/enforce_batch7_registry.py'
      - 'scripts/promote_batch7_capability.py'
      - 'tests/test_batch7_500_registry.py'
      - 'tests/test_creative_depth_engine.py tests/test_studio_intelligence_v2.py'
      - 'scripts/production_scheduler.py'
      - 'scripts/audience_panel_v2.py'
      - 'scripts/visual_development_v2.py'
      - 'scripts/visual_dailies_v2.py'
      - 'scripts/semantic_dailies_v2.py'
      - 'scripts/storyboard_generator_v2.py'
      - 'scripts/story_room_v2.py'
      - 'scripts/story_room.py'
      - 'scripts/storyboard_generator.py'
      - 'scripts/animatic_plan.py'
      - 'scripts/dailies_review.py'
      - 'scripts/visual_development.py'
      - 'scripts/color_script.py'
      - 'scripts/cinematography_pass.py'
      - 'scripts/rig_motion_pass.py'
      - 'scripts/simulation_fx_pass.py'
      - 'scripts/crowd_pass.py'
      - 'scripts/lighting_pass.py'
      - 'scripts/editorial_pass.py'
      - 'scripts/sound_design_pass.py'
      - 'scripts/music_score_pass.py'
      - 'scripts/dialogue_direction.py'
      - 'scripts/facial_performance_pass.py'
      - 'scripts/finishing_pass.py'
      - 'scripts/audience_panel.py'
      - 'scripts/accessibility_pass.py'
      - 'scripts/localization_plan.py'
      - 'scripts/production_tracker.py'
      - 'scripts/shot_render_plan.py'
      - 'scripts/shot_approval.py'
      - 'scripts/render_level_gate.py'
      - 'scripts/ab_development.py'
      - 'scripts/asset_memory.py'
      - 'scripts/continuity_memory.py'
      - 'scripts/version_lineage.py'
      - 'remotion/StudioAnimaticComposition.jsx'
      - 'remotion/studio-animatic-index.jsx'
      - 'remotion/MotionLibrary.jsx'
      - 'control/studio-scene-schema-v1.json'
      - 'control/studio-pipeline-v1.json'
      - 'control/asset-catalog-v1.json'
      - 'control/render-levels-v1.json'
      - '.github/workflows/studio-pipeline.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: studio-pipeline
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}

      - name: Studio contract tests
        run: python -m unittest -v tests/test_studio_stack.py tests/test_character_lock.py tests/test_visual_choreography.py tests/test_quality_depth.py tests/test_quality_depth_integration.py tests/test_creative_depth_engine.py tests/test_historical_runtime_regressions.py
      - name: Verify studio department map
        run: python scripts/verify_studio_department_map.py --out state/studio-department-health.json

      - name: Initialize studio state
        run: |
          mkdir -p state/studio
          printf '%s\n' '{"stage":"BLOCKING","publication_enabled":false}' > state/studio/shot-approval.json
          printf '%s\n' '{"level":"blocking","publication_enabled":false}' > state/studio/render-level.json

      - name: Active project preflight
        id: active
        run: |
          if [ -s production/reference-clones/active/scene-plan.json ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "No active reference yet; studio pipeline is ready."
          fi

      - name: Build canonical story state
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          mkdir -p production/reference-clones/active/studio/boards state/studio
          RID=$(python -c 'import json; print(json.load(open("production/reference-clones/active/activation.json")).get("reference_id","active"))')
          S=production/reference-clones/active/studio
          python scripts/ccsd_from_scene_plan.py --scene-plan production/reference-clones/active/scene-plan.json --project-id "$RID" --out "$S/01-ccsd.json"
          python scripts/ccsd_validate.py --input "$S/01-ccsd.json" --out state/studio/ccsd-health.json
          python scripts/story_room_v2.py --topic "$RID finance adaptation" --count 12 --out "$S/story-room.json"
          python scripts/story_room_critic.py --room "$S/story-room.json" --out "$S/story-room-critique.json"
          python scripts/apply_story_strategy.py --ccsd "$S/01-ccsd.json" --room "$S/story-room.json" --critique "$S/story-room-critique.json" --out "$S/01-story-ccsd.json"
          DUR=$(python -c 'import json; d=json.load(open("production/reference-clones/active/studio/01-story-ccsd.json")); print(max(float(s["end"]) for s in d["scenes"]) if d.get("scenes") else 0)')
          if python -c 'import sys; raise SystemExit(0 if float(sys.argv[1]) >= 300 else 1)' "$DUR"; then
            python scripts/longform_visual_director.py --ccsd "$S/01-story-ccsd.json" --out "$S/01-directed-ccsd.json"
          else
            cp "$S/01-story-ccsd.json" "$S/01-directed-ccsd.json"
          fi
          python scripts/visual_development_v2.py --topic "$RID finance adaptation" --out "$S/visual-development.json"
          python scripts/ab_development.py --topic "$RID finance adaptation" --out "$S/ab-development.json"

      - name: Build boards and rough animatic
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/storyboard_generator_v2.py --ccsd "$S/01-directed-ccsd.json" --out-dir "$S/boards" --manifest "$S/storyboard-manifest.json"
          python scripts/animatic_plan.py --ccsd "$S/01-directed-ccsd.json" --out "$S/animatic.json"
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          python -m pip install -r requirements-free-qa.lock.txt
          python - <<'PY'
          import json,pathlib
          c=json.load(open("production/reference-clones/active/studio/01-directed-ccsd.json"))
          pathlib.Path("production/reference-clones/active/studio/animatic-props.json").write_text(json.dumps({"ccsd":c},indent=2,sort_keys=True)+"\n")
          PY
          npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic "$S/animatic.mp4" --props="$S/animatic-props.json" --scale=0.5 --codec h264 --crf 28 --concurrency 2

      - name: AI dailies and audience preflight
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/visual_dailies_v2.py --animatic "$S/animatic.json" --video "$S/animatic.mp4" --out "$S/dailies.json"
          python scripts/semantic_dailies_v2.py --video "$S/animatic.mp4" --ccsd "$S/01-directed-ccsd.json" --frames "$S/dailies-frames" --out "$S/semantic-dailies.json"
          python scripts/audience_panel_v2.py --video "$S/animatic.mp4" --ccsd "$S/01-directed-ccsd.json" --out "$S/audience-panel.json"

      - name: Promote to spline
        if: steps.active.outputs.ready == 'yes'
        run: |
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          printf '%s\n' '{"checks":{"boards":true,"animatic":true,"dailies":true,"audience":true}}' > state/studio/render-checks.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json

      - name: Run downstream studio departments
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/color_script.py --ccsd "$S/01-directed-ccsd.json" --out "$S/02-color.json"
          python scripts/cinematography_pass.py --ccsd "$S/02-color.json" --out "$S/03-camera.json"
          python scripts/rig_motion_pass.py --ccsd "$S/03-camera.json" --out "$S/04-rig.json"
          python scripts/acting_director.py --ccsd "$S/04-rig.json" --out "$S/05-acting.json"
          python scripts/simulation_fx_pass.py --ccsd "$S/05-acting.json" --out "$S/06-fx.json"
          python scripts/lighting_pass.py --ccsd "$S/06-fx.json" --out "$S/07-lighting.json"
          python scripts/crowd_pass.py --ccsd "$S/07-lighting.json" --out "$S/08-crowd.json"
          python scripts/editorial_pass.py --ccsd "$S/08-crowd.json" --out "$S/09-editorial.json"
          python scripts/dialogue_direction.py --ccsd "$S/09-editorial.json" --out "$S/10-dialogue.json"
          python scripts/facial_performance_pass.py --ccsd "$S/10-dialogue.json" --out "$S/11-face.json"
          python scripts/typography_pass.py --ccsd "$S/11-face.json" --out "$S/12-type.json"
          python scripts/finishing_pass.py --ccsd "$S/12-type.json" --out "$S/13-final-ccsd.json"
          python scripts/ccsd_validate.py --input "$S/13-final-ccsd.json" --out state/studio/final-ccsd-health.json
      - name: Apply composition and visual choreography
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/composition_director.py --ccsd "$S/13-final-ccsd.json" --out "$S/14-composition.json"
          python scripts/visual_choreography.py --ccsd "$S/14-composition.json" --out "$S/15-choreography.json"
          python scripts/contact_physics_pass.py --ccsd "$S/15-choreography.json" --out "$S/16-contact.json"
          python scripts/soundscape_director.py --ccsd "$S/16-contact.json" --out "$S/17-soundscape.json"
          python scripts/adaptive_score_v2.py --ccsd "$S/17-soundscape.json" --out "$S/18-score.json"
          python scripts/creative_depth_engine.py --ccsd "$S/18-score.json" --out "$S/18-depth-pre.json"
          python scripts/viseme_gaze_pass.py --ccsd "$S/18-depth-pre.json" --out "$S/18-viseme.json"
          python scripts/studio_intelligence_v2.py --ccsd "$S/18-viseme.json" --out "$S/18-v2.json"
          python scripts/execution_depth_v3.py --ccsd "$S/18-v2.json" --out "$S/18-v3.json"
          python scripts/production_reality_v4.py --ccsd "$S/18-v3.json" --out "$S/18-depth.json"
          python scripts/scene_render_manifest_v4.py --ccsd "$S/18-depth.json" --out state/studio/scene-render-manifest-v4.json
          python scripts/batch5_realization_ledger.py --out state/studio/batch5-realization-ledger.json
          python scripts/batch6_evidence_ledger.py --out state/studio/batch6-evidence-ledger.json
          python scripts/batch7_500_registry.py --out state/studio/batch7-500-registry.json
          python scripts/enforce_batch7_registry.py --registry state/studio/batch7-500-registry.json --out state/studio/batch7-health.json
          python scripts/creative_candidate_selector.py --ccsd "$S/18-depth.json" --out "$S/18-master-ccsd.json" --receipt state/studio/creative-candidates.json --learning-profile state/creative-learning-profile.json
          python scripts/choreography_qa.py --ccsd "$S/18-master-ccsd.json" --out state/studio/choreography-health.json
          python scripts/soundscape_render.py --ccsd "$S/18-master-ccsd.json" --out public/audio/studio-soundscape.wav --receipt state/studio/soundscape-health.json

      - name: Render and measure creative A-B-C candidates
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          mkdir -p "$S/candidates"
          for C in clarity energy comedy; do
            python scripts/materialize_creative_candidate.py --ccsd "$S/18-master-ccsd.json" --candidate "$C" --out "$S/candidates/$C.json"
            python - "$C" <<'PY'
          import json,pathlib,sys
          c=sys.argv[1]
          d=json.load(open(f"production/reference-clones/active/studio/candidates/{c}.json"))
          pathlib.Path(f"production/reference-clones/active/studio/candidates/{c}-props.json").write_text(json.dumps({"ccsd":d},indent=2)+"\n")
          PY
            npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic "$S/candidates/$C.mp4" --props="$S/candidates/$C-props.json" --scale=0.35 --codec h264 --crf 30 --concurrency 2
          done
          python scripts/rendered_candidate_qa.py --candidates clarity="$S/candidates/clarity.mp4" energy="$S/candidates/energy.mp4" comedy="$S/candidates/comedy.mp4" --out state/studio/rendered-candidate-qa.json --min-score 0.58
          python scripts/apply_rendered_candidate.py --ccsd "$S/18-master-ccsd.json" --receipt state/studio/rendered-candidate-qa.json --out "$S/18-measured-winner.json"
          cp "$S/18-measured-winner.json" "$S/18-master-ccsd.json"
          set +e
          python scripts/story_comprehension_simulator.py --ccsd "$S/18-master-ccsd.json" --out state/studio/story-comprehension.json
          STORY_RC=$?
          python scripts/performance_spatial_qa.py --ccsd "$S/18-master-ccsd.json" --out state/studio/performance-spatial.json
          SPATIAL_RC=$?
          set -e
          if [ "$STORY_RC" != "0" ] || [ "$SPATIAL_RC" != "0" ]; then
            python scripts/diagnose_multi_repair.py --ccsd "$S/18-master-ccsd.json" --story state/studio/story-comprehension.json --spatial state/studio/performance-spatial.json --diagnosis state/studio/repair-diagnosis.json --variants-dir "$S/repair-variants"
            python scripts/auto_scene_repair.py --ccsd "$S/repair-variants/clarity.json" --story state/studio/story-comprehension.json --spatial state/studio/performance-spatial.json --out "$S/18-repaired.json"
            cp "$S/18-repaired.json" "$S/18-master-ccsd.json"
            python scripts/story_comprehension_simulator.py --ccsd "$S/18-master-ccsd.json" --out state/studio/story-comprehension-postrepair.json
            python scripts/performance_spatial_qa.py --ccsd "$S/18-master-ccsd.json" --out state/studio/performance-spatial-postrepair.json
          fi
          SCORE=$(python -c 'import json; d=json.load(open("state/studio/rendered-candidate-qa.json")); print((d.get("winner") or {}).get("score",0))')
          python scripts/creative_learning_profile.py --profile state/creative-learning-profile.json --receipt state/studio/rendered-candidate-qa.json --reward "$SCORE" --out state/creative-learning-profile.json

      - name: Production support and continuity
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/accessibility_pass.py --ccsd "$S/18-master-ccsd.json" --out "$S/accessibility.json"
          python scripts/localization_plan.py --ccsd "$S/18-master-ccsd.json" --out "$S/localization.json"
          python scripts/production_scheduler.py --ccsd "$S/18-master-ccsd.json" --out "$S/production-tracker.json"
          python scripts/shot_render_plan.py --ccsd "$S/18-master-ccsd.json" --out "$S/render-plan.json"
          python - <<'PY'
          import json,pathlib
          v=json.load(open("production/reference-clones/active/studio/visual-development.json"))
          assets=[{"id":"dave","type":"character"},{"id":"points_monk","type":"character"},{"id":"cashback_goblin","type":"character"}]
          assets += [{"id":x["id"],"type":"environment"} for x in v.get("environments",[])]
          assets += [{"id":x["id"],"type":"prop"} for x in v.get("props",[])]
          pathlib.Path("production/reference-clones/active/studio/assets-input.json").write_text(json.dumps(assets,indent=2)+"\n")
          PY
          python scripts/asset_memory.py --input "$S/assets-input.json" --out "$S/asset-index.json"
          python scripts/continuity_memory.py --root production --out state/continuity-memory.json
          python scripts/version_lineage.py --history state/studio/version-lineage.json --artifact "$S/18-master-ccsd.json" --reason "studio department pass" --out state/studio/version-lineage.json

      - name: Promote to polish
        if: steps.active.outputs.ready == 'yes'
        run: |
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          printf '%s\n' '{"checks":{"layout":true,"animation":true,"fx":true,"lighting":true,"editorial":true,"sound":true,"continuity":true}}' > state/studio/render-checks.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json

      - name: Build Cartesia Sonic 3.6 production voice
        if: steps.active.outputs.ready == 'yes'
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_NARRATOR: ${{ secrets.CARTESIA_VOICE_NARRATOR }}
          CARTESIA_VOICE_DAVE: ${{ secrets.CARTESIA_VOICE_DAVE }}
          CARTESIA_VOICE_POINTS_MONK: ${{ secrets.CARTESIA_VOICE_POINTS_MONK }}
          CARTESIA_VOICE_CASHBACK_GOBLIN: ${{ secrets.CARTESIA_VOICE_CASHBACK_GOBLIN }}
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          mkdir -p state/studio qa-output/studio-voice public/audio
          rm -f public/audio/reference-clone-voice.mp3 qa-output/studio-voice/cartesia.wav
          python scripts/ccsd_voice_manifest.py --ccsd "$S/18-master-ccsd.json" --out "$S/voice-dialogue.json"
          STATUS=$(python -c 'import json; print(json.load(open("production/reference-clones/active/studio/voice-dialogue.json"))["status"])')
          python scripts/voice_provider.py --out state/studio/voice-provider.json
          if [ "$STATUS" = "EMPTY" ]; then
            printf '%s\n' '{"status":"NO_DIALOGUE","provider":null,"publication_enabled":false}' > state/studio/premium-voice.json
            exit 0
          fi
          STRATEGY=$(python -c 'import json; print(json.load(open("state/studio/voice-provider.json"))["selected_strategy"])')
          if [ "$STRATEGY" = "required_provider_missing" ]; then
            printf '%s\n' '{"status":"PROVIDER_REQUIRED","provider":"cartesia","model_id":"sonic-3.6","publication_enabled":false}' > state/studio/premium-voice.json
            echo "Cartesia Sonic 3.6 is required for dialogue-bearing production. CARTESIA_API_KEY is not configured."
            exit 42
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python scripts/cartesia_sonic_generate.py \
            --dialogue "$S/voice-dialogue.json" \
            --out qa-output/studio-voice/cartesia.wav \
            --receipt state/studio/cartesia-voice.json
          CSTAT=$(python -c 'import json; print(json.load(open("state/studio/cartesia-voice.json"))["status"])')
          if [ "$CSTAT" != "PASS" ]; then
            printf '%s\n' '{"status":"CARTESIA_FAILED","provider":"cartesia","model_id":"sonic-3.6","publication_enabled":false}' > state/studio/premium-voice.json
            exit 43
          fi
          python -m pip install -r requirements-transcription.txt
          python scripts/voice_candidate_qa.py \
            --audio qa-output/studio-voice/cartesia.wav \
            --manifest "$S/voice-dialogue.json" \
            --out qa-output/studio-voice/cartesia.json \
            --model base.en
          python - <<'PY'
          import json,pathlib
          qa=json.load(open("qa-output/studio-voice/cartesia.json"))
          ok=qa.get("status")=="PASS" or qa.get("verdict")=="PASS"
          if not ok:
              raise SystemExit("Cartesia voice candidate failed QA")
          r={
            "schema_version":1,
            "status":"PASS",
            "provider":"cartesia",
            "model_id":"sonic-3.6",
            "audio":"qa-output/studio-voice/cartesia.wav",
            "qa":qa,
            "publication_enabled":False,
          }
          pathlib.Path("state/studio/premium-voice.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          ffmpeg -y -i qa-output/studio-voice/cartesia.wav -c:a libmp3lame -b:a 192k public/audio/reference-clone-voice.mp3 >/dev/null 2>&1
          test -s public/audio/reference-clone-voice.mp3

      - name: Feed studio decisions into scene plan
        if: steps.active.outputs.ready == 'yes'
        run: |
          S=production/reference-clones/active/studio
          python scripts/ccsd_to_scene_plan.py --ccsd "$S/18-master-ccsd.json" --scene-plan production/reference-clones/active/scene-plan.json --out "$S/scene-plan-studio.json"
          python scripts/inject_voiceover_path.py \
            --scene-plan "$S/scene-plan-studio.json" \
            --voice-file public/audio/reference-clone-voice.mp3 \
            --voice-public-path audio/reference-clone-voice.mp3 \
            --receipt state/studio/premium-voice.json
          cp "$S/scene-plan-studio.json" production/reference-clones/active/scene-plan.json

      - name: Final studio gate
        if: steps.active.outputs.ready == 'yes'
        run: |
          python - <<'PY'
          import json
          rows=[
            json.load(open("state/studio/final-ccsd-health.json")),
            json.load(open("production/reference-clones/active/studio/dailies.json")),
            json.load(open("production/reference-clones/active/studio/semantic-dailies.json")),
            json.load(open("production/reference-clones/active/studio/audience-panel.json")),
            json.load(open("production/reference-clones/active/studio/accessibility.json")),
            json.load(open("state/studio/choreography-health.json")),
          ]
          assert all(x["status"]=="PASS" for x in rows),rows
          tracker=json.load(open("production/reference-clones/active/studio/production-tracker.json"))
          assert not tracker.get("blocked_scene_ids"),tracker
          PY
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          printf '%s\n' '{"checks":{"studio_gate":true,"render_plan":true,"accessibility":true,"localization":true}}' > state/studio/render-checks.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json
          python - <<'PY'
          import json
          a=json.load(open("state/studio/shot-approval.json"))
          r=json.load(open("state/studio/render-level.json"))
          assert a["stage"]=="FINAL" and a["approved"] is True,a
          assert r["level"]=="final",r
          PY

      - name: Persist studio project
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f production/reference-clones/active state/studio state/continuity-memory.json state/studio-department-health.json qa-output/studio-voice || true
          [ ! -s public/audio/reference-clone-voice.mp3 ] || git add -f public/audio/reference-clone-voice.mp3
          [ ! -s public/audio/studio-soundscape.wav ] || git add -f public/audio/studio-soundscape.wav
          git diff --cached --quiet || git commit -m "Run full AI studio department pipeline"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1

      - name: Hand off studio-approved project to render farm
        if: steps.active.outputs.ready == 'yes' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shot-render-farm.yml --ref main
