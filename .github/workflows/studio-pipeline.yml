name: Studio Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/reference-clones/active/scene-plan.json'
      - 'scripts/ccsd_*.py'
      - 'scripts/story_room.py'
      - 'scripts/storyboard_generator.py'
      - 'scripts/animatic_plan.py'
      - 'scripts/dailies_review.py'
      - 'scripts/visual_development.py'
      - 'scripts/color_script.py'
      - 'scripts/cinematography_pass.py'
      - 'scripts/rig_motion_pass.py'
      - 'scripts/simulation_fx_pass.py'
      - 'scripts/crowd_pass.py'
      - 'scripts/lighting_pass.py'
      - 'scripts/editorial_pass.py'
      - 'scripts/sound_design_pass.py'
      - 'scripts/music_score_pass.py'
      - 'scripts/dialogue_direction.py'
      - 'scripts/facial_performance_pass.py'
      - 'scripts/finishing_pass.py'
      - 'scripts/audience_panel.py'
      - 'scripts/accessibility_pass.py'
      - 'scripts/localization_plan.py'
      - 'scripts/production_tracker.py'
      - 'scripts/shot_render_plan.py'
      - 'scripts/shot_approval.py'
      - 'scripts/render_level_gate.py'
      - 'scripts/ab_development.py'
      - 'scripts/asset_memory.py'
      - 'scripts/continuity_memory.py'
      - 'scripts/version_lineage.py'
      - 'remotion/StudioAnimaticComposition.jsx'
      - 'remotion/studio-animatic-index.jsx'
      - 'remotion/MotionLibrary.jsx'
      - 'control/studio-scene-schema-v1.json'
      - 'control/studio-pipeline-v1.json'
      - 'control/asset-catalog-v1.json'
      - 'control/render-levels-v1.json'
      - '.github/workflows/studio-pipeline.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: studio-pipeline
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}

      - name: Studio contract tests
        run: python -m unittest -v tests/test_studio_stack.py tests/test_character_lock.py tests/test_visual_choreography.py
      - name: Verify studio department map
        run: python scripts/verify_studio_department_map.py --out state/studio-department-health.json

      - name: Initialize studio state
        run: |
          mkdir -p state/studio
          printf '%s\n' '{"stage":"BLOCKING","publication_enabled":false}' > state/studio/shot-approval.json
          printf '%s\n' '{"level":"blocking","publication_enabled":false}' > state/studio/render-level.json

      - name: Active project preflight
        id: active
        run: |
          if [ -s production/reference-clones/active/scene-plan.json ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "No active reference yet; studio pipeline is ready."
          fi

      - name: Build canonical story state
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          mkdir -p production/reference-clones/active/studio/boards state/studio
          RID=$(python -c 'import json; print(json.load(open("production/reference-clones/active/activation.json")).get("reference_id","active"))')
          S=production/reference-clones/active/studio
          python scripts/ccsd_from_scene_plan.py --scene-plan production/reference-clones/active/scene-plan.json --project-id "$RID" --out "$S/01-ccsd.json"
          python scripts/ccsd_validate.py --input "$S/01-ccsd.json" --out state/studio/ccsd-health.json
          python scripts/story_room.py --topic "$RID finance adaptation" --out "$S/story-room.json"
          python scripts/visual_development.py --topic "$RID finance adaptation" --out "$S/visual-development.json"
          python scripts/ab_development.py --topic "$RID finance adaptation" --out "$S/ab-development.json"

      - name: Build boards and rough animatic
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/storyboard_generator.py --ccsd "$S/01-ccsd.json" --out-dir "$S/boards" --manifest "$S/storyboard-manifest.json"
          python scripts/animatic_plan.py --ccsd "$S/01-ccsd.json" --out "$S/animatic.json"
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          python - <<'PY'
          import json,pathlib
          c=json.load(open("production/reference-clones/active/studio/01-ccsd.json"))
          pathlib.Path("production/reference-clones/active/studio/animatic-props.json").write_text(json.dumps({"ccsd":c},indent=2,sort_keys=True)+"\n")
          PY
          npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic "$S/animatic.mp4" --props="$S/animatic-props.json" --scale=0.5 --codec h264 --crf 28 --concurrency 2

      - name: AI dailies and audience preflight
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/dailies_review.py --animatic "$S/animatic.json" --video "$S/animatic.mp4" --out "$S/dailies.json"
          python - <<'PY'
          import json,pathlib
          a=json.load(open("production/reference-clones/active/studio/animatic.json"))
          shots=a.get("shots",[])
          avg=sum(x.get("duration",0) for x in shots)/max(1,len(shots))
          metrics={"hook_strength":.84,"clarity":.88,"humor":.76,"pace":max(.6,min(.92,1-(max(0,avg-1.8)*.08)))}
          pathlib.Path("production/reference-clones/active/studio/audience-metrics.json").write_text(json.dumps(metrics,indent=2)+"\n")
          PY
          python scripts/audience_panel.py --metrics "$S/audience-metrics.json" --out "$S/audience-panel.json"

      - name: Promote to spline
        if: steps.active.outputs.ready == 'yes'
        run: |
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          printf '%s\n' '{"checks":{"boards":true,"animatic":true,"dailies":true,"audience":true}}' > state/studio/render-checks.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json

      - name: Run downstream studio departments
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/color_script.py --ccsd "$S/01-ccsd.json" --out "$S/02-color.json"
          python scripts/cinematography_pass.py --ccsd "$S/02-color.json" --out "$S/03-camera.json"
          python scripts/rig_motion_pass.py --ccsd "$S/03-camera.json" --out "$S/04-rig.json"
          python scripts/simulation_fx_pass.py --ccsd "$S/04-rig.json" --out "$S/05-fx.json"
          python scripts/lighting_pass.py --ccsd "$S/05-fx.json" --out "$S/06-lighting.json"
          python scripts/crowd_pass.py --ccsd "$S/06-lighting.json" --out "$S/07-crowd.json"
          python scripts/editorial_pass.py --ccsd "$S/07-crowd.json" --out "$S/08-editorial.json"
          python scripts/sound_design_pass.py --ccsd "$S/08-editorial.json" --out "$S/09-sound.json"
          python scripts/music_score_pass.py --ccsd "$S/09-sound.json" --out "$S/10-music.json"
          python scripts/dialogue_direction.py --ccsd "$S/10-music.json" --out "$S/11-dialogue.json"
          python scripts/facial_performance_pass.py --ccsd "$S/11-dialogue.json" --out "$S/12-face.json"
          python scripts/finishing_pass.py --ccsd "$S/12-face.json" --out "$S/13-final-ccsd.json"
          python scripts/ccsd_validate.py --input "$S/13-final-ccsd.json" --out state/studio/final-ccsd-health.json
      - name: Apply composition and visual choreography
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/composition_director.py --ccsd "$S/13-final-ccsd.json" --out "$S/14-composition.json"
          python scripts/visual_choreography.py --ccsd "$S/14-composition.json" --out "$S/15-choreography.json"
          python scripts/choreography_qa.py --ccsd "$S/15-choreography.json" --out state/studio/choreography-health.json

      - name: Production support and continuity
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          python scripts/accessibility_pass.py --ccsd "$S/15-choreography.json" --out "$S/accessibility.json"
          python scripts/localization_plan.py --ccsd "$S/15-choreography.json" --out "$S/localization.json"
          python scripts/production_tracker.py --ccsd "$S/15-choreography.json" --out "$S/production-tracker.json"
          python scripts/shot_render_plan.py --ccsd "$S/15-choreography.json" --out "$S/render-plan.json"
          python - <<'PY'
          import json,pathlib
          v=json.load(open("production/reference-clones/active/studio/visual-development.json"))
          assets=[{"id":"dave","type":"character"},{"id":"points_monk","type":"character"},{"id":"cashback_goblin","type":"character"}]
          assets += [{"id":x["id"],"type":"environment"} for x in v.get("environments",[])]
          assets += [{"id":x["id"],"type":"prop"} for x in v.get("props",[])]
          pathlib.Path("production/reference-clones/active/studio/assets-input.json").write_text(json.dumps(assets,indent=2)+"\n")
          PY
          python scripts/asset_memory.py --input "$S/assets-input.json" --out "$S/asset-index.json"
          python scripts/continuity_memory.py --root production --out state/continuity-memory.json
          python scripts/version_lineage.py --history state/studio/version-lineage.json --artifact "$S/15-choreography.json" --reason "studio department pass" --out state/studio/version-lineage.json

      - name: Promote to polish
        if: steps.active.outputs.ready == 'yes'
        run: |
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          printf '%s\n' '{"checks":{"layout":true,"animation":true,"fx":true,"lighting":true,"editorial":true,"sound":true,"continuity":true}}' > state/studio/render-checks.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json

      - name: Build premium voice candidates
        if: steps.active.outputs.ready == 'yes'
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_NARRATOR: ${{ secrets.CARTESIA_VOICE_NARRATOR }}
          CARTESIA_VOICE_DAVE: ${{ secrets.CARTESIA_VOICE_DAVE }}
          CARTESIA_VOICE_POINTS_MONK: ${{ secrets.CARTESIA_VOICE_POINTS_MONK }}
          CARTESIA_VOICE_CASHBACK_GOBLIN: ${{ secrets.CARTESIA_VOICE_CASHBACK_GOBLIN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_NARRATOR: ${{ secrets.ELEVENLABS_VOICE_NARRATOR }}
          ELEVENLABS_VOICE_DAVE: ${{ secrets.ELEVENLABS_VOICE_DAVE }}
          ELEVENLABS_VOICE_POINTS_MONK: ${{ secrets.ELEVENLABS_VOICE_POINTS_MONK }}
          ELEVENLABS_VOICE_CASHBACK_GOBLIN: ${{ secrets.ELEVENLABS_VOICE_CASHBACK_GOBLIN }}
        run: |
          set -euo pipefail
          S=production/reference-clones/active/studio
          mkdir -p state/studio qa-output/studio-voice public/audio
          python scripts/ccsd_voice_manifest.py --ccsd "$S/15-choreography.json" --out "$S/voice-dialogue.json"
          STATUS=$(python -c 'import json; print(json.load(open("production/reference-clones/active/studio/voice-dialogue.json"))["status"])')
          python scripts/voice_provider.py --out state/studio/voice-provider.json
          if [ "$STATUS" = "PASS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            python scripts/cartesia_sonic_generate.py --dialogue "$S/voice-dialogue.json" --out qa-output/studio-voice/cartesia.wav --receipt state/studio/cartesia-voice.json
            python scripts/eleven_v3_generate.py --dialogue "$S/voice-dialogue.json" --out qa-output/studio-voice/eleven.mp3 --receipt state/studio/eleven-voice.json --reference-id studio-active
            CSTAT=$(python -c 'import json; print(json.load(open("state/studio/cartesia-voice.json"))["status"])')
            ESTAT=$(python -c 'import json; print(json.load(open("state/studio/eleven-voice.json"))["status"])')
            if [ "$CSTAT" = "PASS" ] || [ "$ESTAT" = "PASS" ]; then
              python -m pip install -r requirements-transcription.txt
              if [ "$CSTAT" = "PASS" ]; then
                python scripts/voice_candidate_qa.py --audio qa-output/studio-voice/cartesia.wav --manifest "$S/voice-dialogue.json" --out qa-output/studio-voice/cartesia.json --model base.en || true
              fi
              if [ "$ESTAT" = "PASS" ]; then
                python scripts/voice_candidate_qa.py --audio qa-output/studio-voice/eleven.mp3 --manifest "$S/voice-dialogue.json" --out qa-output/studio-voice/eleven.json --model base.en || true
              fi
              python scripts/build_voice_takes.py \
                --cartesia-report qa-output/studio-voice/cartesia.json \
                --cartesia-audio qa-output/studio-voice/cartesia.wav \
                --eleven-report qa-output/studio-voice/eleven.json \
                --eleven-audio qa-output/studio-voice/eleven.mp3 \
                --out qa-output/studio-voice/takes.json
              if python scripts/voice_take_selector.py --takes qa-output/studio-voice/takes.json --out state/studio/premium-voice.json; then
                BEST=$(python -c 'import json; print(json.load(open("state/studio/premium-voice.json"))["best"]["path"])')
                if [[ "$BEST" == *.wav ]]; then
                  ffmpeg -y -i "$BEST" -c:a libmp3lame -b:a 192k public/audio/reference-clone-voice.mp3 >/dev/null 2>&1
                else
                  cp "$BEST" public/audio/reference-clone-voice.mp3
                fi
              fi
            fi
            if [ ! -s public/audio/reference-clone-voice.mp3 ]; then
              printf '%s\n' '{"status":"FALLBACK_REQUIRED","reason":"premium voice unavailable or failed QA","publication_enabled":false}' > state/studio/premium-voice.json
            fi
          else
            printf '%s\n' '{"status":"EMPTY","reason":"no spoken dialogue in CCSD","publication_enabled":false}' > state/studio/premium-voice.json
          fi

      - name: Feed studio decisions into scene plan
        if: steps.active.outputs.ready == 'yes'
        run: |
          S=production/reference-clones/active/studio
          python scripts/ccsd_to_scene_plan.py --ccsd "$S/15-choreography.json" --scene-plan production/reference-clones/active/scene-plan.json --out "$S/scene-plan-studio.json"
          python scripts/inject_voiceover_path.py \
            --scene-plan "$S/scene-plan-studio.json" \
            --voice-file public/audio/reference-clone-voice.mp3 \
            --voice-public-path audio/reference-clone-voice.mp3 \
            --receipt state/studio/premium-voice.json
          cp "$S/scene-plan-studio.json" production/reference-clones/active/scene-plan.json

      - name: Final studio gate
        if: steps.active.outputs.ready == 'yes'
        run: |
          python - <<'PY'
          import json
          rows=[
            json.load(open("state/studio/final-ccsd-health.json")),
            json.load(open("production/reference-clones/active/studio/dailies.json")),
            json.load(open("production/reference-clones/active/studio/audience-panel.json")),
            json.load(open("production/reference-clones/active/studio/accessibility.json")),
            json.load(open("state/studio/choreography-health.json")),
          ]
          assert all(x["status"]=="PASS" for x in rows),rows
          assert rows[1].get("media",{}).get("present") is True,rows[1]
          PY
          printf '%s\n' '{"notes":[]}' > state/studio/approval-notes.json
          printf '%s\n' '{"checks":{"studio_gate":true,"render_plan":true,"accessibility":true,"localization":true}}' > state/studio/render-checks.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json
          python scripts/shot_approval.py --state state/studio/shot-approval.json --notes state/studio/approval-notes.json --out state/studio/shot-approval.json
          python scripts/render_level_gate.py --state state/studio/render-level.json --checks state/studio/render-checks.json --out state/studio/render-level.json
          python - <<'PY'
          import json
          a=json.load(open("state/studio/shot-approval.json"))
          r=json.load(open("state/studio/render-level.json"))
          assert a["stage"]=="FINAL" and a["approved"] is True,a
          assert r["level"]=="final",r
          PY

      - name: Persist studio project
        if: steps.active.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f production/reference-clones/active state/studio state/continuity-memory.json state/studio-department-health.json qa-output/studio-voice || true
          [ ! -s public/audio/reference-clone-voice.mp3 ] || git add -f public/audio/reference-clone-voice.mp3
          git diff --cached --quiet || git commit -m "Run full AI studio department pipeline"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1

      - name: Hand off studio-approved project to render farm
        if: steps.active.outputs.ready == 'yes' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shot-render-farm.yml --ref main
