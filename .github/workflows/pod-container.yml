name: POD container runtime gates
on:
  pull_request:
    paths: ['Dockerfile','.dockerignore','requirements-pod-runtime.txt','.github/workflows/pod-container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pod_test_only
          POSTGRES_DB: pod_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pod_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile -t pod-runtime .
      - name: Verify real print generation and durable review workflow in image
        run: |
          docker run --rm --network host -e POD_TEST_DATABASE_URL=postgresql://postgres:pod_test_only@localhost:5432/pod_test pod-runtime node --test tests/pod-production-e2e.mjs
          docker run --rm pod-runtime node --input-type=module -e "import {checkPodPython} from './integrations/pod/python-runtime.mjs'; if(!await checkPodPython())process.exit(1)"
      - name: Verify hosted app starts with publication and production disabled
        run: |
          docker run -d --name pod-smoke -p 10000:10000 -e PORT=10000 pod-runtime
          trap 'docker rm -f pod-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health > /tmp/pod-health.json; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/api/print/status > /tmp/pod-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/pod-status.json') as f: status=json.load(f)
          assert status['publication_enabled'] is False, status
          assert status['production_status']=='DISABLED', status
          PY
