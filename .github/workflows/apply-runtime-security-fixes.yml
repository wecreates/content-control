name: Apply Safe Runtime Security Fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-security-fixes.yml'
permissions:
  contents: write
  actions: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply non-major Remotion security update
        run: |
          set -euo pipefail
          npm install --save-exact @remotion/cli@4.0.529 remotion@4.0.529
          npm pkg set overrides.qs=6.16.0
          npm install --package-lock-only
          npm ci --ignore-scripts
          node --check server-lowmem.js
          node --check server.js
          node -e 'const p=require("./package.json"); if(p.dependencies["@remotion/cli"]!=="4.0.529"||p.dependencies.remotion!=="4.0.529") process.exit(2)'
          npm audit --json > /tmp/npm-audit-after.json || true
          python - <<'PY'
          import json
          d=json.load(open("/tmp/npm-audit-after.json"))
          v=d.get("metadata",{}).get("vulnerabilities",{})
          print(v)
          if int(v.get("critical",0))>0 or int(v.get("high",0))>0 or int(v.get("moderate",0))>0:
              raise SystemExit(3)
          PY
      - name: Persist safe dependency patch
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Patch Remotion runtime security vulnerabilities"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - name: Dispatch downstream verification
        run: |
          gh workflow run free-vision-qa.yml --ref main
          gh workflow run runtime-security-audit.yml --ref main
          gh workflow run runtime-integrity-manifest.yml --ref main
