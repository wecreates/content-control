name: OpenMontage isolated install verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/openmontage-install.yml'
      - 'integrations/openmontage/**'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg make
      - name: Checkout pinned upstream
        run: |
          git clone --quiet https://github.com/calesthio/OpenMontage.git /tmp/OpenMontage
          cd /tmp/OpenMontage
          git checkout --quiet 9327439db69021ab4b0e2776729bf3b58fdb5a87
          test -f requirements.txt
          test -d remotion-composer
      - name: Install Python and JavaScript dependencies
        run: |
          cd /tmp/OpenMontage
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          cd remotion-composer
          npm ci --ignore-scripts
      - name: Verify registry import and local tools
        run: |
          cd /tmp/OpenMontage
          .venv/bin/python -c "from tools.tool_registry import registry; registry.discover(); print(registry.support_envelope())"
          ffmpeg -version | head -1
      - name: Verify no publication is enabled
        run: |
          test ! -e /tmp/OpenMontage/.env
          echo "OpenMontage isolated dependency install and registry check complete; no deployment or publication"
