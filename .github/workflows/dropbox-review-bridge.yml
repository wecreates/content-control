name: Dropbox Exact Review Bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dropbox-review-bridge.yml']
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: "false"
jobs:
  exact_review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ingest exact candidate
        env:
          SOURCE_URL: "https://uc018ebb104b0ec5ab84167b893d.dl.dropboxusercontent.com/cd/0/get/DIprw9yq1FN5gdm5rRSFE_bEwyvmP01hIK__WROSXGDfRjv9uLssKJBS8g_jTCVz5yqzM0k99cImb8AlnVMO9iSLctbDJ6GYL_QPjyhDoGKRHDKFOV3mHe3vZ_6ZOdj55xCCIy4_VVnc_8LHSPiK3KKadXBnTqruQyg6dIYtmKz9LQ/file?c_luid=a22ccd02"
        run: |
          curl --fail --location --retry 2 "$SOURCE_URL" -o FINANCE_REVIEW_4_9.mp4
          echo "fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb  FINANCE_REVIEW_4_9.mp4" | sha256sum -c -
      - name: Upload to Gemini and review exact AV
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.error,random
          p=pathlib.Path("FINANCE_REVIEW_4_9.mp4"); key=os.environ["GEMINI_API_KEY"]
          meta=json.dumps({"file":{"display_name":p.name}}).encode()
          req=urllib.request.Request("https://generativelanguage.googleapis.com/upload/v1beta/files?key="+key,data=meta,headers={"X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start","X-Goog-Upload-Header-Content-Length":str(p.stat().st_size),"X-Goog-Upload-Header-Content-Type":"video/mp4","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r: u=r.headers["X-Goog-Upload-URL"]
          req=urllib.request.Request(u,data=p.read_bytes(),headers={"Content-Length":str(p.stat().st_size),"X-Goog-Upload-Offset":"0","X-Goog-Upload-Command":"upload, finalize"})
          with urllib.request.urlopen(req,timeout=240) as r: f=json.loads(r.read())["file"]
          for _ in range(90):
            with urllib.request.urlopen(urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/files?pageSize=100",headers={"x-goog-api-key":key}),timeout=30) as r:
              listing=json.loads(r.read())
            cur=next((x for x in listing.get("files",[]) if x.get("name")==f.get("name")),{})
            if not cur:
              time.sleep(5)
              continue
            if cur.get("state")=="ACTIVE": f=cur; break
            if cur.get("state")=="FAILED": raise RuntimeError(cur)
            time.sleep(5)
          else: raise RuntimeError("Gemini processing timeout")
          prompt="""Review this exact full consumer-finance YouTube video end-to-end, including all audio. Return strict JSON only. Find every material launch defect with timestamps. Evaluate hook, narrative clarity, factual-risk wording, character continuity, motion/acting naturalness, static/robotic holds, shot variety, text readability, narration pronunciation/cadence/prosody/fatigue, SFX timing/repetition, silence/sonic gaps, comedic timing, pacing, AV sync, ending/payoff, and readiness against polished finance/explainer and stick-animation YouTube work. Schema: {"artifact_sha256":"fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb","complete_end_to_end_review":true|false,"verdict":"PASS"|"REPAIR","critical_count":0,"major_count":0,"findings":[{"start_sec":0.0,"end_sec":0.0,"severity":"critical"|"major"|"minor","category":"","evidence":"","repair":""}],"strengths":[],"release_blockers":[]} PASS only with zero critical and zero major launch-required defects."""
          body={"contents":[{"parts":[{"file_data":{"mime_type":"video/mp4","file_uri":f["uri"]}},{"text":prompt}]}],"generationConfig":{"responseMimeType":"application/json","temperature":0.1}}
          body={"model":"gemini-3.8-flash","input":[{"type":"video","uri":f["uri"],"mime_type":"video/mp4","processing":"agentic"},{"type":"text","text":prompt}]}
          req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(body).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
          obj=None
          models=["gemini-3.8-flash","gemini-3-flash-preview"]
          for model in models:
            body["model"]=model
            for attempt in range(5):
              req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/interactions",data=json.dumps(body).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key})
              try:
                with urllib.request.urlopen(req,timeout=900) as r: obj=json.loads(r.read())
                break
              except urllib.error.HTTPError as e:
                if e.code not in (429,500,502,503,504): raise
                delay=min(60, 3*(2**attempt))+random.random()*2
                print(f"transient inference HTTP {e.code}; model={model}; retry={attempt+1}; sleep={delay:.1f}s")
                time.sleep(delay)
            if obj is not None: break
          if obj is None: raise RuntimeError("all Gemini inference retry/model routes exhausted")
          texts=[]
          for step in obj.get("steps",[]):
            if step.get("type")=="model_output":
              for item in step.get("content",[]):
                if item.get("type")=="text": texts.append(item.get("text",""))
          raw="\n".join(texts) or obj.get("output_text","")
          if raw.startswith("```"): raw=raw.strip("`").replace("json\n","",1)
          review=json.loads(raw)
          assert review["artifact_sha256"]=="fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb"
          pathlib.Path("receipts").mkdir()
          pathlib.Path("receipts/EXACT_AV_REVIEW.json").write_text(json.dumps(review,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-av-review-v49
          path: receipts/EXACT_AV_REVIEW.json
