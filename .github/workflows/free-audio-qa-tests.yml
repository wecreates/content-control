name: Free Audio QA Regression Tests
on:
  pull_request:
    paths:
      - 'scripts/free_audio_qa.py'
      - 'tests/test_free_audio_qa*.py'
      - '.github/workflows/free-audio-qa-tests.yml'
permissions:
  contents: read
jobs:
  audio-qa:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-18
        with:
          python-version: '3.12'
      - name: Install local media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run offline audio regression tests
        run: python -m unittest discover -s tests -p 'test_free_audio_qa*.py' -v
