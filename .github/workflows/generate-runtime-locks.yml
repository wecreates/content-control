name: Generate Reproducible Runtime Locks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'requirements-free-qa.txt'
      - '.github/workflows/generate-runtime-locks.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate npm lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          test -s package-lock.json
      - name: Generate exact Python lock
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements-free-qa.txt
          python -m pip freeze | sort > requirements-free-qa.lock.txt
          grep -q '^torch==' requirements-free-qa.lock.txt
          grep -q '^opencv-python-headless==' requirements-free-qa.lock.txt
          grep -q '^open-clip-torch==' requirements-free-qa.lock.txt
          grep -q '^transformers==' requirements-free-qa.lock.txt
      - name: Persist locks
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add package-lock.json requirements-free-qa.lock.txt
          git diff --cached --quiet || git commit -m "Lock zero credit runtime dependencies"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
