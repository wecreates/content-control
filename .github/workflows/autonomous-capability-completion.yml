name: Autonomous Capability Completion
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: autonomous-capability-completion
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Build current registries and parallel plan
        id: plan
        run: |
          mkdir -p state/studio state/autonomous/evidence
          python scripts/batch7_500_registry.py --out state/studio/batch7-500-registry.json
          python scripts/batch8_500_registry.py --out state/studio/batch8-500-registry.json
          python scripts/batch9_500_registry.py --out state/studio/batch9-500-registry.json
          python scripts/batch10_500_registry.py --out state/studio/batch10-500-registry.json
          python scripts/batch11_500_registry.py --out state/studio/batch11-500-registry.json
          [ -f state/capability-progress.json ] || printf '%s\n' '{"schema_version":1,"capabilities":{},"publication_enabled":false}' > state/capability-progress.json
          python scripts/persist_capability_progress.py --registries state/studio/batch7-500-registry.json state/studio/batch8-500-registry.json state/studio/batch9-500-registry.json state/studio/batch10-500-registry.json state/studio/batch11-500-registry.json --progress state/capability-progress.json --out state/capability-progress.json
          python scripts/autonomous_completion_scheduler.py --root state/studio --out state/autonomous/plan.json --shards 16 --limit 160
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("state/autonomous/plan.json"))
          shards=sorted(set(x["shard"] for x in p["tasks"]))
          print("matrix="+json.dumps({"shard":shards},separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: autonomous-plan, path: state/autonomous/plan.json, retention-days: 7}
  workers:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {name: autonomous-plan, path: state/autonomous}
      - name: Execute real capability tests for shard
        run: |
          mkdir -p state/autonomous/evidence
          PLAN=state/autonomous/plan.json
          [ -f state/autonomous/plan/plan.json ] && PLAN=state/autonomous/plan/plan.json
          python - "$PLAN" "${{ matrix.shard }}" <<'PY'
          import json,subprocess,sys
          plan=json.load(open(sys.argv[1])); shard=int(sys.argv[2])
          for t in plan["tasks"]:
            if t["shard"]!=shard: continue
            subprocess.run(["python","scripts/execute_capability_task.py","--task",json.dumps(t),"--out",f"state/autonomous/evidence/{t['capability_id']}.json"],check=False)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: "capability-evidence-${{ matrix.shard }}", path: state/autonomous/evidence, retention-days: 7}
  reconcile:
    needs: [plan,workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {pattern: capability-evidence-*, path: state/autonomous/evidence, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: autonomous-plan, path: state/autonomous}
      - name: Reconcile without false promotion
        run: |
          PLAN=state/autonomous/plan.json
          [ -f state/autonomous/plan/plan.json ] && PLAN=state/autonomous/plan/plan.json
          python scripts/reconcile_autonomous_completion.py --plan "$PLAN" --evidence-dir state/autonomous/evidence --out state/autonomous/reconciliation.json
          set +e
          python scripts/blocker_detector.py --progress state/capability-progress.json --reconciliation state/autonomous/reconciliation.json --out state/autonomous/blocker.json
          BLOCK_RC=$?
          set -e
          python scripts/blocker_repair_router.py --blocker state/autonomous/blocker.json --out state/autonomous/blocker-repair.json
          if [ "$BLOCK_RC" != "0" ]; then
            echo "Blocker detected: repair route generated before normal continuation."
          fi
          python scripts/apply_capability_evidence.py --progress state/capability-progress.json --evidence-dir state/autonomous/evidence --out state/capability-progress.next.json
          mv state/capability-progress.next.json state/capability-progress.json
          git config user.name content-control-autonomy
          git config user.email actions@users.noreply.github.com
          git add state/capability-progress.json
          git diff --cached --quiet || git commit -m "Advance autonomous capability evidence"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            sleep $((attempt*3))
          done
          [ -f state/capability-progress.json ] || printf '%s\n' '{"schema_version":1,"capabilities":{},"publication_enabled":false}' > state/capability-progress.json
          set +e
          python scripts/global_completion_gate.py --progress state/capability-progress.json --out state/autonomous/global-completion.json
          set -e
      - uses: actions/upload-artifact@v4
        with: {name: autonomous-reconciliation, path: state/autonomous/reconciliation.json, retention-days: 14}
