name: Credit Score Boss Fight Acceptance Short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shorts/credit-score-boss-fight/**'
      - 'remotion/BossFightShortComposition.jsx'
      - 'remotion/studio-animatic-index.jsx'
      - 'scripts/rendered_visual_parity.py'
      - 'scripts/production_reality_media_qa.py'
      - 'scripts/timed_free_voice.py'
      - 'scripts/v2_free_voice.py'
      - 'scripts/v2_audio_assemble.py'
      - 'control/free-voice-policy.json'
      - 'remotion/NonverbalText.mjs'
      - 'tests/test_rendered_visual_parity.py'
      - 'tests/test_production_reality_media_qa.py'
      - 'tests/test_boss_fight_viral_parity_render.py'
      - 'reference/frames/**'
      - '.github/workflows/credit-score-boss-fight-short.yml'
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: "false"
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install complete studio runtime
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile numpy==2.3.5 opencv-python-headless==5.0.0.93
      - name: Verify rendered visual parity comparator
        run: python -m unittest -v tests/test_rendered_visual_parity.py tests/test_production_reality_media_qa.py tests/test_boss_fight_viral_parity_render.py
      - name: Prepare CCSD and dialogue
        run: |
          mkdir -p state/boss-fight/render state/boss-fight/receipts
          cp projects/shorts/credit-score-boss-fight/ccsd.json state/boss-fight/ccsd.json
          python scripts/ccsd_voice_manifest.py --ccsd state/boss-fight/ccsd.json --out state/boss-fight/dialogue.json
      - name: Generate separate locked voices with free local Kokoro
        run: |
          python scripts/timed_free_voice.py --ccsd state/boss-fight/ccsd.json --out-dir state/boss-fight/free-voice
          cp state/boss-fight/free-voice/voice.wav state/boss-fight/voice.wav
          cp state/boss-fight/free-voice/timed-voice.json state/boss-fight/receipts/free-voice.json
      - name: Render complete source-timed Short
        run: |
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("state/boss-fight/ccsd.json"))},separators=(",",":")))')
          npx remotion render remotion/studio-animatic-index.jsx BossFightShort state/boss-fight/render/silent.mp4 --props="$PROPS" --codec=h264 --crf=18
          ffmpeg -y -i state/boss-fight/render/silent.mp4 -i state/boss-fight/voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest state/boss-fight/render/credit-score-boss-fight.mp4
      - name: Media reality QA
        continue-on-error: true
        run: python scripts/production_reality_media_qa.py --video state/boss-fight/render/credit-score-boss-fight.mp4 --ccsd state/boss-fight/ccsd.json --out state/boss-fight/receipts/render.json
      - name: Rendered viral-reference visual parity QA
        continue-on-error: true
        run: |
          python scripts/rendered_visual_parity.py \
            --reference-dir reference/frames \
            --candidate-video state/boss-fight/render/credit-score-boss-fight.mp4 \
            --out state/boss-fight/receipts/visual-parity.json
      - name: Final acceptance receipt
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          media=json.load(open("state/boss-fight/receipts/render.json"))
          parity=json.load(open("state/boss-fight/receipts/visual-parity.json"))
          voice=json.load(open("state/boss-fight/receipts/free-voice.json"))
          video=Path("state/boss-fight/render/credit-score-boss-fight.mp4")
          voice_ok=voice.get("status")=="PASS" and voice.get("provider")=="kokoro" and voice.get("listening_review_approved") is True
          status="PASS" if media.get("status")=="PASS" and parity.get("status")=="PASS" and voice_ok else "FAIL"
          receipt={
            "schema_version":1,
            "status":status,
            "publication_enabled":False,
            "technical_qa":media.get("status")=="PASS",
            "visual_parity_qa":parity.get("status")=="PASS",
            "voice_qa":voice_ok,
            "voice_provider":voice.get("provider"),
            "candidate_sha256":hashlib.sha256(video.read_bytes()).hexdigest(),
            "media_qa":media,
            "visual_parity":parity,
            "voice":voice,
          }
          Path("state/boss-fight/receipts/final-acceptance.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\\n")
          if status!="PASS":
              raise SystemExit("final acceptance failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: credit-score-boss-fight-acceptance-short, path: state/boss-fight, retention-days: 14}
