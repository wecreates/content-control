name: Content Control Integrated Loop
on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-control-cycle]
permissions:
  actions: write
  contents: write
  issues: write
concurrency:
  group: channel-1-integrated-loop
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  intake:
    runs-on: ubuntu-latest
    outputs:
      exact_sha: ${{ steps.state.outputs.exact_sha }}
      artifact_ready: ${{ steps.state.outputs.artifact_ready }}
      gemini_ready: ${{ steps.state.outputs.gemini_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: state
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p receipts
          echo "exact_sha=fe89b1243d1db07b94c43d97653c746f8a5cb9404554219e514a894061721bcb" >> "$GITHUB_OUTPUT"
          test -f review-input/FINANCE_REVIEW_4_9.mp4 && A=true || A=false
          test -n "$GEMINI_API_KEY" && G=true || G=false
          echo "artifact_ready=$A" >> "$GITHUB_OUTPUT"; echo "gemini_ready=$G" >> "$GITHUB_OUTPUT"
          printf '{"stage":"intake","artifact_ready":%s,"gemini_ready":%s,"publication_enabled":false}\n' "$A" "$G" > receipts/intake.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-intake, path: receipts/intake.json}

  research_sources:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"research_sources","status":"complete_or_external_gate"}\n' > receipts/research.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-research-integrated, path: receipts/research.json}
  story_evidence:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"story_evidence","status":"complete_or_external_gate"}\n' > receipts/story.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-story-integrated, path: receipts/story.json}
  animation_motion:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"animation_motion","status":"candidate_bound"}\n' > receipts/animation.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-animation-integrated, path: receipts/animation.json}
  audio_sound:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"audio_sound","status":"candidate_bound"}\n' > receipts/audio.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-audio-integrated, path: receipts/audio.json}
  packaging_channel:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p receipts && printf '{"lane":"packaging_channel","status":"candidate_bound"}\n' > receipts/package.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-packaging-channel, path: receipts/package.json}

  artifact_gate:
    needs: [intake,research_sources,story_evidence,animation_motion,audio_sound,packaging_channel]
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p receipts
          printf '{"stage":"artifact_gate","exact_sha":"%s","artifact_ready":%s,"gemini_ready":%s}\n' "${{ needs.intake.outputs.exact_sha }}" "${{ needs.intake.outputs.artifact_ready }}" "${{ needs.intake.outputs.gemini_ready }}" > receipts/gate.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-artifact-gate, path: receipts/gate.json}

  dispatch_exact_review:
    needs: [intake,artifact_gate]
    if: needs.intake.outputs.artifact_ready == 'true' && needs.intake.outputs.gemini_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run exact-av-review.yml --repo "$GITHUB_REPOSITORY"

  bottleneck_route:
    needs: [intake,artifact_gate]
    if: always() && (needs.intake.outputs.artifact_ready != 'true' || needs.intake.outputs.gemini_ready != 'true')
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p receipts
          printf '{"stage":"bottleneck_route","missing_artifact":%s,"missing_gemini_secret":%s,"action":"resolver_required","publication_enabled":false}\n' "${{ needs.intake.outputs.artifact_ready != 'true' }}" "${{ needs.intake.outputs.gemini_ready != 'true' }}" > receipts/bottleneck.json
          gh issue list --repo "$GITHUB_REPOSITORY" --search '"[Bottleneck] Exact artifact ingress"' --json number --jq 'length' | grep -q '^0$' && gh issue create --repo "$GITHUB_REPOSITORY" --title "[Bottleneck] Exact artifact ingress" --body "Integrated loop is blocked until the exact hash-bound candidate is available to GitHub Actions. Publication remains disabled." || true
      - uses: actions/upload-artifact@v4
        with: {name: receipt-integrated-bottleneck, path: receipts/bottleneck.json}

  publication_guard:
    needs: [dispatch_exact_review,bottleneck_route]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p receipts
          printf '{"publication_enabled":false,"requires":["complete exact AV review","zero launch-required critical/major findings","top-creator comparison","Chris final watch and explicit approval"]}\n' > receipts/publication.json
      - uses: actions/upload-artifact@v4
        with: {name: receipt-publication-guard, path: receipts/publication.json}
