name: OpenMontage existing adapter acceptance
on:
  pull_request:
    paths:
      - 'integrations/openmontage/**'
      - '.github/workflows/openmontage-adapter-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Checkout pinned OpenMontage
        run: |
          git clone --quiet https://github.com/calesthio/OpenMontage.git /tmp/OpenMontage
          cd /tmp/OpenMontage
          git checkout --quiet 9327439db69021ab4b0e2776729bf3b58fdb5a87
          test -z "$(git status --porcelain)"
      - name: Run actual adapter acceptance
        env:
          OPENMONTAGE_CHECKOUT: /tmp/OpenMontage
        run: python -m unittest -v integrations/openmontage/test_adapter.py
