name: Watch local video smoke test
on:
  pull_request:
    paths:
      - 'integrations/watch-video/**'
      - '.github/workflows/watch-local-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade 'yt-dlp>=2025.1.1'
      - name: Checkout reviewed upstream Watch revision
        run: |
          git clone --quiet https://github.com/bradautomates/claude-video.git /tmp/claude-video
          cd /tmp/claude-video
          git checkout --quiet 03ceb42f7fa2c4439aca01752118044baabffb8f
          test -f skills/watch/scripts/watch.py
      - name: Verify dependency preflight
        run: python /tmp/claude-video/skills/watch/scripts/setup.py --json
      - name: Create original synthetic video with narration substitute
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=640x360:r=24:d=4 -f lavfi -i sine=frequency=440:duration=4 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/watch-smoke.mp4
      - name: Watch local test video without cloud services
        run: |
          python /tmp/claude-video/skills/watch/scripts/watch.py /tmp/watch-smoke.mp4 --engine local --no-whisper --detail efficient --question "Describe visible frames and report audio evidence limitations." > /tmp/watch-report.md
          test -s /tmp/watch-report.md
          grep -Eiq 'frame|video report' /tmp/watch-report.md
      - name: Run integration bridge tests
        run: node --test integrations/watch-video/watch-bridge.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-local-smoke-report
          path: /tmp/watch-report.md
          retention-days: 7
