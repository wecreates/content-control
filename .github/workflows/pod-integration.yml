name: POD integration gates
on:
  pull_request:
    paths: ['integrations/pod/**','scripts/pod*','migrations/*pod.sql','pod-db-bridge.js','tests/pod*','tests/test_pod*.py','.github/workflows/pod-integration.yml','server-lowmem.js','requirements-pod-runtime.txt','.github/workflows/pod-database-deploy.yml']
  push:
    branches: [main]
    paths: ['integrations/pod/**','scripts/pod*','migrations/*pod.sql','pod-db-bridge.js','tests/pod*','tests/test_pod*.py','.github/workflows/pod-integration.yml','server-lowmem.js','requirements-pod-runtime.txt','.github/workflows/pod-database-deploy.yml']
  workflow_dispatch:
concurrency:
  group: pod-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pod_test_only
          POSTGRES_DB: pod_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pod_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUBLICATION_ENABLED: 'false'
      POD_PUBLICATION_ENABLED: 'false'
      POD_TEST_DATABASE_URL: postgresql://postgres:pod_test_only@localhost:5432/pod_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:pod
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install Pillow==12.3.0 numpy==2.3.5 opencv-python-headless==5.0.0.93 reportlab==4.4.9 PyMuPDF==1.26.6 fonttools==4.61.1
      - run: python -m unittest discover -s tests -p test_pod_review_export.py
      - run: python -m unittest discover -s tests -p test_pod_review_recovery.py
      - run: python -m unittest discover -s tests -p test_pod_market_intake.py
      - run: python -m unittest discover -s tests -p test_pod_evidence.py
      - run: python -m unittest discover -s tests -p test_pod_binary_io.py
      - run: python -m unittest discover -s tests -p test_pod_stage_expiry.py
      - run: python -m unittest discover -s tests -p test_pod_book_bounds.py
      - run: python -m unittest discover -s tests -p test_pod_font_rights.py
      - run: python -m unittest discover -s tests -p test_pod_kdp_interior_template_import.py
      - run: python -m unittest discover -s tests -p test_pod_raster_bounds.py
      - run: npm run test:pod-python
      - run: node --test tests/pod-production-e2e.mjs
      - run: node --check server-lowmem.js
      - run: python scripts/verify_workflow_control.py
      - run: python -m unittest discover -s tests -p test_free_review_guards.py
