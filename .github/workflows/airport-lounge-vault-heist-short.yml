name: Airport Lounge Vault Heist Short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shorts/airport-lounge-vault-heist/**'
      - '.github/workflows/airport-lounge-vault-heist-short.yml'
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: "false"
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install renderer and QA dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Build production CCSD
        run: |
          mkdir -p state/short-airport/receipts state/short-airport/render
          cp projects/shorts/airport-lounge-vault-heist/ccsd.json state/short-airport/ccsd.json
      - name: Build dialogue manifest
        run: python scripts/ccsd_voice_manifest.py --ccsd state/short-airport/ccsd.json --out state/short-airport/dialogue.json
      - name: Generate locked production voices
        continue-on-error: true
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_NARRATOR: ${{ secrets.CARTESIA_VOICE_NARRATOR }}
          CARTESIA_VOICE_DAVE: ${{ secrets.CARTESIA_VOICE_DAVE }}
          CARTESIA_VOICE_POINTS_MONK: ${{ secrets.CARTESIA_VOICE_POINTS_MONK }}
          CARTESIA_VOICE_CASHBACK_GOBLIN: ${{ secrets.CARTESIA_VOICE_CASHBACK_GOBLIN }}
        run: |
          python scripts/cartesia_sonic_generate.py --dialogue state/short-airport/dialogue.json --out state/short-airport/voice.wav --receipt state/short-airport/receipts/voice.json
      - name: Ensure usable voice track
        run: |
          if [ ! -f state/short-airport/voice.wav ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
            python scripts/local_tts_fallback.py --dialogue state/short-airport/dialogue.json --out state/short-airport/voice.wav --receipt state/short-airport/receipts/voice-fallback.json
          fi
      - name: Render Short
        run: |
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("state/short-airport/ccsd.json"))},separators=(",",":")))')
          npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic state/short-airport/render/airport-lounge-vault-heist-silent.mp4 --props="$PROPS" --codec=h264 --crf=18
          if [ -f state/short-airport/voice.wav ]; then
            ffmpeg -y -i state/short-airport/render/airport-lounge-vault-heist-silent.mp4 -i state/short-airport/voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest state/short-airport/render/airport-lounge-vault-heist.mp4
          else
            ffmpeg -y -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 -i state/short-airport/render/airport-lounge-vault-heist-silent.mp4 -map 1:v:0 -map 0:a:0 -c:v copy -c:a aac -b:a 192k -shortest state/short-airport/render/airport-lounge-vault-heist.mp4
          fi
      - name: Render media QA
        run: |
          python scripts/production_reality_media_qa.py --video state/short-airport/render/airport-lounge-vault-heist.mp4 --ccsd state/short-airport/ccsd.json --out state/short-airport/receipts/render.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-lounge-vault-heist-short
          path: state/short-airport
          retention-days: 14
