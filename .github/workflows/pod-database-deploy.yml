name: POD database deployment (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply checked-in migrations before verifying runtime access
        type: boolean
        required: true
        default: false
      provision_role:
        description: Create the dedicated pod_ runtime role if absent (never rotate existing passwords)
        type: boolean
        required: true
        default: false
      temporary_network_window:
        description: Report this runner IPv4 and pause 180 seconds for an approved temporary /32 firewall rule
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pod-database-deployment
  cancel-in-progress: false
jobs:
  database:
    if: github.ref == 'refs/heads/main'
    environment: pod-database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Report temporary runner IPv4
        if: inputs.temporary_network_window
        run: |
          RUNNER_IPV4="$(curl --fail --silent --show-error --ipv4 --max-time 15 https://api.ipify.org)"
          export RUNNER_IPV4
          node -e 'if(require("node:net").isIP(process.env.RUNNER_IPV4)!==4)process.exit(1);console.log("TEMPORARY_RUNNER_CIDR="+process.env.RUNNER_IPV4+"/32")'
      - name: Wait for approved temporary firewall rule
        if: inputs.temporary_network_window
        run: sleep 180
      - name: Migrate or inspect using dedicated credentials
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.POD_MIGRATION_DATABASE_URL }}
          POD_DATABASE_URL: ${{ secrets.POD_RUNTIME_DATABASE_URL }}
          DATABASE_RUNTIME_USER: ${{ vars.POD_RUNTIME_USER }}
          POD_STORAGE_EXPIRES_AT: ${{ vars.POD_STORAGE_EXPIRES_AT }}
          PUBLICATION_ENABLED: 'false'
          POD_PUBLICATION_ENABLED: 'false'
          APPLY: ${{ inputs.apply }}
          PROVISION_ROLE: ${{ inputs.provision_role }}
        run: |
          if [ "$PROVISION_ROLE" = true ]; then
            test "$APPLY" = true || { echo 'Provisioning requires apply'; exit 1; }
            node scripts/pod_deploy_database.mjs --apply --provision-role
          elif [ "$APPLY" = true ]; then
            node scripts/pod_deploy_database.mjs --apply
          else
            node scripts/pod_deploy_database.mjs
          fi
