name: Full Capability Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/full_validation_scheduler.py'
      - 'scripts/autonomous_completion_scheduler.py'
      - 'scripts/run_validation_shard.py'
      - 'scripts/upgrade_and_test_capability.py'
      - 'scripts/complete_task_one_by_one.py'
      - 'tests/test_full_capability_validation.py'
      - 'scripts/render_proof_capability.py'
      - '.github/workflows/full-capability-validation.yml'
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
concurrency:
  group: full-capability-validation
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      ready: ${{ steps.m.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed validation
        run: python -m unittest discover -s tests -p test_full_capability_validation.py -v
      - id: m
        run: |
          mkdir -p state/validation
          python scripts/full_validation_scheduler.py --progress state/capability-progress.json --out state/validation/plan.json --limit 500 --shards 50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("state/validation/plan.json"));s=sorted(set(x["shard"] for x in p["tasks"]))
          print("matrix="+json.dumps({"shard":s},separators=(",",":")))
          print("ready=true")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: validation-plan, path: state/validation/plan.json, retention-days: 7}
  validate:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: validation-plan, path: state/validation}
      - name: Test validation shard
        run: |
          mkdir -p state/validation/evidence
          python scripts/run_validation_shard.py --plan state/validation/plan.json --shard "${{ matrix.shard }}" --out-dir state/validation/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "validation-evidence-${{ matrix.shard }}", path: state/validation/evidence, retention-days: 7}
