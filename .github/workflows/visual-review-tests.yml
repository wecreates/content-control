name: Visual review regression tests
on:
  pull_request:
    paths:
      - 'scripts/rendered_visual_parity.py'
      - 'scripts/style_structure_diagnostic.py'
      - 'scripts/reconcile_visual_review.py'
      - 'scripts/v2_build_status.py'
      - 'tests/test_rendered_visual_parity.py'
      - 'tests/test_reconcile_visual_review.py'
      - 'tests/test_visual_review_reference_decode.py'
      - '.github/workflows/visual-review-tests.yml'
permissions:
  contents: read
concurrency:
  group: visual-review-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: 'false'
jobs:
  visual-review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, repository-pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, repository-pinned
        with:
          python-version: '3.12'
      - name: Install pinned CPU test dependencies
        run: python -m pip install opencv-python-headless==5.0.0.93 numpy==2.3.5
      - name: Test comparison and review reconciliation
        run: |
          python -m unittest discover -s tests -p 'test_rendered_visual_parity.py' -v
          python -m unittest discover -s tests -p 'test_reconcile_visual_review.py' -v
          python -m unittest discover -s tests -p 'test_visual_review_reference_decode.py' -v
