name: Long retained candidate review export
on:
  push:
    branches: [codex/long-caption-diagnostic-20261023]
    paths: ['.github/workflows/long-caption-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test completion status and process safeguards
        run: python -m unittest tests.test_v2_execution tests.test_v2_execution_processes -v
      - name: Verify successful retained candidate source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          run=api('actions/runs/40001068907')
          assert run['head_sha']=='bdf98a124a5d127550307c7c36074fd739f78bbf' and run['conclusion']=='success'
          artifact=api('actions/artifacts/12523021493')
          assert artifact['workflow_run']['id']==40001068907 and not artifact['expired']
          assert artifact['name']=='production-state-long'
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12523021493'
          run-id: '40001068907'
          github-token: ${{ github.token }}
          path: retained
          merge-multiple: true
      - name: Verify candidate and prepare separate review evidence
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          from scripts.v2_execution import mark_review_candidate
          root=pathlib.Path('retained'); out=pathlib.Path('review-evidence');out.mkdir()
          video=root/'candidate.mp4'
          digest=hashlib.sha256(video.read_bytes()).hexdigest()
          assert digest=='873dbe0a3ee19db6c7a1eb7441b20dfa35ae9e78b92dc90015ca6858f0718bcc'
          state=json.loads((root/'execution.json').read_text())
          assert state['status']=='REVIEW_CANDIDATE' and state['candidate_sha256']==digest
          qa=json.loads((root/'media-qa.json').read_text())
          assert qa['status']=='PASS' and qa['candidate_sha256']==digest and all(v is True for v in qa['checks'].values())
          for name in ['execution.json','media-qa.json','captions.json','caption-frames.json','memory.json','review-package.json','transcription-repaired.json','assembly.json']:
              shutil.copyfile(root/name,out/name)
          mark_review_candidate(state,video)
          (out/'review-execution.json').write_text(json.dumps(state,indent=2)+'\n')
          shutil.copyfile('projects/long/credit-card-dlc/ccsd.json',out/'ccsd.json')
          (out/'identity.json').write_text(json.dumps({'candidate_sha256':digest,'bytes':video.stat().st_size,'source_run':40001068907,'source_artifact':12523021493,'creative_review':'PENDING','audio_listening_review':'PENDING','publication_enabled':False},indent=2)+'\n')
          print(json.dumps({'candidate_sha256':digest,'candidate_bytes':video.stat().st_size,'technical_qa':'PASS','creative_review':'PENDING'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: long-review-video
          path: retained/candidate.mp4
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: long-review-evidence
          path: review-evidence/
          retention-days: 14
          if-no-files-found: error
