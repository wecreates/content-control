name: Long retained caption repair and review candidate
on:
  push:
    branches: [codex/long-caption-diagnostic-20261023]
    paths: ['.github/workflows/long-caption-diagnostic.yml', 'scripts/v2_transcription_repair.py', 'tests/test_v2_transcription_repair.py']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact retained artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          run=api('actions/runs/39993662037')
          assert run['head_sha']=='0413f767ce00d41c9f4063301833db479bebbedf'
          assert run['path']=='.github/workflows/production-execution.yml'
          artifact=api('actions/artifacts/12518594645')
          assert artifact['workflow_run']['id']==39993662037
          assert artifact['name']=='production-state-long' and not artifact['expired']
          print('Verified exact retained Long source; read-only diagnostic.')
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12518594645'
          run-id: '39993662037'
          github-token: ${{ github.token }}
          path: state/production-long
          merge-multiple: true
      - name: Emit bounded caption evidence only
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('state/production-long')
          for name in ['captions.json','v2_captions.log']:
              p=root/name
              assert p.is_file() and not p.is_symlink() and p.stat().st_size<65536, name
              print('BEGIN '+name)
              print(p.read_text())
              print('END '+name)
          p=root/'transcription-repaired.json'
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<4*1024*1024
          d=json.loads(p.read_text())
          summary={k:d.get(k) for k in ['status','audio_sha256','word_timestamps','sequence_similarity','content_token_recall']}
          summary['word_count']=len(d.get('words',[]))
          summary['repaired_windows']=[{'scene_id':x.get('scene_id'),'repair_reasons':x.get('repair_reasons')} for x in d.get('recognition_repair',{}).get('windows',[])]
          from scripts.v2_captions import norm,coalesce_numeric_tokens
          doc=json.loads(pathlib.Path('projects/long/credit-card-dlc/ccsd.json').read_text())
          scenes=[s for s in doc['scenes'] if s.get('audio',{}).get('dialogue')]
          observed=coalesce_numeric_tokens(d['words'])
          actual=[];boundaries={0:0}
          for i,w in enumerate(observed):
              actual.extend(norm(w['word']).split());boundaries[len(actual)]=i+1
          expected=[];violations=[]
          for n,s in enumerate(scenes):
              first=len(expected)
              expected.extend(norm(s['audio']['dialogue'][0]['text']).split())
              end=scenes[n+1]['start'] if n+1<len(scenes) else doc['duration_seconds']
              if first in boundaries and len(expected) in boundaries:
                  words=observed[boundaries[first]:boundaries[len(expected)]]
                  if words and (words[0]['start']<s['start'] or words[-1]['end']>end):
                      violations.append({'scene_id':s['id'],'start':s['start'],'end':end,'observed_start':words[0]['start'],'observed_end':words[-1]['end']})
          assert actual==expected
          summary['dialogue_window_violations']=violations[:30]
          summary['violation_count']=len(violations)
          print(json.dumps(summary))
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install bounded CPU ASR dependencies
        run: |
          command -v ffmpeg || (sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo timeout 900 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg)
          python -m pip install --disable-pip-version-check numpy -r requirements-transcription.txt
      - name: Test strict caption and repair guards
        run: python -m unittest tests.test_v2_transcription_repair tests.test_v2_captions -v
      - name: Verify completed retained stages before resume
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path.cwd().resolve()
          work=root/'state/production-long'
          state=json.loads((work/'execution.json').read_text())
          assert hashlib.sha256(pathlib.Path('projects/long/credit-card-dlc/ccsd.json').read_bytes()).hexdigest()=='2b95d6c320a9add7ca40700540a900172fe5063cf7cfbd78d09bff2a2fa7c021'
          assert hashlib.sha256((work/'voice.wav').read_bytes()).hexdigest()=='b89b60dab969964a0d488139f504718491650f8833266c5dee0d11ad026897a2'
          for name in ['voice','assembly','mix','transcription_contract','transcription']:
              record=state['stages'][name]
              assert record['status']=='PASS' and record['inputs'] and record['outputs'],name
              for key in ['inputs','outputs']:
                  for path,digest in record[key].items():
                      p=pathlib.Path(path)
                      assert p.is_relative_to(root) and p.is_file(),(name,'missing retained path')
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,(name,'changed retained dependency')
              assert str(root/'scripts/v2_execution.py') in record['inputs']
              print(name+': actual retained inputs and outputs verified')
          PY
      - name: Install existing renderer and QA dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check opencv-python-headless
      - name: Resume Long captions, Remotion render, and actual media QA
        run: python scripts/v2_execution.py --ccsd projects/long/credit-card-dlc/ccsd.json --workdir state/production-long --composition StudioLong
      - name: Preserve resumable Long state and actual review media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-state-long
          path: state/production-long/
          retention-days: 14
          if-no-files-found: error
