name: Free Vision QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - 'public/audio/**'
      - 'reference/frames/**'
      - 'scripts/free_*'
      - 'requirements-free-qa.txt'
      - '.github/workflows/free-vision-qa.yml'
permissions:
  contents: write
concurrency:
  group: free-vision-qa
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
  HF_HOME: ~/.cache/huggingface
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements-free-qa.txt
          test -s scripts/free_vision_qa.py
          test -s scripts/free_semantic_qa.py
      - name: Cache free vision models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: free-vision-models-v1
      - name: Render local-only V10
        run: |
          set -euo pipefail
          rm -rf qa-output/free
          mkdir -p qa-output/free/candidate-frames public-review
          npx remotion render remotion/v10-index.jsx Episode1V10FinalProof public-review/episode1-v10-free.mp4 --codec h264 --crf 25 --concurrency 2
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 public-review/episode1-v10-free.mp4 > qa-output/free/streams.txt
          grep -q video qa-output/free/streams.txt
          grep -q audio qa-output/free/streams.txt
          ffmpeg -y -i public-review/episode1-v10-free.mp4 -vf "fps=1/3" -q:v 2 qa-output/free/candidate-frames/cand-%02d.jpg
          ffmpeg -y -i public-review/episode1-v10-free.mp4 -vf "fps=1/3,scale=216:384,tile=5x2:padding=8:margin=8" -frames:v 1 qa-output/free/contact.jpg
      - name: Deterministic pixel and motion QA
        run: |
          python scripts/free_vision_qa.py --reference-dir reference/frames --candidate-video public-review/episode1-v10-free.mp4 --candidate-dir qa-output/free/candidate-frames --output qa-output/free/deterministic.json
      - name: OpenCLIP and Florence-2 semantic QA
        run: |
          python scripts/free_semantic_qa.py --reference-dir reference/frames --candidate-dir qa-output/free/candidate-frames --output qa-output/free/semantic.json
      - name: Bind zero-credit receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("qa-output/free/deterministic.json").read_text())
          s=json.loads(Path("qa-output/free/semantic.json").read_text())
          ok=d["verdict"]=="PASS" and s["verdict"]=="PASS"
          r={
            "schema_version":1,
            "status":"FREE_QA_GREEN" if ok else "FREE_QA_FAIL",
            "candidate_sha256":d["candidate_sha256"],
            "duration_seconds":d["duration_seconds"],
            "publication_enabled":False,
            "credit_cost":0,
            "paid_vision_dependency":False,
            "reference_source":"repository-local reference/frames",
            "audio_source":"repository-local public/audio",
            "deterministic":d,
            "semantic":s,
            "phone_watch_path":"public-review/episode1-v10-free.mp4",
            "contact_sheet":"qa-output/free/contact.jpg",
          }
          Path("qa-output/free/final-receipt.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":r["status"],"sha":r["candidate_sha256"]},sort_keys=True))
          if not ok: raise SystemExit(4)
          PY
      - name: Enforce regression lock and update canonical health
        run: |
          python scripts/enforce_free_qa_regression.py qa-output/free/final-receipt.json state/content-control-health.json
      - name: Persist free QA proof
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f qa-output/free public-review/episode1-v10-free.mp4 state/content-control-health.json
          git diff --cached --quiet || git commit -m "Persist zero credit V10 QA proof"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: episode1-v10-free-qa
          path: |
            public-review/episode1-v10-free.mp4
            qa-output/free/contact.jpg
            qa-output/free/deterministic.json
            qa-output/free/semantic.json
            qa-output/free/final-receipt.json
          retention-days: 30
