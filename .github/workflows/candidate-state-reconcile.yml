name: Candidate State Reconcile
# repair-dispatch-marker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/candidate-state-reconcile.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: candidate-state-reconcile
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      - name: Verify pinned main checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical candidate inputs agree
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          health=json.load(open("state/content-control-health.json"))
          receipt=json.load(open("qa-output/free/final-receipt.json"))
          media=pathlib.Path("public-review/episode1-v10-free.mp4")
          h=hashlib.sha256(media.read_bytes()).hexdigest()
          expected=health["candidate_sha256"]
          assert health["status"]=="GREEN"
          assert receipt["status"]=="FREE_QA_GREEN"
          assert receipt["candidate_sha256"]==expected
          assert h==expected
          assert health["publication_enabled"] is False
          assert receipt["publication_enabled"] is False
          print({"candidate_sha256":expected})
          PY
      - name: Test canonical caption provenance
        run: python -m unittest -v tests.test_caption_provenance tests.test_persist_caption_evidence
      - name: Reconcile ledger without rerender
        run: |
          set -euo pipefail
          python scripts/update_acceptance_ledger.py qa-output/free/final-receipt.json public-review/episode1-v10-free.mp4 state/accepted-candidate-ledger.json
          python scripts/verify_acceptance_ledger.py
      - name: Reconcile verified captions without rerender
        if: ${{ !cancelled() }}
        run: |
          verification_args=()
          if [ "${{ job.status }}" = success ]; then
            python scripts/build_verified_captions.py state/narration-transcription-health.json public-review/episode1-v10-free.vtt || verification_args+=(--upstream-failed)
          else
            verification_args+=(--upstream-failed)
          fi
          python scripts/verify_captions.py public-review/episode1-v10-free.vtt state/narration-transcription-health.json state/caption-health.json "${verification_args[@]}"
      - name: Persist reconciled candidate state
        if: ${{ !cancelled() }}
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          python scripts/persist_caption_evidence.py --kind reconcile --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Resume promotion chain
        run: gh workflow run review-server-smoke.yml --ref main
