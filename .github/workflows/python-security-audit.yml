name: Python Runtime Security Audit
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Run read-only security regression tests only (no audit persistence)'
        type: boolean
        default: true
      expected_sha:
        description: 'Exact 40-character commit SHA expected at the selected ref'
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'requirements-free-qa.lock.txt'
      - 'requirements-transcription.txt'
      - 'requirements-pod-runtime.txt'
      - 'scripts/normalize_python_security_audit.py'
      - 'tests/test_python_security_audit.py'
      - 'tests/test_security_workflow_hardening.py'
      - 'tests/test_pillow_security_compatibility.py'
      - '.github/workflows/python-security-audit.yml'
  schedule:
    - cron: '13 11 * * 2'
permissions:
  contents: read
concurrency:
  group: python-security-audit-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.validation_only && 'validation' || 'audit' }}
  cancel-in-progress: true
jobs:
  validation:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify requested commit before checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned security validation wheels
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps Pillow==13.0.0 PyYAML==6.0.3
      - name: Run exact offline regression and synthetic-image suites
        run: |
          python -m unittest discover -s tests -p test_security_workflow_hardening.py -v
          python -m unittest discover -s tests -p test_python_security_audit.py -v
          python -m unittest discover -s tests -p test_pillow_security_compatibility.py -v
  audit:
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.validation_only)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify manual audit commit before checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create fresh evidence directory
        id: evidence
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/python-security-audit.XXXXXX")
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow-test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps PyYAML==6.0.3
      - name: Test security workflow hardening
        run: python -m unittest discover -s tests -p test_security_workflow_hardening.py -v
      - name: Test audit normalization
        run: python -m unittest discover -s tests -p test_python_security_audit.py -v
      - name: Install audit tool
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit Python lock files
        continue-on-error: true
        run: |
          set +e
          rm -f /tmp/{transcription,qa,pod}-audit.json /tmp/{transcription,qa,pod}-exit
          pip-audit -r requirements-transcription.txt --format json -o /tmp/transcription-audit.json
          echo $? > /tmp/transcription-exit
          pip-audit -r requirements-free-qa.lock.txt --format json -o /tmp/qa-audit.json
          echo $? > /tmp/qa-exit
          pip-audit -r requirements-pod-runtime.txt --format json -o /tmp/pod-audit.json
          echo $? > /tmp/pod-exit
          exit 0
      - name: Normalize Python security report
        if: always() && steps.evidence.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          python scripts/normalize_python_security_audit.py --input-dir /tmp --output "$EVIDENCE_DIR/python-security-audit.json"
      - name: Bind evidence to this run
        id: receipt
        if: always() && steps.evidence.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PYMETA'
          import json, os, pathlib
          from datetime import datetime, timezone
          directory = pathlib.Path(os.environ['EVIDENCE_DIR'])
          report = directory / 'python-security-audit.json'
          document = json.loads(report.read_text())
          assert document['status'] in ('PASS', 'FAIL', 'ERROR')
          path = directory / 'python-security-audit-provenance.json'
          path.write_text(json.dumps({**{key: os.environ[key] for key in ('SOURCE_SHA', 'SOURCE_REF', 'RUN_ID', 'RUN_ATTEMPT')}, 'recorded_at': datetime.now(timezone.utc).isoformat()}, sort_keys=True) + '\n')
          PYMETA
      - uses: actions/upload-artifact@v4
        if: always() && steps.receipt.outcome == 'success'
        with:
          name: python-security-audit-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.evidence.outputs.directory }}/python-security-audit.json
            ${{ steps.evidence.outputs.directory }}/python-security-audit-provenance.json
          retention-days: 30
