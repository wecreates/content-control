name: Python Runtime Security Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements-free-qa.lock.txt'
      - 'requirements-transcription.txt'
      - '.github/workflows/python-security-audit.yml'
  schedule:
    - cron: '13 11 * * 2'
permissions:
  contents: write
concurrency:
  group: python-security-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit Python lock files
        continue-on-error: true
        run: |
          set +e
          pip-audit -r requirements-transcription.txt --format json -o /tmp/transcription-audit.json
          echo $? > /tmp/transcription-exit
          pip-audit -r requirements-free-qa.lock.txt --format json -o /tmp/qa-audit.json
          echo $? > /tmp/qa-exit
          exit 0
      - name: Normalize Python security report
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p):
              path=pathlib.Path(p)
              if not path.exists() or not path.stat().st_size:
                  return {"dependencies":[]}
              return json.loads(path.read_text())
          def vulns(doc):
              out=[]
              deps=doc if isinstance(doc,list) else doc.get("dependencies",[])
              for d in deps:
                  for v in d.get("vulns",[]) or []:
                      out.append({
                          "package":d.get("name"),
                          "version":d.get("version"),
                          "id":v.get("id"),
                          "fix_versions":v.get("fix_versions",[]),
                          "description":v.get("description"),
                      })
              return out
          trans=load("/tmp/transcription-audit.json")
          qa=load("/tmp/qa-audit.json")
          tv=vulns(trans); qv=vulns(qa)
          report={
              "schema_version":1,
              "status":"PASS" if not tv and not qv else "FAIL",
              "transcription_vulnerabilities":tv,
              "qa_vulnerabilities":qv,
              "total_vulnerabilities":len(tv)+len(qv),
              "publication_enabled":False,
          }
          pathlib.Path("state/python-security-audit.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,sort_keys=True))
          if report["status"]!="PASS": raise SystemExit(2)
          PY
      - name: Persist Python security evidence
        if: always()
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/python-security-audit.json
          git diff --cached --quiet || git commit -m "Update Python dependency security audit"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-audit
          path: state/python-security-audit.json
          retention-days: 30
