name: Python Runtime Security Audit
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Run read-only security regression tests only (no audit persistence)'
        type: boolean
        default: true
      expected_sha:
        description: 'Exact 40-character commit SHA expected at the selected ref'
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'requirements-free-qa.lock.txt'
      - 'requirements-transcription.txt'
      - 'requirements-pod-runtime.txt'
      - 'scripts/normalize_python_security_audit.py'
      - 'tests/test_python_security_audit.py'
      - '.github/workflows/python-security-audit.yml'
  schedule:
    - cron: '13 11 * * 2'
permissions:
  contents: read
concurrency:
  group: python-security-audit-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.validation_only && 'validation' || 'audit' }}
  cancel-in-progress: true
jobs:
  validation:
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify requested commit before checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only patched Pillow wheel
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps Pillow==13.0.0
      - name: Run exact offline regression and synthetic-image suites
        run: |
          python -m unittest discover -s tests -p test_python_security_audit.py -v
          python -m unittest discover -s tests -p test_pillow_security_compatibility.py -v
  audit:
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.validation_only)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit normalization
        run: python -m unittest discover -s tests -p test_python_security_audit.py -v
      - name: Install audit tool
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit Python lock files
        continue-on-error: true
        run: |
          set +e
          rm -f /tmp/{transcription,qa,pod}-audit.json /tmp/{transcription,qa,pod}-exit
          pip-audit -r requirements-transcription.txt --format json -o /tmp/transcription-audit.json
          echo $? > /tmp/transcription-exit
          pip-audit -r requirements-free-qa.lock.txt --format json -o /tmp/qa-audit.json
          echo $? > /tmp/qa-exit
          pip-audit -r requirements-pod-runtime.txt --format json -o /tmp/pod-audit.json
          echo $? > /tmp/pod-exit
          exit 0
      - name: Normalize Python security report
        if: always()
        run: |
          python scripts/normalize_python_security_audit.py --input-dir /tmp --output state/python-security-audit.json
      - name: Persist Python security evidence
        if: always()
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/python-security-audit.json
          git diff --cached --quiet || git commit -m "Update Python dependency security audit"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-audit
          path: state/python-security-audit.json
          retention-days: 30
