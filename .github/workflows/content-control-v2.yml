name: Content Control V2 Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/v2/**'
      - 'scripts/v2_acceptance.py'
      - 'tests/test_v2_acceptance.py'
      - 'scripts/v2_orchestrator.py'
      - 'scripts/v2_audio_assemble.py'
      - 'scripts/v2_free_voice.py'
      - 'scripts/free_transcription_qa.py'
      - 'requirements-transcription.txt'
      - 'tests/test_transcription_*.py'
      - 'control/free-voice-policy.json'
      - 'tests/test_v2_free_voice.py'
      - 'scripts/v2_sound_mix.py'
      - 'scripts/persist_v2_artifacts.py'
      - 'tests/test_persist_v2_artifacts.py'
      - 'scripts/v2_captions.py'
      - 'scripts/v2_clip_transcription.py'
      - 'tests/test_v2_clip_transcription.py'
      - 'scripts/v2_build_status.py'
      - 'scripts/rendered_visual_parity.py'
      - 'scripts/v2_render_receipts.py'
      - 'tests/test_v2_render_receipts.py'
      - 'scripts/production_reality_media_qa.py'
      - 'tests/test_production_reality_media_qa.py'
      - 'tests/test_rendered_visual_parity.py'
      - 'scripts/verify_caption_frames.mjs'
      - 'tests/verify-caption-frames.test.mjs'
      - 'tests/test_v2_captions.py'
      - 'tests/test_v2_build_status.py'
      - 'tests/test_v2_sound_mix.py'
      - 'tests/test_v2_audio_assemble.py'
      - 'projects/v2/amex-vs-chase-boss-fight/ccsd.json'
      - 'remotion/**'
      - 'creative-handoff.js'
      - 'tests/creative-handoff.test.mjs'
      - '.github/workflows/content-control-v2.yml'
      # Review-only records apply to existing bytes; never regenerate them.
      - '!projects/v2/**/rendered-creative-review.json'
      - '!projects/v2/**/revision-review.json'
      - '!projects/v2/**/competitive-review-evidence.json'
permissions:
  contents: write
env:
  PUBLICATION_ENABLED: "false"
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: V2 acceptance tests
        run: python -m unittest -v tests/test_v2_acceptance.py tests/test_v2_audio_assemble.py tests/test_v2_runtime_tick.py tests/test_v2_captions.py tests/test_v2_build_status.py
      - name: Verify complete creative review before customer handoff
        run: node --test tests/creative-handoff.test.mjs tests/observed-captions.test.mjs
      - name: Verify job cannot falsely report READY
        run: |
          python - <<'PY'
          import json
          from scripts.v2_acceptance import evaluate
          s=json.load(open("projects/v2/amex-vs-chase-boss-fight/job.json"))["acceptance"]
          result=evaluate(s)
          print(json.dumps(result,indent=2))
          assert result["status"]=="BLOCKED", "Unrendered V2 job must never be READY"
          PY
  visual-diagnostics:
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Test stage layout
        run: |
          npm ci
          node --test tests/studio-layout.test.mjs tests/v2-actor-staging.test.mjs tests/v2-framing.test.mjs tests/v2-stage-environment.test.mjs
      - name: Render diagnostic stills (not accepted production)
        run: |
          mkdir -p state/v2/visual-diagnostics
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("projects/v2/amex-vs-chase-boss-fight/ccsd.json"))},separators=(",",":")))')
          FRAMES=$(python -c 'import json; c=json.load(open("projects/v2/amex-vs-chase-boss-fight/ccsd.json")); b=[s["start"] for s in c["scenes"] if s.get("audio",{}).get("dialogue")]+[max(s["end"] for s in c["scenes"])]; print(" ".join(str(round((a+z)*12)) for a,z in zip(b,b[1:])))')
          for frame in $FRAMES; do
            npx remotion still remotion/studio-animatic-index.jsx StudioAnimatic "state/v2/visual-diagnostics/frame-$frame.png" --props="$PROPS" --frame="$frame"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-visual-diagnostics-not-accepted
          path: state/v2/visual-diagnostics
          retention-days: 14
  render:
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install render runtime
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile numpy opencv-python-headless
          python -m pip install -r requirements-transcription.txt
      - name: Generate free locked character voices locally
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          python -m unittest -v tests/test_v2_free_voice.py
          python scripts/v2_free_voice.py --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --out-dir state/v2/generated-audio --receipt state/v2/receipts/free-voice.json
          python scripts/v2_audio_assemble.py --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --manifest state/v2/generated-audio/approved-manifest.json --out state/v2/voice.wav --receipt state/v2/receipts/voice.json
      - name: Test and assemble separate music and effects
        run: |
          python -m unittest -v tests/test_v2_sound_mix.py tests/test_persist_v2_artifacts.py
          python scripts/v2_sound_mix.py --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --voice state/v2/voice.wav --out-dir state/v2/mix --receipt state/v2/receipts/mix.json
      - name: Transcribe actual free narration
        run: |
          python - <<'PYTRANSCRIPT'
          import json
          c=json.load(open("projects/v2/amex-vs-chase-boss-fight/ccsd.json"))
          text=" ".join(d["text"] for s in sorted(c["scenes"],key=lambda s:s["start"]) for d in s.get("audio",{}).get("dialogue",[]))
          json.dump({"publication_enabled":False,"narration_text":text,"expected_duration_seconds":max(s["end"] for s in c["scenes"])},open("state/v2/transcription-contract.json","w"))
          PYTRANSCRIPT
          python scripts/free_transcription_qa.py --audio state/v2/voice.wav --contract state/v2/transcription-contract.json --output state/v2/receipts/transcription.json --model small.en
      - name: Diagnose captions within assembled speech windows
        continue-on-error: true
        run: |
          python -m unittest -v tests/test_v2_clip_transcription.py
          python scripts/v2_clip_transcription.py --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --assembly state/v2/receipts/voice.json --audio state/v2/voice.wav --out state/v2/receipts/clip-transcription.json --model small.en
      - name: Align captions to actual spoken words
        run: python scripts/v2_captions.py --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --transcription state/v2/receipts/transcription.json --audio state/v2/voice.wav --out state/v2/captions.json
      - name: Verify every caption word reaches a rendered frame
        run: |
          node --test tests/verify-caption-frames.test.mjs
          node scripts/verify_caption_frames.mjs --ccsd projects/v2/amex-vs-chase-boss-fight/ccsd.json --captions state/v2/captions.json --out state/v2/receipts/caption-frames.json
      - name: Compile entertainment-first V2 plan
        run: |
          python - <<'PY'
          import json,os
          os.makedirs("state/v2",exist_ok=True)
          p="state/v2/reference.json"
          c=json.load(open("projects/v2/amex-vs-chase-boss-fight/ccsd.json"))
          starts=[s["start"] for s in c["scenes"] if s.get("audio",{}).get("dialogue")]+[max(s["end"] for s in c["scenes"])]
          json.dump({"scope":"editorial structure only; not observed competitor video evidence","transferable_mechanics":["cold_open","escalation","counter_attack","callback"],"beats":[{"start":a,"end":b} for a,b in zip(starts,starts[1:])]},open(p,"w"))
          PY
          python scripts/v2_orchestrator.py --job projects/v2/amex-vs-chase-boss-fight/job.json --reference state/v2/reference.json --out state/v2/plan.json
      - name: Render V2 entertainment acceptance Short
        id: render_video
        run: |
          mkdir -p state/v2/render state/v2/receipts
          python - <<'PYCAPTIONS'
          import json
          c=json.load(open("projects/v2/amex-vs-chase-boss-fight/ccsd.json"))
          c["caption_track"]=json.load(open("state/v2/captions.json"))
          if c["caption_track"].get("status")!="PASS":raise SystemExit("Observed captions required")
          json.dump(c,open("state/v2/ccsd.json","w"))
          PYCAPTIONS
          python scripts/ccsd_voice_manifest.py --ccsd state/v2/ccsd.json --out state/v2/dialogue.json
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("state/v2/ccsd.json"))},separators=(",",":")))')
          npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic state/v2/render/silent.mp4 --props="$PROPS" --codec=h264 --crf=18
          ffmpeg -y -i state/v2/render/silent.mp4 -i state/v2/mix/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest state/v2/render/v2-boss-fight.mp4
      - name: Preserve internal draft for phone review
        run: |
          cp state/v2/render/v2-boss-fight.mp4 public-review/v2-draft.mp4
          python - <<'PYDRAFT'
          import json,hashlib,os
          p="public-review/v2-draft.mp4"
          json.dump({"run_id":int(os.environ["GITHUB_RUN_ID"]),"source_commit":os.environ["GITHUB_SHA"],"status":"DRAFT","publication_enabled":False,"production_approved":False,"voice_provider":"kokoro_local_cpu","candidate_sha256":hashlib.sha256(open(p,"rb").read()).hexdigest(),"full_av_review":False},open("state/v2-draft.json","w"),indent=2)
          PYDRAFT
          git config user.name "content-control-v2"
          git config user.email "actions@users.noreply.github.com"
          python scripts/persist_v2_artifacts.py --kind draft
      - name: Inspect rendered candidate
        if: ${{ !cancelled() && steps.render_video.outcome == 'success' }}
        run: |
          node --test tests/character-renderer-binding.test.mjs
          node scripts/verify_character_renderer_binding.mjs --candidate state/v2/render/v2-boss-fight.mp4 --out state/v2/receipts/character-binding.json
          node scripts/verify_phone_viewport_playback.mjs --video state/v2/render/v2-boss-fight.mp4 --out state/v2/receipts/phone-viewport.json
          python -m unittest -v tests/test_rendered_visual_parity.py tests/test_production_reality_media_qa.py tests/test_v2_render_receipts.py
          media_status=0
          parity_status=0
          python scripts/production_reality_media_qa.py --video state/v2/render/v2-boss-fight.mp4 --ccsd state/v2/ccsd.json --out state/v2/receipts/render.json || media_status=$?
          python scripts/rendered_visual_parity.py --reference-dir reference/frames --candidate-video state/v2/render/v2-boss-fight.mp4 --out state/v2/receipts/visual-parity.json --visual-review state/visual-analysis/frame-review.json || parity_status=$?
          test "$media_status" -eq 0 && test "$parity_status" -eq 0
      - name: Enforce structural preflight (not rendered creative review)
        run: |
          python - <<'PY'
          import json,sys
          from scripts.v2_orchestrator import creative_gate,derive_metrics
          ccsd=json.load(open("state/v2/ccsd.json"))
          candidate=derive_metrics(ccsd)
          result=creative_gate(candidate)
          result["metrics"]=candidate
          json.dump(result,open("state/v2/receipts/creative.json","w"),indent=2)
          if not result["pass"]: sys.exit("creative QA failed: "+",".join(result["reasons"]))
          PY
      - name: Build fail-closed V2 health package
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          p="state/v2/render/v2-boss-fight.mp4"
          h=hashlib.sha256(open(p,"rb").read()).hexdigest()
          parity=json.load(open("state/v2/receipts/visual-parity.json"))
          media=json.load(open("state/v2/receipts/render.json"))
          from scripts.v2_render_receipts import verified_media_evidence
          media_evidence=verified_media_evidence(h,parity,media)
          review=json.load(open("projects/v2/amex-vs-chase-boss-fight/rendered-creative-review.json"))
          if review.get("status")!="PASS" or review.get("candidate_sha256")!=h or review.get("method")!="rendered_video_review": raise SystemExit("Exact rendered video creative review required")
          import subprocess
          gate=subprocess.run(["node","--input-type=module","-e",'import fs from "node:fs"; import {creativeHandoff} from "./creative-handoff.js"; const x=JSON.parse(fs.readFileSync(0,"utf8")); const r=creativeHandoff(x.review,x.hash,x.media); if(!r.ready){console.error(JSON.stringify(r));process.exit(1);}'],input=json.dumps({"review":review,"hash":h,"media":media_evidence}),text=True)
          if gate.returncode: raise SystemExit("Complete competitor and audiovisual review required")
          shutil.copyfile(p,"public-review/v2-boss-fight.mp4")
          json.dump({"creative_review":review,"media_evidence":media_evidence,"status":"READY","publication_enabled":False,"technical_qa":True,"creative_qa":True,"visual_parity_qa":True,"candidate_sha256":h},open("state/v2-health.json","w"),indent=2)
          PY
      - name: Persist accepted V2 preview for streaming deployment
        run: |
          git config user.name "content-control-v2"
          git config user.email "actions@users.noreply.github.com"
          git add -f public-review/v2-boss-fight.mp4 state/v2-health.json
          git diff --cached --quiet || git commit -m "Publish verified V2 preview artifact [skip ci]"
          git push origin HEAD:main
      - name: Persist actual build results without approving a preview
        if: always()
        env:
          BUILD_OUTCOME: ${{ job.status }}
        run: |
          python scripts/v2_build_status.py --root state/v2 --run-id "$GITHUB_RUN_ID" --source-commit "$GITHUB_SHA" --outcome "$BUILD_OUTCOME" --out state/v2-production-status.json
          git config user.name "content-control-v2"
          git config user.email "actions@users.noreply.github.com"
          python scripts/persist_v2_artifacts.py --kind report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-control-v2-acceptance
          path: state/v2
          retention-days: 14
