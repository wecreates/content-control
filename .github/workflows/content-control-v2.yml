name: Content Control V2 Acceptance
on:
  workflow_dispatch:
  push:
    branches: [v2-production-engine]
    paths:
      - 'projects/v2/**'
      - 'scripts/v2_acceptance.py'
      - 'tests/test_v2_acceptance.py'
      - '.github/workflows/content-control-v2.yml'
permissions:
  contents: read
env:
  PUBLICATION_ENABLED: "false"
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: V2 acceptance tests
        run: python -m unittest -v tests/test_v2_acceptance.py
      - name: Verify job cannot falsely report READY
        run: |
          python - <<'PY'
          import json
          from scripts.v2_acceptance import evaluate
          s=json.load(open("projects/v2/amex-vs-chase-boss-fight/job.json"))["acceptance"]
          result=evaluate(s)
          print(json.dumps(result,indent=2))
          assert result["status"]=="BLOCKED", "Unrendered V2 job must never be READY"
          PY
  render:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install render runtime
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Render V2 entertainment acceptance Short
        run: |
          mkdir -p state/v2/render state/v2/receipts
          cp projects/shorts/credit-score-boss-fight/ccsd.json state/v2/ccsd.json
          python scripts/ccsd_voice_manifest.py --ccsd state/v2/ccsd.json --out state/v2/dialogue.json
          python scripts/local_tts_fallback.py --dialogue state/v2/dialogue.json --out state/v2/voice.wav --receipt state/v2/receipts/voice.json
          PROPS=$(python -c 'import json; print(json.dumps({"ccsd":json.load(open("state/v2/ccsd.json"))},separators=(",",":")))')
          npx remotion render remotion/studio-animatic-index.jsx StudioAnimatic state/v2/render/silent.mp4 --props="$PROPS" --codec=h264 --crf=18
          ffmpeg -y -i state/v2/render/silent.mp4 -i state/v2/voice.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest state/v2/render/v2-boss-fight.mp4
          python scripts/production_reality_media_qa.py --video state/v2/render/v2-boss-fight.mp4 --ccsd state/v2/ccsd.json --out state/v2/receipts/render.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-control-v2-acceptance
          path: state/v2
          retention-days: 14
