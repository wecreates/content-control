name: Maximum Throughput Factory
on:
  workflow_dispatch:
  repository_dispatch:
    types: [production-cycle, repair-cycle]
permissions:
  contents: read
  actions: write
concurrency:
  group: maximum-throughput-channel-1
  cancel-in-progress: false
env:
  PUBLICATION_ENABLED: "false"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      artifact_ready: ${{ steps.s.outputs.artifact_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          test -f review-input/FINANCE_REVIEW_4_9.mp4 && A=true || A=false
          echo "artifact_ready=$A" >> "$GITHUB_OUTPUT"
  research:
    needs: plan
    runs-on: ubuntu-latest
    steps: [{run: "echo research/source lane eligible"}]
  factual:
    needs: plan
    runs-on: ubuntu-latest
    steps: [{run: "echo factual lane eligible"}]
  animation:
    needs: plan
    strategy:
      fail-fast: false
      matrix: {worker: [1,2,3,4]}
    runs-on: ubuntu-latest
    steps: [{run: "echo animation worker ${{ matrix.worker }} eligible; component-hash cache controls invalidation"}]
  audio:
    needs: plan
    strategy:
      fail-fast: false
      matrix: {worker: [1,2]}
    runs-on: ubuntu-latest
    steps: [{run: "echo audio worker ${{ matrix.worker }} eligible"}]
  packaging:
    needs: plan
    runs-on: ubuntu-latest
    steps: [{run: "echo packaging lane eligible"}]
  captions:
    needs: plan
    runs-on: ubuntu-latest
    steps: [{run: "echo caption lane eligible"}]
  incremental_qc:
    needs: [animation,audio,captions,factual]
    if: always()
    runs-on: ubuntu-latest
    steps: [{run: "echo incremental QC fan-in; reject bad components before assembly"}]
  shard_review:
    needs: plan
    if: needs.plan.outputs.artifact_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [hook,ch1,ch2,ch3,ch4_end]
    runs-on: ubuntu-latest
    steps: [{run: "echo specialist discovery review shard ${{ matrix.shard }}; never grants release approval"}]
  timeline_assembly:
    needs: [incremental_qc,packaging]
    if: always()
    runs-on: ubuntu-latest
    steps: [{run: "echo timeline-safe incremental assembly; unchanged hashes retained"}]
  targeted_repair:
    needs: [timeline_assembly,shard_review]
    if: always()
    strategy:
      fail-fast: false
      matrix: {candidate: [A,B]}
    runs-on: ubuntu-latest
    steps: [{run: "echo speculative targeted repair candidate ${{ matrix.candidate }} only when findings exist"}]
  final_global_gate:
    needs: targeted_repair
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Complete end-to-end AV review remains mandatory."
          echo "Creator comparison remains mandatory."
          echo "Publication remains disabled pending exact green candidate + Chris approval."
