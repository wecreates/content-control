name: System Wiring Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '29 11 * * *'
  push:
    branches: [main]
    paths:
      - 'control/**'
      - 'remotion/**'
      - 'scripts/**'
      - 'tests/**'
      - 'server-lowmem.js'
      - 'render.yaml'
      - 'package.json'
      - 'state/canonical-workflow-registry.json'
      - '.github/workflows/**'
permissions:
  contents: write
concurrency:
  group: system-wiring-audit
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run wiring unit tests
        run: python -m unittest -v tests/test_system_wiring.py tests/test_creative_blueprint.py
      - name: Audit complete production graph
        id: audit
        continue-on-error: true
        run: python scripts/audit_system_wiring.py
      - name: Verify workflow control
        id: workflow_control
        continue-on-error: true
        run: python scripts/verify_workflow_control.py
      - name: Persist wiring health
        if: always()
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/system-wiring-health.json state/workflow-control-health.json
          git diff --cached --quiet || git commit -m "Update system wiring health"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - name: Enforce wiring and workflow-control audits
        if: always()
        run: |
          python - <<'PY'
          import json
          wiring=json.load(open("state/system-wiring-health.json"))
          control=json.load(open("state/workflow-control-health.json"))
          if wiring.get("status")!="PASS" or control.get("status")!="PASS":
              raise SystemExit(2)
          PY
