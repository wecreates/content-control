name: Episode 3 Cashback Casino Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/episode3-cashback-casino.yml'
permissions:
  contents: write
concurrency:
  group: episode3-cashback-casino
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
  HF_HOME: ~/.cache/huggingface
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-free-qa.lock.txt
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          python -m pip install -r requirements-free-qa.lock.txt
      - name: Vendor narration
        run: |
          set -euo pipefail
          mkdir -p public/audio qa-output/episode3 public-review
          curl --fail --location --retry 5 --retry-all-errors             "https://www.aidocmaker.com/g0/audio?name=41f8f697e1324f099b3922e819181686"             -o public/audio/episode3-cashback.mp3
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of json public/audio/episode3-cashback.mp3 > qa-output/episode3/voice-probe.json
      - name: Render
        run: |
          set -euo pipefail
          rm -rf qa-output/episode3/candidate-frames
          mkdir -p qa-output/episode3/candidate-frames
          npx remotion render remotion/episode3-index.jsx CashbackCasino public-review/episode3-cashback-casino.raw.mp4 --codec h264 --crf 23 --concurrency 2
          ffmpeg -y -i public-review/episode3-cashback-casino.raw.mp4 -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium -c:a aac -b:a 192k -movflags +faststart public-review/episode3-cashback-casino.mp4
          rm public-review/episode3-cashback-casino.raw.mp4
          ffmpeg -y -i public-review/episode3-cashback-casino.mp4 -vf "fps=1/3" -q:v 2 qa-output/episode3/candidate-frames/cand-%02d.jpg
          ffmpeg -y -i public-review/episode3-cashback-casino.mp4 -vf "fps=1/3,scale=216:384,tile=5x2:padding=8:margin=8" -frames:v 1 qa-output/episode3/contact.jpg
      - name: Audio QA
        run: python scripts/free_audio_qa.py --video public-review/episode3-cashback-casino.mp4 --output qa-output/episode3/audio.json
      - name: Deterministic visual QA
        run: python scripts/free_vision_qa.py --reference-dir reference/frames --candidate-video public-review/episode3-cashback-casino.mp4 --candidate-dir qa-output/episode3/candidate-frames --output qa-output/episode3/deterministic.json
      - name: Semantic visual QA
        run: python scripts/free_semantic_qa.py --reference-dir reference/frames --candidate-dir qa-output/episode3/candidate-frames --output qa-output/episode3/semantic.json
      - name: Mobile QA
        run: python scripts/free_mobile_compat_qa.py --video public-review/episode3-cashback-casino.mp4 --output qa-output/episode3/mobile.json
      - name: Factual contract
        run: |
          python - <<'PY'
          import ast,json,pathlib
          c=json.load(open("state/episode3-factual-contract.json"))
          checks={"publication_disabled":c["publication_enabled"] is False,"educational_example":c["educational_example"] is True}
          ar=[]
          for a in c["arithmetic"]:
              v=eval(compile(ast.parse(a["expression"],mode="eval"),"<e>","eval"),{"__builtins__":{}},{})
              ok=abs(float(v)-float(a["expected"]))<1e-9
              ar.append({**a,"computed":v,"pass":ok})
          checks["arithmetic"]=all(x["pass"] for x in ar)
          checks["no_risky_phrases"]=all(x.lower() not in c["narration_text"].lower() for x in c["prohibited_risky_phrases"])
          r={"schema_version":1,"status":"PASS" if all(checks.values()) else "FAIL","checks":checks,"arithmetic":ar,"publication_enabled":False}
          pathlib.Path("qa-output/episode3/factual.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          if r["status"]!="PASS": raise SystemExit(2)
          PY
      - name: Bind receipt
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("public-review/episode3-cashback-casino.mp4")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          parts={k:json.load(open(f"qa-output/episode3/{k}.json")) for k in ["audio","deterministic","semantic","mobile","factual"]}
          ok=parts["audio"]["verdict"]=="PASS" and parts["deterministic"]["verdict"]=="PASS" and parts["semantic"]["verdict"]=="PASS" and parts["mobile"]["status"]=="PASS" and parts["factual"]["status"]=="PASS"
          r={"schema_version":1,"status":"GREEN" if ok else "FAIL","candidate_sha256":h,"title":"2% Cashback Turned Dave's Brain Into a Casino","publication_enabled":False,"credit_cost":0,"video_path":"public-review/episode3-cashback-casino.mp4","contact_sheet":"qa-output/episode3/contact.jpg","parts":parts}
          pathlib.Path("state/episode3-health.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":r["status"],"candidate_sha256":h}))
          if not ok: raise SystemExit(3)
          PY
      - name: Persist candidate
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f public/audio/episode3-cashback.mp3 public-review/episode3-cashback-casino.mp4 qa-output/episode3 state/episode3-health.json
          git diff --cached --quiet || git commit -m "Persist entertainment-first cashback casino candidate"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode3-cashback-casino
          path: |
            public-review/episode3-cashback-casino.mp4
            qa-output/episode3/contact.jpg
            state/episode3-health.json
          retention-days: 30
