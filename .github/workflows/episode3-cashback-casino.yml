name: Episode 3 Cashback Casino Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/CashbackCasinoVisual.jsx'
      - 'remotion/CashbackCasino.jsx'
      - 'remotion/CharacterSystem.jsx'
      - 'remotion/episode3-index.jsx'
      - 'state/episode3-factual-contract.json'
      - 'production/episode3/creative-blueprint.json'
      - 'control/character-bible-v1.json'
      - 'control/style-dna-v3.json'
      - 'control/creative-director-v3.json'
      - 'scripts/validate_creative_blueprint.py'
      - '.github/workflows/episode3-cashback-casino.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: episode3-cashback-casino
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: "false"
  HF_HOME: ~/.cache/huggingface
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-free-qa.lock.txt
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --prefer-offline --ignore-scripts --no-audit --fund=false
          python -m pip install -r requirements-free-qa.lock.txt
      - name: Validate creative blueprint
        run: python scripts/validate_creative_blueprint.py production/episode3/creative-blueprint.json
      - name: Verify character identity source
        run: |
          set -euo pipefail
          grep -q 'from "./CharacterSystem"' remotion/CashbackCasinoVisual.jsx
          grep -q '<Dave ' remotion/CashbackCasinoVisual.jsx
          grep -q '<PointsMonk ' remotion/CashbackCasinoVisual.jsx
          grep -q '<CashbackGoblin ' remotion/CashbackCasinoVisual.jsx
          grep -q 'export const Dave' remotion/CharacterSystem.jsx
          grep -q 'export const PointsMonk' remotion/CharacterSystem.jsx
          grep -q 'export const CashbackGoblin' remotion/CharacterSystem.jsx
      - name: Vendor narration
        run: |
          set -euo pipefail
          mkdir -p public/audio qa-output/episode3 public-review
          if ! ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 public/audio/episode3-cashback.mp3 >/dev/null 2>&1; then
            rm -f public/audio/episode3-cashback.mp3
            curl --fail --location --retry 5 --retry-all-errors \
              "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/966d9b58-1f7a-4e9c-8153-1cd69b783051.mp3" \
              -o public/audio/episode3-cashback.mp3
          fi
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of json public/audio/episode3-cashback.mp3 > qa-output/episode3/voice-probe.json
          python - <<'PY'
          import json
          d=json.load(open("qa-output/episode3/voice-probe.json"))
          dur=float(d["format"]["duration"])
          assert dur <= 30.25, f"narration would be truncated by 30s composition: {dur:.3f}s"
          assert d.get("streams"), d
          print({"narration_duration_seconds":dur})
          PY
      - name: Render
        run: |
          set -euo pipefail
          rm -rf qa-output/episode3/candidate-frames
          mkdir -p qa-output/episode3/candidate-frames
          npx remotion render remotion/episode3-index.jsx CashbackCasino public-review/episode3-cashback-casino.raw.mp4 --codec h264 --crf 23 --concurrency 2
          ffmpeg -y -i public-review/episode3-cashback-casino.raw.mp4 -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium -c:a aac -b:a 192k -movflags +faststart public-review/episode3-cashback-casino.mp4
          rm public-review/episode3-cashback-casino.raw.mp4
          ffmpeg -y -i public-review/episode3-cashback-casino.mp4 -vf "fps=1/3" -q:v 2 qa-output/episode3/candidate-frames/cand-%02d.jpg
          ffmpeg -y -i public-review/episode3-cashback-casino.mp4 -vf "fps=1/3,scale=216:384,tile=5x2:padding=8:margin=8" -frames:v 1 qa-output/episode3/contact.jpg
      - name: Audio QA
        run: python scripts/free_audio_qa.py --video public-review/episode3-cashback-casino.mp4 --output qa-output/episode3/audio.json
      - name: Deterministic visual QA
        run: python scripts/free_vision_qa.py --reference-dir reference/frames --candidate-video public-review/episode3-cashback-casino.mp4 --candidate-dir qa-output/episode3/candidate-frames --output qa-output/episode3/deterministic.json
      - name: Semantic visual QA
        run: python scripts/free_semantic_qa.py --reference-dir reference/frames --candidate-dir qa-output/episode3/candidate-frames --output qa-output/episode3/semantic.json
      - name: Mobile QA
        run: python scripts/free_mobile_compat_qa.py --video public-review/episode3-cashback-casino.mp4 --output qa-output/episode3/mobile.json
      - name: Factual contract
        run: |
          python - <<'PY'
          import ast,json,pathlib
          c=json.load(open("state/episode3-factual-contract.json"))
          checks={"publication_disabled":c["publication_enabled"] is False,"educational_example":c["educational_example"] is True}
          ar=[]
          for a in c["arithmetic"]:
              v=eval(compile(ast.parse(a["expression"],mode="eval"),"<e>","eval"),{"__builtins__":{}},{})
              ok=abs(float(v)-float(a["expected"]))<1e-9
              ar.append({**a,"computed":v,"pass":ok})
          checks["arithmetic"]=all(x["pass"] for x in ar)
          checks["no_risky_phrases"]=all(x.lower() not in c["narration_text"].lower() for x in c["prohibited_risky_phrases"])
          r={"schema_version":1,"status":"PASS" if all(checks.values()) else "FAIL","checks":checks,"arithmetic":ar,"publication_enabled":False}
          pathlib.Path("qa-output/episode3/factual.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          if r["status"]!="PASS": raise SystemExit(2)
          PY
      - name: Transcription QA
        run: |
          python scripts/free_transcription_qa.py             --audio public/audio/episode3-cashback.mp3             --contract state/episode3-factual-contract.json             --output state/episode3-transcription-health.json
      - name: Build verified captions
        run: |
          python - <<'PY'
          import hashlib,pathlib
          cues=[
            (0.0,3.3,"Dave found two percent cashback. His brain immediately became a casino."),
            (3.3,7.0,"He almost bought an eighty-dollar gadget he did not need."),
            (7.0,9.0,"But I get money back!"),
            (9.0,12.4,"Yes. One dollar and sixty cents. Congratulations, Dave."),
            (12.4,15.7,"You spent eighty dollars to summon this."),
            (15.7,19.6,"Would you buy it without the reward?"),
            (19.6,22.1,"If no, the reward won."),
            (22.1,27.5,"Cashback only wins when the purchase already made sense."),
            (27.5,30.0,"Buy first. Reward second.")
          ]
          def ts(v):
              ms=round(v*1000); h=ms//3600000; ms%=3600000; m=ms//60000; ms%=60000; s=ms//1000; ms%=1000
              return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"
          out=["WEBVTT",""]
          for i,(a,b,t) in enumerate(cues,1):
              out += [str(i),f"{ts(a)} --> {ts(b)}",t,""]
          p=pathlib.Path("public-review/episode3-cashback-casino.vtt")
          p.write_text("\n".join(out),encoding="utf-8")
          assert p.read_text().startswith("WEBVTT")
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Bind receipt
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("public-review/episode3-cashback-casino.mp4")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          parts={k:json.load(open(f"qa-output/episode3/{k}.json")) for k in ["audio","deterministic","semantic","mobile","factual"]}
          ok=parts["audio"]["verdict"]=="PASS" and parts["deterministic"]["verdict"]=="PASS" and parts["semantic"]["verdict"]=="PASS" and parts["mobile"]["status"]=="PASS" and parts["factual"]["status"]=="PASS"
          captions=pathlib.Path("public-review/episode3-cashback-casino.vtt")
          caption_sha=hashlib.sha256(captions.read_bytes()).hexdigest()
          ok=ok and captions.is_file() and captions.read_text().startswith("WEBVTT")
          r={"schema_version":1,"status":"GREEN" if ok else "FAIL","candidate_sha256":h,"caption_sha256":caption_sha,"title":"2% Cashback Turned Dave's Brain Into a Casino","publication_enabled":False,"credit_cost":0,"video_path":"public-review/episode3-cashback-casino.mp4","caption_path":"public-review/episode3-cashback-casino.vtt","contact_sheet":"qa-output/episode3/contact.jpg","parts":parts}
          pathlib.Path("state/episode3-health.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":r["status"],"candidate_sha256":h}))
          if not ok: raise SystemExit(3)
          PY
      - name: Local hash-bound review smoke
        run: |
          set -euo pipefail
          PORT=10003 node server-lowmem.js > /tmp/episode3-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/ep3-health.json -w "%{http_code}" http://127.0.0.1:10003/episode3/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = "1"
          python - <<'PY'
          import json
          h=json.load(open("/tmp/ep3-health.json"))
          assert h["ok"] is True,h
          assert h["publication"] is False,h
          assert h["hashBound"] is True,h
          assert h["captionReady"] is True,h
          PY
          test "$(curl -sS -o /tmp/ep3-watch.html -w "%{http_code}" http://127.0.0.1:10003/episode3/watch)" = "200"
          grep -q 'src="/episode3/captions"' /tmp/ep3-watch.html
          grep -q 'background:#fff' /tmp/ep3-watch.html
          test "$(curl -sS -o /tmp/ep3-captions.vtt -w "%{http_code}" http://127.0.0.1:10003/episode3/captions)" = "200"
          grep -q '^WEBVTT' /tmp/ep3-captions.vtt
          test "$(curl -sS -H 'Range: bytes=0-1023' -o /tmp/ep3-range.bin -w "%{http_code}" http://127.0.0.1:10003/episode3/media)" = "206"
          test "$(wc -c < /tmp/ep3-range.bin)" = "1024"
          kill "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Persist candidate
        run: |
          set -euo pipefail
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add -f public/audio/episode3-cashback.mp3 public-review/episode3-cashback-casino.mp4 public-review/episode3-cashback-casino.vtt qa-output/episode3 state/episode3-health.json state/episode3-transcription-health.json
          git diff --cached --quiet || git commit -m "Persist entertainment-first cashback casino candidate"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - name: Trigger live verification
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run episode3-live-smoke.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode3-cashback-casino
          path: |
            public-review/episode3-cashback-casino.mp4
            public-review/episode3-cashback-casino.vtt
            qa-output/episode3/contact.jpg
            state/episode3-health.json
          retention-days: 30
