name: Exact AV Reviewer
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Existing production, V2, or verified retained-caption repair run
        required: true
        type: string
      format:
        description: Exact candidate format
        required: true
        type: choice
        options: [short, long, v2]
      review_json_path:
        description: Optional committed reviewer JSON path; blank prepares review only
        type: string
        default: ''
      run_free_api_diagnostic:
        description: Opt in to sampled Gemini AV diagnostics; requires verified free project and secure read identity
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/creator_parity_compare.py'
      - 'tests/test_creator_parity_compare.py'
      - 'creative-handoff.js'
      - 'tests/creative-handoff.test.mjs'
      - 'tests/comparison-pipeline.test.mjs'
      - 'tests/comparison-playback.test.mjs'
      - 'tests/comparison-bound-entrypoints.test.mjs'
      - 'tests/comparison-http-fixture.mjs'
      - 'tests/comparison-input-safety.test.mjs'
      - 'tests/comparison-admission.test.mjs'
      - 'scripts/hosted_comparison_receipt.mjs'
      - 'tests/comparison-fixtures.mjs'
      - 'scripts/comparison_sessions.mjs'
      - 'server-lowmem.js'
      - 'comparison-ui/**'
      - 'tests/comparison-ui.test.mjs'
      - 'tests/comparison-app.test.mjs'
      - 'tests/comparison-browser.mjs'
      - 'scripts/build_offline_comparison.mjs'
      - 'scripts/exact_av_review.mjs'
      - 'scripts/gemini_free_av_review.py'
      - 'tests/test_gemini_free_av_review.py'
      - 'control/gemini-free-av-policy.json'
      - 'scripts/offline_av_review.py'
      - 'tests/test_offline_av_review.py'
      - 'tests/test_review_packets.py'
      - 'tests/exact-av-review.test.mjs'
      - 'tests/review-smoke-contract.test.mjs'
      - 'tests/test_free_review_guards.py'
      - 'tests/test_exact_av_workflow.py'
      - '.github/workflows/review-server-smoke.yml'
      - '.github/workflows/exact-av-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test --test-concurrency=1 tests/exact-av-review.test.mjs tests/creative-handoff.test.mjs tests/comparison-ui.test.mjs tests/comparison-app.test.mjs tests/comparison-playback.test.mjs tests/review-smoke-contract.test.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node --test tests/comparison-pipeline.test.mjs tests/comparison-bound-entrypoints.test.mjs tests/comparison-input-safety.test.mjs tests/comparison-admission.test.mjs
      - run: python -m unittest discover -s tests -p test_creator_parity_compare.py
      - run: python -m unittest discover -s tests -p test_gemini_free_av_review.py
      - run: python -m unittest discover -s tests -p test_free_review_guards.py
      - run: python -m unittest discover -s tests -p test_offline_av_review.py
      - run: python -m unittest discover -s tests -p test_review_packets.py
      - run: python -m unittest discover -s tests -p test_exact_av_workflow.py
  admission-runtime:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ matrix.node }}'}
      - run: node --test tests/comparison-admission.test.mjs
  browser-transport:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/browser-qa --no-audit --no-fund playwright@1.64.1 esbuild@0.25.0
      - run: /tmp/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ffmpeg -v error -f lavfi -i testsrc2=size=360x640:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/comparison-fixture.mp4
      - run: node tests/comparison-browser.mjs /tmp/comparison-fixture.mp4
        env:
          BROWSER_QA_MODULES: /tmp/browser-qa
      - run: node scripts/build_offline_comparison.mjs
        env:
          BROWSER_QA_MODULES: /tmp/browser-qa
      - run: node tests/comparison-browser.mjs /tmp/comparison-fixture.mp4 receipts/Content-Control-Offline-Comparison.html
        env:
          BROWSER_QA_MODULES: /tmp/browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-browser-evidence
          path: |
            receipts/comparison-*
            receipts/Content-Control-Offline-Comparison.html
  prepare-or-validate:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.source.outputs.artifact }}
      media: ${{ steps.source.outputs.media }}
      candidate_sha256: ${{ steps.prepare.outputs.candidate_sha256 }}
    env:
      PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Initialize isolated current review receipts
        id: review_workspace
        run: |
          export REVIEW_RECEIPTS_DIR="$(mktemp -d "$RUNNER_TEMP/exact-av-review.XXXXXX")"
          printf 'REVIEW_RECEIPTS_DIR=%s\n' "$REVIEW_RECEIPTS_DIR" >> "$GITHUB_ENV"
          printf 'receipts=%s\n' "$REVIEW_RECEIPTS_DIR" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,pathlib
          receipt={'schema_version':1,'status':'BLOCKED','reason':'review_attempt_incomplete','review_evidence_validated':False,'publication_enabled':False,'production_approved':False}
          (pathlib.Path(os.environ['REVIEW_RECEIPTS_DIR'])/'review-workflow.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Validate production provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.production_run_id }}
          REVIEW_FORMAT: ${{ inputs.format }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {reviewSource} from './scripts/exact_av_review.mjs';
          const {RUN_ID,GH_REPO,REVIEW_FORMAT}=process.env;
          if(!/^[1-9][0-9]*$/.test(RUN_ID))throw Error('Numeric production run ID required');
          const run=JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/actions/runs/${RUN_ID}`],{encoding:'utf8'}));
          const source=reviewSource(run,{repository:GH_REPO,runId:RUN_ID,format:REVIEW_FORMAT});
          writeFileSync(join(process.env.REVIEW_RECEIPTS_DIR,'source-provenance.json'),JSON.stringify(source,null,2)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,`artifact=${source.artifact}\nmedia=review-input/current/${source.media}\n`);
          JS
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
          path: review-input/current
      - name: Install local media probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare current exact audiovisual review
        id: prepare
        env:
          MEDIA_PATH: ${{ steps.source.outputs.media }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {inspectMedia,prepareReview} from './scripts/exact_av_review.mjs';
          const source=JSON.parse(readFileSync(join(process.env.REVIEW_RECEIPTS_DIR,'source-provenance.json'),'utf8'));
          const media=inspectMedia(process.env.MEDIA_PATH);
          if(source.expected_sha256 && media.candidate_sha256!==source.expected_sha256)throw Error('Recovered repair media hash mismatch');
          writeFileSync(join(process.env.REVIEW_RECEIPTS_DIR,'review-request.json'),JSON.stringify(prepareReview(media),null,2)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,`candidate_sha256=${media.candidate_sha256}\n`);
          JS
      - name: Build free local audiovisual inspection package
        id: offline
        env:
          MEDIA_PATH: ${{ steps.source.outputs.media }}
        run: python scripts/offline_av_review.py --video "$MEDIA_PATH" --out "$REVIEW_RECEIPTS_DIR/offline-review"
      - name: Record disabled API identity configuration
        if: inputs.run_free_api_diagnostic && (vars.GEMINI_AV_IDENTITY_ENABLED != 'true' || vars.GEMINI_AV_WIF_PROVIDER == '' || vars.GEMINI_AV_READ_SERVICE_ACCOUNT == '')
        run: |
          python - <<'PY'
          import json,os,pathlib
          from scripts.gemini_free_av_review import base_receipt
          receipt=base_receipt()|{'reason':'approved_short_lived_project_read_identity_not_configured'}
          with (pathlib.Path(os.environ['REVIEW_RECEIPTS_DIR'])/'gemini-av-diagnostic.json').open('w') as f:json.dump(receipt,f,indent=2)
          print('BLOCKED: approved short-lived project-read identity is not configured; no API upload or review performed.')
          PY
      - name: Validate supplied review against exact media and existing handoff gate
        id: validate
        if: inputs.review_json_path != ''
        env:
          REVIEW_PATH: ${{ inputs.review_json_path }}
          MEDIA_PATH: ${{ steps.source.outputs.media }}
        run: |
          python - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path.cwd().resolve();p=(root/os.environ['REVIEW_PATH']).resolve()
          if not p.is_relative_to(root) or p.suffix!='.json' or not p.is_file():raise SystemExit('Existing repository JSON review required')
          # The downloaded production artifact is untrusted review input, never
          # a substitute for the explicitly requested committed reviewer JSON.
          relative=p.relative_to(root).as_posix();obj='HEAD:'+relative
          if p.stat().st_size>512*1024:raise SystemExit('Reviewer JSON is too large')
          try:
              size=int(subprocess.check_output(['git','cat-file','-s',obj],stderr=subprocess.DEVNULL))
              if size>512*1024:raise ValueError('size')
              committed=subprocess.check_output(['git','show',obj],stderr=subprocess.DEVNULL)
          except (subprocess.CalledProcessError,ValueError):raise SystemExit('Committed repository JSON review required')
          if p.read_bytes()!=committed:raise SystemExit('Reviewer JSON must match the checked-out commit')
          output=str(pathlib.Path(os.environ['REVIEW_RECEIPTS_DIR'])/'review-validation.json')
          subprocess.run(['node','scripts/exact_av_review.mjs','validate',os.environ['MEDIA_PATH'],output,str(p)],check=True)
          PY
      - name: Record current review attempt outcome
        if: always() && steps.review_workspace.outcome == 'success'
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          REVIEW_PATH: ${{ inputs.review_json_path }}
          SOURCE_RUN_ID: ${{ inputs.production_run_id }}
          REVIEW_FORMAT: ${{ inputs.format }}
          EXPECTED_SHA256: ${{ steps.prepare.outputs.candidate_sha256 }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          directory=pathlib.Path(os.environ['REVIEW_RECEIPTS_DIR'])
          stages={name:os.environ.get(name.upper()+'_OUTCOME','') for name in ('source','download','prepare','offline','validate')}
          expected=os.environ.get('EXPECTED_SHA256','');review_supplied=bool(os.environ.get('REVIEW_PATH'))
          complete=all(stages[name]=='success' for name in ('source','download','prepare','offline'))
          complete=complete and stages['validate']==('success' if review_supplied else 'skipped')
          def read(name):
              path=directory/name
              if path.stat().st_size>2*1024*1024:raise ValueError('receipt too large')
              data=json.loads(path.read_text())
              if not isinstance(data,dict):raise ValueError('invalid receipt')
              return data
          try:
              if not re.fullmatch('[0-9a-f]{64}',expected):raise ValueError('missing exact media')
              request=read('review-request.json');offline=read('offline-review/evidence.json')
              complete=complete and request.get('status')=='REVIEW_REQUIRED' and request.get('media',{}).get('candidate_sha256')==expected
              complete=complete and offline.get('candidate_sha256')==expected and offline.get('technical_decode')=='PASS' and offline.get('status')=='REVIEW_PENDING'
              records=[request,offline]
              if review_supplied:
                  validation=read('review-validation.json');records.append(validation)
                  complete=complete and validation.get('candidate_sha256')==expected and validation.get('status')=='VALIDATED_REVIEW' and validation.get('ready') is True
              complete=complete and all(record.get('publication_enabled') is False and record.get('production_approved') is False for record in records)
          except (OSError,ValueError,TypeError,AttributeError):complete=False
          result={'schema_version':1,'status':('VALIDATED_REVIEW' if review_supplied else 'REVIEW_REQUIRED') if complete else 'BLOCKED',
              'reason':'current_review_steps_complete' if complete else 'review_attempt_incomplete_or_invalid','stage_outcomes':stages,
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'source_run_id':os.environ['SOURCE_RUN_ID'],'format':os.environ['REVIEW_FORMAT'],
              'candidate_sha256':expected if re.fullmatch('[0-9a-f]{64}',expected) else None,
              'review_evidence_validated':bool(complete and review_supplied),'publication_enabled':False,'production_approved':False,
              'scope':'Current-run transport and submitted evidence validation only. Does not perform or authenticate creative review; sampled API diagnostics are separate.'}
          (directory/'review-workflow.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Preserve review preparation and validation only
        if: always() && steps.review_workspace.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: exact-av-review-${{ inputs.format }}
          path: ${{ steps.review_workspace.outputs.receipts }}
          retention-days: 14
          if-no-files-found: warn
  free-api-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/main' && inputs.run_free_api_diagnostic && vars.GEMINI_AV_IDENTITY_ENABLED == 'true' && vars.GEMINI_AV_WIF_PROVIDER != '' && vars.GEMINI_AV_READ_SERVICE_ACCOUNT != ''
    needs: [tests, prepare-or-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize incomplete diagnostic receipt
        run: |
          python - <<'PY'
          from scripts.gemini_free_av_review import POLICY, base_receipt, write_receipt
          receipt = base_receipt() | {'reason': 'diagnostic_step_not_completed'}
          write_receipt('receipts/gemini-av-diagnostic.json', receipt, [POLICY])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-or-validate.outputs.artifact }}
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
          path: review-input/current
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Mint approved project-read identity token
        id: google_read_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3, verified 2026-10-17
        with:
          project_id: gen-lang-client-0010384080
          workload_identity_provider: ${{ vars.GEMINI_AV_WIF_PROVIDER }}
          service_account: ${{ vars.GEMINI_AV_READ_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 1800s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only,https://www.googleapis.com/auth/cloud-billing.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Diagnose exact video and audio without approving publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROJECT_READ_TOKEN: ${{ steps.google_read_auth.outputs.access_token }}
          MEDIA_PATH: ${{ needs.prepare-or-validate.outputs.media }}
          EXPECTED_SHA256: ${{ needs.prepare-or-validate.outputs.candidate_sha256 }}
        run: |
          python scripts/gemini_free_av_review.py --video "$MEDIA_PATH" \
            --expected-sha256 "$EXPECTED_SHA256" --output receipts/gemini-av-diagnostic.json
      - name: Preserve sampled diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-av-diagnostic-${{ inputs.format }}
          path: receipts/gemini-av-diagnostic.json
          retention-days: 14
          if-no-files-found: warn

