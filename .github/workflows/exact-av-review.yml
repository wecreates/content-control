name: Exact AV Reviewer
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Existing production execution run containing exact candidate artifacts
        required: true
        type: string
      format:
        description: Exact candidate format
        required: true
        type: choice
        options: [short, long]
      review_json_path:
        description: Optional committed reviewer JSON path; blank prepares review only
        type: string
        default: ''
  pull_request:
    paths:
      - 'scripts/exact_av_review.mjs'
      - 'tests/exact-av-review.test.mjs'
      - '.github/workflows/exact-av-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --test tests/exact-av-review.test.mjs tests/creative-handoff.test.mjs
  prepare-or-validate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      PUBLICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Validate production provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.production_run_id }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          run=os.environ['RUN_ID']
          if not run.isdigit(): raise SystemExit('Numeric production run ID required')
          d=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}']))
          if d['path']!='.github/workflows/production-execution.yml' or d['event'] not in ('push','workflow_dispatch'):
              raise SystemExit('Expected existing production execution workflow')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: production-state-${{ inputs.format }}
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
          path: review-input/current
      - name: Install local media probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare current exact audiovisual review
        run: node scripts/exact_av_review.mjs prepare review-input/current/candidate.mp4 receipts/review-request.json
      - name: Validate supplied review against exact media and existing handoff gate
        if: inputs.review_json_path != ''
        env:
          REVIEW_PATH: ${{ inputs.review_json_path }}
        run: |
          python - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path.cwd().resolve();p=(root/os.environ['REVIEW_PATH']).resolve()
          if not p.is_relative_to(root) or p.suffix!='.json' or not p.is_file():raise SystemExit('Existing repository JSON review required')
          subprocess.run(['node','scripts/exact_av_review.mjs','validate','review-input/current/candidate.mp4','receipts/review-validation.json',str(p)],check=True)
          PY
      - name: Preserve review preparation and validation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-av-review-${{ inputs.format }}
          path: receipts/
          retention-days: 14
          if-no-files-found: warn
