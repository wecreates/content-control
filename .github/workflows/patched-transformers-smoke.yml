name: Patched Transformers QA Compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patched-transformers-smoke.yml'
permissions:
  contents: write
concurrency:
  group: patched-transformers-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build patched QA lock
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("requirements-free-qa.lock.txt").read_text()
          src=src.replace("transformers==4.56.1","transformers==5.10.0")
          Path("/tmp/requirements-patched.txt").write_text(src)
          print(src)
          PY
      - name: Install patched runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-patched.txt
      - name: Audit patched runtime
        run: |
          python -m pip install 'pip-audit>=2.9,<3'
          pip-audit -r /tmp/requirements-patched.txt --format json -o /tmp/patched-audit.json || true
          python - <<'PY'
          import json,pathlib
          d=json.load(open("/tmp/patched-audit.json"))
          deps=d if isinstance(d,list) else d.get("dependencies",[])
          vulns=[]
          for dep in deps:
              for v in dep.get("vulns",[]) or []:
                  vulns.append({"package":dep.get("name"),"version":dep.get("version"),"id":v.get("id"),"fix_versions":v.get("fix_versions",[])})
          pathlib.Path("state/patched-transformers-audit.json").write_text(json.dumps({
            "schema_version":1,
            "status":"PASS" if not vulns else "FAIL",
            "transformers_target":"5.10.0",
            "vulnerabilities":vulns,
            "total_vulnerabilities":len(vulns),
            "publication_enabled":False
          },indent=2,sort_keys=True)+"\n")
          print(vulns)
          if vulns: raise SystemExit(2)
          PY
      - name: Re-run semantic QA with patched Transformers
        run: |
          python scripts/free_semantic_qa.py --reference-dir reference/frames --candidate-dir qa-output/free/candidate-frames --output state/patched-transformers-semantic.json
          python - <<'PY'
          import json
          d=json.load(open("state/patched-transformers-semantic.json"))
          assert d["verdict"]=="PASS",d
          assert d["florence"]["status"]=="PASS",d["florence"]
          print({"status":"PASS","mean_best":d["mean_best_frame_similarity"],"global":d["global_similarity"]})
          PY
      - name: Persist compatibility evidence
        run: |
          git config user.name content-control-runtime
          git config user.email actions@users.noreply.github.com
          git add state/patched-transformers-audit.json state/patched-transformers-semantic.json
          git diff --cached --quiet || git commit -m "Record patched Transformers compatibility evidence"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-transformers-compat
          path: |
            state/patched-transformers-audit.json
            state/patched-transformers-semantic.json
          retention-days: 30
