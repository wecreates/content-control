name: Encoded candidate narration verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_muxed_narration.py'
      - 'tests/test_muxed_narration.py'
      - 'scripts/free_transcription_qa.py'
      - 'scripts/ci_media_tools.sh'
      - 'requirements-transcription.txt'
      - 'scripts/caption_contract.py'
      - 'scripts/review_smoke_inputs.py'
      - 'state/episode1-factual-contract.json'
      - 'public-review/episode1-v10-free.mp4'
      - '.github/workflows/muxed-narration-verification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_muxed_narration.py'
      - 'tests/test_muxed_narration.py'
      - 'scripts/caption_contract.py'
      - 'scripts/review_smoke_inputs.py'
      - 'scripts/free_transcription_qa.py'
      - 'scripts/ci_media_tools.sh'
      - 'requirements-transcription.txt'
      - 'state/episode1-factual-contract.json'
      - 'public-review/episode1-v10-free.mp4'
      - '.github/workflows/muxed-narration-verification.yml'
permissions:
  contents: read
concurrency:
  group: muxed-narration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PUBLICATION_ENABLED: 'false'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-transcription.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en-v1
      - name: Test candidate identity and exact speech checks
        run: python -m unittest -v tests.test_muxed_narration
      - name: Install existing free CPU transcription runtime
        run: |
          bash scripts/ci_media_tools.sh
          python -m pip install -r requirements-transcription.txt
      - name: Transcribe the actual encoded video
        id: transcribe
        continue-on-error: true
        run: |
          mkdir -p /tmp/muxed-narration
          python scripts/free_transcription_qa.py \
            --audio public-review/episode1-v10-free.mp4 \
            --contract state/episode1-factual-contract.json \
            --output /tmp/muxed-narration/transcription.json \
            --model base.en --spoken-numbers
      - name: Require exact script and current video identity
        if: always()
        run: |
          python scripts/verify_muxed_narration.py \
            --video public-review/episode1-v10-free.mp4 \
            --contract state/episode1-factual-contract.json \
            --transcription /tmp/muxed-narration/transcription.json \
            --output /tmp/muxed-narration/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muxed-narration-evidence
          path: /tmp/muxed-narration/
          retention-days: 30
